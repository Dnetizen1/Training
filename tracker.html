.tb-fab{position:fixed;z-index:12;right:var(--g);bottom:var(--tb-b);width:var(--tb-h);height:var(--tb-h);padding:0;border:0;border-radius:50%;
  display:grid;place-items:center;background:var(--acc);color:#000;box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .15s var(--ease)}
.tb-fab > span{display:grid;place-items:center;width:auto;height:auto;background:none;color:inherit;box-shadow:none;transition:transform .3s var(--lg-spring)}
.tb-fab > span svg{width:26px;height:26px;stroke-width:2.4}
.tb-fab:active{transform:scale(.92)}
.tb-fab.open > span{transform:rotate(45deg)}
:root[data-quick="1"] .tb-fab{z-index:41}
.tabbar .lg-ind{border-radius:26px}

/* ===== доводка: шторки, списки, таймер, мелочи ===== */
/* кнопка действия шторки («Готово», «Добавить в тренировку») — внизу, как в iOS, а не над содержимым */
.sheet-foot{order:3}
.sheet-body{order:2}
.sheet-head{order:1}
/* меню в шторке — сгруппированный список: общий фон, строки с тонкими разделителями */
.sheet .menu{background:var(--on-card);border-radius:var(--r-card);overflow:hidden;gap:0}
.sheet .menu .mitem{background:none;border-radius:0;min-height:50px}
.sheet .menu .mitem + .mitem{border-top:.5px solid rgba(255,255,255,.08)}
.sheet .menu .mitem:active{background:rgba(255,255,255,.06)}
/* заметка в итоге: поле без второй подложки внутри плитки */
.notetile textarea{background:none!important;box-shadow:none!important;padding:2px 0 0;border-radius:0}
.notetile:focus-within{box-shadow:inset 0 0 0 1.5px var(--acc)}
/* шеврон в круге — только у стрелки справа, не у иконки слева */
.weekscr details.grp.more > summary span svg,.done-ex > summary span svg{width:16px;height:16px;padding:0;background:none;border-radius:0;color:var(--mute)}
/* закрытые раскрывающиеся строки — капсулы, как «Show All Health Data» */
.weekscr details.grp.more:not([open]),.done-ex:not([open]){border-radius:26px}
.weekscr details.grp.more > summary,.done-ex > summary{min-height:52px}
/* «Вес» на «Прогрессе»: содержимое слева сверху, без пустоты */
.gcard{display:grid;justify-items:start;align-content:start;gap:4px;min-height:0}
/* поиск — капсула 40, как в Telegram */
.hsearch{height:40px;border-radius:20px;margin-top:14px}
/* таймер отдыха — плавающая стеклянная капсула */
.timer{border-radius:26px;background:rgba(30,30,32,.62);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
  box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 0 0 .5px rgba(255,255,255,.14);color:var(--ink)}
.timer .l{color:var(--mute);font-size:15px}
.timer button{background:rgba(255,255,255,.1);color:var(--ink)}
.timer.done{background:var(--acc);color:#000}
.timer.done .l,.timer.done .t{color:#000}
.timer.done button{background:rgba(0,0,0,.12);color:#000}
.topbar{margin-inline:calc(-1*var(--g) + 8px)}
/* когда сверху таймер — компактная шапка опускается под него */
body:has(.topbar .timer) .navmini{top:62px}
/* страницы-сетки не растягивают последнюю карточку на свободное место экрана */
.home,.weekscr,.histv,.fx,.finish{align-content:start}
/* иконка слева в раскрывающихся строках — без круга (круг только у шеврона справа) */
.weekscr details.grp.more > summary > span > svg:last-child,.done-ex > summary > span > svg:last-child{width:16px;height:16px;padding:0;background:none;border-radius:0;color:var(--mute)}
/* нагрузка на мышцы: спокойные оттенки вместо насыщенных полос, заголовки групп без чёрных плашек */
.sheet .lv{background:var(--on-card);border-radius:var(--r-card)}
.sheet .lvg{background:none;padding:14px 16px 6px}
.sheet .lvrow{background:none;border-top-color:rgba(255,255,255,.07)}
.sheet .lvrow.hi{background:color-mix(in srgb,var(--pink) 16%,transparent)}
.sheet .lvrow.mid{background:color-mix(in srgb,var(--blue) 12%,transparent)}
.sheet .lvtotal{border-top-color:rgba(255,255,255,.08)}

/* свёрнутый таймер — стеклянная капсула над нижним меню (как мини-плеер в iOS 26), не занимает строку над шапкой */
.timer-mini{position:fixed;z-index:12;left:var(--g);bottom:calc(var(--tb-b) + var(--tb-h) + 10px);margin:0;height:40px;padding:0 16px 0 12px;border:0;border-radius:20px;
  display:inline-flex;align-items:center;gap:6px;color:var(--acc);font:600 17px var(--num);
  background:rgba(30,30,32,.62);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
  box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 0 0 .5px rgba(255,255,255,.14)}
.timer-mini.done{background:var(--acc);color:#000}
.timer-mini:active{transform:scale(.95)}
.topbar:has(> .timer-mini:only-child){display:contents}
body:has(.timer-mini){padding-bottom:calc(var(--tb-b) + var(--tb-h) + 78px)}
/* всплывашка «… убрано · Вернуть» — тоже стеклянная капсула */
.toast{border-radius:22px;background:rgba(30,30,32,.62);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
  box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 0 0 .5px rgba(255,255,255,.14);color:var(--ink)}
.toast button{color:var(--acc)}

/* ===== v12 — шкала отступов 4 / 8 / 12 / 16 / 24 (замеры 390×844 @3x): шапка → блок 16, раздел 24 сверху и 12 снизу, соседи 8 ===== */
:root{--pad:16px;--gap:8px}

/* шапка: строка заголовка не прыгает от подписи — заголовок всегда на y=17, кнопки на y=10 */
.pg-h{align-items:start}
.pg-h > .pg-c{padding-top:7px}
.pg-h > .pg-act{align-self:start}

/* шапка -> первый блок: 16 */
main .pg-h + .vswitch{margin-top:16px}
.home > .pg-h + .thero{margin-top:16px}
.weekscr > .pg-h ~ .mtiles{margin-top:16px}
.hero > .pg-h + .hseg{margin-top:16px}
main .pg-h + .finish{margin-top:16px}

/* чипсы -> содержимое: 16 */
.histv > .hero + .cal-h,.histv > .hero + .hsearch{margin-top:16px}

/* заголовок раздела: 24 сверху, 12 до содержимого */
main .sec2{margin-top:24px;margin-bottom:12px}
.histv > .cal-h + .cal{margin-top:12px}

/* соседи в одной группе: 8 (--gap); подпись под карточкой: 8 */
.exlist > .exb{margin-top:0;margin-bottom:0}
.exlist > .exb + .exb{margin-top:var(--gap)}
.fx > .setlist{margin-top:var(--gap)}
.fx > .nx{padding:8px 4px 4px}
.fx .notebtn{margin-top:0}
.weekscr > .wkstats{margin-top:var(--gap)}
.weekscr > .wk-low,.weekscr .mnote{margin:var(--gap) 16px 0}
.histv > .dlegend{margin-top:var(--gap);margin-bottom:0}
.histv > .hx-note{margin:16px 16px 8px}

/* отдельная группа без заголовка (подсказка, раскрывашка, кнопки страницы): 16 */
.exlist .addex{margin-top:16px}
.exlist .addex::before{top:-8px}
.fx .finish-btn{margin-top:16px}
.weekscr > .banner{margin-top:16px}
main .done-ex{margin-top:16px}
.done-ex + .finish-btn{margin-top:var(--gap)}

/* итог тренировки */
.finish{gap:var(--gap)}
.finish > .tiles4{margin-top:8px}
.finish > .notetile{margin-top:0}
.finish > .review:not(:has(button,.sum,.st)){display:none}
.finish > .corr{margin-top:16px;gap:0}
.finish > .corr > h3{margin:0 0 12px;font:700 21px/26px var(--disp);letter-spacing:0}
.finish .corr-card{gap:0}
.corr-card > .corr-item{background:none;border-radius:0}
.corr-card > .corr-item + .corr-item{border-top:.5px solid var(--sep)}
.corr-card > .corr-foot{padding:12px 16px 16px}

/* последний блок -> нижняя панель: 24 на всех экранах */
.home,.weekscr,.fx{padding-bottom:0}
body,:root[data-view] body{padding-bottom:calc(var(--tb-b) + var(--tb-h) + 24px)}
:root body:has(.timer-mini),:root[data-view] body:has(.timer-mini){padding-bottom:calc(var(--tb-b) + var(--tb-h) + 72px)}

/* внутренние отступы: карточка 16, компактная плитка 12/16, строка списка 12/16 */
.home .wkcard{padding:var(--pad);gap:16px}
.mtile{padding:12px}
.tiles4 > div:not(.durtile),.durtile > button,.durtile > label{padding:12px 16px}
.notetile{padding:12px 16px}
.hxlist > .hx{padding:12px 16px;border-radius:0}
.exlist > .xrow{padding-inline:16px}
.weekscr .banner{border-radius:var(--r-card)}

/* Дневник тренировок: ядро (утилиты, модель, хранилище, промпты, иконки). React 18 + htm, без сборки. */
const {useState,useEffect,useRef,useSyncExternalStore}=React;
const html=htm.bind(React.createElement);

/* ---------- Утилиты ---------- */
const todayStr=()=>new Date().toLocaleDateString("sv-SE");
const num=v=>{ const x=parseFloat(String(v??"").replace(",",".")); return isFinite(x)?x:null; };
const fmt=x=>String(Math.round(x*100)/100).replace(".",",");
const rid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dmy=d=>d.split("-").reverse().join(".");
const dm=d=>d.slice(5).split("-").reverse().join(".");
const clone=o=>JSON.parse(JSON.stringify(o));
function weekStart(d){ const t=new Date(d+"T00:00:00"); t.setDate(t.getDate()-(t.getDay()+6)%7); return t.toLocaleDateString("sv-SE"); }
function weekEnd(d){ const t=new Date(weekStart(d)+"T00:00:00"); t.setDate(t.getDate()+6); return t.toLocaleDateString("sv-SE"); }
const restTxt=r=>r>=60?Math.floor(r/60)+":"+String(r%60).padStart(2,"0"):r+" с";

// Безопасный мини-markdown: сначала экранируем, потом заголовки, списки, жирный
function md(src){
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`(.+?)`/g,"<code>$1</code>");
  let out="",list=null; const close=()=>{ if(list){ out+="</"+list+">"; list=null; } };
  for(const raw of esc(src).split("\n")){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){ close(); continue; }
    if((m=l.match(/^#{1,4}\s+(.*)/))){ close(); out+="<h4>"+inl(m[1])+"</h4>"; }
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=="ul"){ close(); out+="<ul>"; list="ul"; } out+="<li>"+inl(m[1])+"</li>"; }
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=="ol"){ close(); out+="<ol>"; list="ol"; } out+="<li>"+inl(m[1])+"</li>"; }
    else { close(); out+="<p>"+inl(l)+"</p>"; }
  }
  close(); return out;
}

/* ---------- Модель упражнения ---------- */
// base>=0 — упражнение программы; base=-1 — добавлено вручную
function xinfo(s,e){
  const pr=progOf(s), row=e.base>=0&&pr.P[s.day]?pr.P[s.day].ex[e.base]:null;
  const plan=row?{ns:row[1],lo:row[2],hi:row[3],rir:row[4],rest:row[5],note:row[6]}:Object.assign({ns:3,lo:8,hi:12,rir:"1",rest:120,note:""},e.plan||{});
  const base=row?row[0]:(e.name||"Упражнение");
  const lv=e.lv||(e.mus?lvFromOld(e.mus):null)||(row?pr.LV[s.day][e.base]:null)||{};
  return {row,custom:!row,base,name:row?(e.alt||base):base,plan,lv,mus:lvWeights(lv)};
}
const musKeys=m=>MUS_ORDER.filter(k=>m[k]);
// нагрузка 0–10 → доля подхода в объёме: высокая (7–10) = 1, средняя (4–6) = 0,5, низкая (1–3) = 0,25
const lvW=v=>v>=7?1:v>=4?.5:v>=1?.25:0;
const lvCat=v=>v>=7?"высокая":v>=4?"средняя":v>=1?"низкая":"";
function lvWeights(lv){ const m={}; for(const k in lv){ const w=lvW(+lv[k]); if(w) m[k]=w; } return m; }
function lvFromOld(m){ const o={}; for(const k in m){ const v=+m[k]; if(v) o[k]=v>=1?9:v>=.5?5:Math.max(1,Math.round(v*10)); } return o; }
// «Широчайшие 8, Середина спины 6, Бицепс 4» по убыванию
const lvSorted=lv=>Object.keys(lv).filter(k=>+lv[k]>0&&MUS[k]).sort((a,b)=>lv[b]-lv[a]||MUS_ORDER.indexOf(+a)-MUS_ORDER.indexOf(+b));
const lvText=lv=>lvSorted(lv).map(k=>MUS[k]+" "+lv[k]).join(", ");
// setsAt(e) -> число подходов; результат по мышцам: d — прямые, f — дробные
function muscleCount(s,setsAt){
  const r=MUS.map(()=>({d:0,f:0}));
  (s.ex||[]).forEach(e=>{ const n=setsAt(e), m=xinfo(s,e).mus; for(const k in m){ if(m[k]===1) r[k].d+=n; r[k].f+=n*m[k]; } });
  return r;
}
const blankSet=()=>({w:"",r:"",ok:false,q:""});
// сколько строк-подходов у упражнения: явное число (e.n), иначе план недели или уже записанные
const rowsOf=(s,e)=>e.n!=null?e.n:Math.max(setsFor(xinfo(s,e).plan.ns,s.week),e.sets.length);
const musName=k=>MUS[k];
const setDone=x=>x.ok||num(x.r)!==null;           // подход засчитан: отмечен или есть повторы (вес не обязателен)
const doneOf=e=>e.sets.filter(setDone).length;
// Тип подхода: "" обычный, "myo" миоповторы, "drop" дропсет. Мио и дропсет в объёме по мышцам считаются за два подхода
const SET_T={myo:{s:"М",l:"Миоповторы"},drop:{s:"Д",l:"Дропсет"}};
const effOf=e=>e.sets.reduce((a,x)=>a+(setDone(x)?(SET_T[x.t]?2:1):0),0);
const hasData=s=>s.ex&&s.ex.some(e=>e.sets.some(x=>x.w||x.r||x.ok));
const defSession=k=>({day:k,ex:P[k].ex.map((_,i)=>({base:i,uid:"p"+i,sets:[]}))});
function blankSession(date,day){
  const wk=weekFromDate(date);
  return {kind:"session",lvVer:LV_VER,pv:PV,date,day,week:wk,bw:"",note:"",done:false,
    ex:P[day].ex.map((e,i)=>({base:i,uid:"p"+i,sets:Array.from({length:setsFor(e[1],wk)},blankSet),note:""}))};
}
function normDoc(v){
  if(v&&v.kind==="session"&&Array.isArray(v.ex)&&!v.pv){   // записано до смены программы
    if(hasData(v)||!P[v.day]) v.pv=1;                          // с подходами — оставить старые упражнения
    else { v.pv=PV; v.ex=blankSession(v.date,v.day).ex; delete v.applied; }   // пустую — по новой программе
  }
  if(v&&v.kind==="session"&&Array.isArray(v.ex)) v.ex.forEach((e,i)=>{
    const pp=progOf(v).P;
    if(e.base===undefined) e.base=(pp[v.day]&&i<pp[v.day].ex.length)?i:-1;
    if(!e.uid) e.uid=e.base>=0?"p"+e.base:"c"+i;
    if(!Array.isArray(e.sets)) e.sets=[];
  });
  return v;
}

/* ---------- Хранилище (db артефакта, иначе localStorage) ---------- */
const S={data:{},ver:0,status:"Подключаюсь…",bad:false,db:null,uid:null,connected:false,sample:null,tools:false};
const subs=new Set();

const lsWrite=()=>{ try{ localStorage.setItem(LS,JSON.stringify(S.data)); }catch(e){} };
const timers={}, chains={}, pending=new Set(), vers={};
function persist(id){
  clearTimeout(timers[id]); pending.add(id); const v=vers[id]=(vers[id]||0)+1;
  S.status="Сохраняю…"; S.bad=false;
  timers[id]=setTimeout(()=>{
    if(!S.connected) return;                       // допишем после подключения

    const data=S.data[id];
    chains[id]=(chains[id]||Promise.resolve()).then(()=>data===undefined
      ? S.db.collection("data/users/"+S.uid).doc(id).delete()
      : S.db.collection("data/users/"+S.uid).doc(id).set(clone(data))
    ).then(()=>{ if(vers[id]===v) pending.delete(id); setStatus("Сохранено"); },()=>setStatus("Не сохранилось. Проверь доступ",true));
  },700);
}
const sessions=()=>Object.entries(S.data).filter(([k,v])=>v&&v.kind==="session").map(([k,v])=>Object.assign({id:k},v));
const sid=(date,day)=>"s_"+date+"_"+day;
/* Корректировки плана: после разбора тренировки изменения для следующих тренировок копятся в m_<день>
   и применяются, когда открываешь новую тренировку этого дня (дата позже тренировки-источника). */
const modsId=day=>"m_"+day;
const modsList=day=>{ const d=S.data[modsId(day)]; return d&&Array.isArray(d.list)?d.list:[]; };
const pendingMods=(day,date)=>modsList(day).filter(m=>m.from<date);
function modText(m){
  const row=m.base>=0&&P[m.day]?P[m.day].ex[m.base]:null;
  return m.type==="add_sets"?`+${m.n} подх. «${row?row[0]:"?"}»`
    :m.type==="replace"?`«${row?row[0]:"?"}» → «${m.name}»`
    :`добавить «${m.name}» ${m.n}×${m.lo}–${m.hi}`;
}
function applyMods(s,mods){
  const info=[];
  mods.forEach(m=>{
    if(m.type==="add_sets"){ const e=s.ex.find(x=>x.base===m.base); if(!e) return; const n=rowsOf(s,e)+m.n; e.n=n; while(e.sets.length<n) e.sets.push(blankSet()); }
    else if(m.type==="replace"){ const e=s.ex.find(x=>x.base===m.base); if(!e) return; e.alt=m.name; if(m.lv&&Object.keys(m.lv).length) e.lv=m.lv; }
    else if(m.type==="add"){ s.ex.push({uid:"m"+m.id,base:-1,name:m.name,n:m.n,plan:{ns:m.n,lo:m.lo,hi:m.hi,rir:"1",rest:120,note:""},lv:m.lv||{},sets:Array.from({length:m.n},blankSet),note:""}); }
    else return;
    info.push({text:modText(m),reason:m.reason||"",from:m.from});
  });
  if(info.length) s.applied=info;
  return s;
}
function getSession(date,day){ return S.data[sid(date,day)]||applyMods(blankSession(date,day),pendingMods(day,date)); }
function editSession(date,day,fn){
  const id=sid(date,day);
  if(!S.data[id]){
    const mods=pendingMods(day,date);
    S.data[id]=applyMods(blankSession(date,day),mods);
    if(mods.length){ const left=modsList(day).filter(m=>!mods.includes(m)); putDoc(modsId(day),left.length?{kind:"mods",day,list:left}:undefined); }
  }
  const s=S.data[id]; fn(s);
  if(!s.start&&hasData(s)) s.start=Date.now();
  persist(id); emit();
}
function putDoc(id,doc){ if(doc===undefined) delete S.data[id]; else S.data[id]=doc; persist(id); emit(); }

function lastTime(name,before){
  let best=null;
  for(const s of sessions()){
    if(s.date>=before||!s.ex) continue;
    for(const e of s.ex){
      if(xinfo(s,e).name!==name||!e.sets.some(x=>num(x.r)!==null)) continue;
      if(!best||s.date>best.date) best={date:s.date,e};
    }
  }
  return best;
}
function defaultDay(date){
  const ss=sessions().filter(hasData);
  const todays=ss.filter(s=>s.date===date);
  if(todays.length) return todays[0].day;
  const prev=ss.filter(s=>s.date<date).sort((a,b)=>b.date.localeCompare(a.date));
  return prev.length?ORDER[(ORDER.indexOf(prev[0].day)+1)%4]:"UA";
}

/* Разовый пересчёт нагрузки в уже записанных тренировках (после перехода на справочник ExRx и новый список мышц).
   Упражнения программы без замены берут новые значения программы; заменённые/добавленные — из справочника, если он их знает. */
const LV_VER=2;
function migrateLv(){
  for(const id in S.data){ const v=S.data[id];
    if(!v||v.kind!=="session"||!Array.isArray(v.ex)||(v.lvVer||0)>=LV_VER) continue;
    v.ex.forEach(e=>{
      if(e.base>=0&&!e.alt){ delete e.lv; delete e.mus; return; }
      const k=knownLevels(xinfo(v,e).name); if(k){ e.lv=k; delete e.mus; }
    });
    v.lvVer=LV_VER; persist(id);
  }
}

/* Что не доделано относительно программы и куда это перенести */
const upcomingDays=day=>[1,2,3].map(k=>ORDER[(ORDER.indexOf(day)+k)%4]);
function deficits(s){
  const out=[], pr=progOf(s);
  pr.P[s.day].ex.forEach((row,bi)=>{
    const e=s.ex.find(x=>x.base===bi), plan=setsFor(row[1],s.week), done=e?doneOf(e):0;
    if(done<plan) out.push({bi,name:e?xinfo(s,e).name:row[0],missed:plan-done,lv:e?xinfo(s,e).lv:pr.LV[s.day][bi],removed:!e});
  });
  return out;
}
// Простой перенос: не сделанные подходы идут в ближайшую тренировку с упражнением, где эта мышца нагружена высоко.
// Лимит на тренировку: +4 подхода и одно новое упражнение (только в день того же типа); остальное дальше по неделе или не переносится.
const CAP_SETS=4, CAP_NEW=1;
function suggestMods(s){
  const res=[], after=upcomingDays(s.day), load={}, added={};
  deficits(s).forEach(d=>{   // порядок программы: базовые раньше изоляции
    const top=+lvSorted(d.lv)[0]; if(isNaN(top)) return;
    const why=`не сделано ${d.missed} подх. «${d.name}» (${MUS[top]})`;
    for(const day of after){
      const room=CAP_SETS-(load[day]||0); if(room<=0) continue;
      const bi=P[day].ex.findIndex((r,i)=>(LV[day][i][top]||0)>=7); if(bi<0) continue;
      const n=Math.min(2,d.missed,room), same=res.find(m=>m.day===day&&m.type==="add_sets"&&m.base===bi);
      if(same){ same.n+=n; same.reason+="; "+why; } else res.push({id:rid(),day,type:"add_sets",base:bi,n,from:s.date,reason:why});
      load[day]=(load[day]||0)+n; return;
    }
    const day=after.find(k=>(added[k]||0)<CAP_NEW&&(load[k]||0)<CAP_SETS&&k[0]===s.day[0]);   // новое упражнение — только в день того же типа
    if(!day) return;
    const row=progOf(s).P[s.day].ex[d.bi], n=Math.min(2,d.missed,CAP_SETS-(load[day]||0));
    res.push({id:rid(),day,type:"add",name:d.name,n,lo:row[2],hi:row[3],lv:d.lv,from:s.date,reason:why});
    load[day]=(load[day]||0)+n; added[day]=(added[day]||0)+1;
  });
  return res;
}
async function suggestModsAuto(s){
  const after=upcomingDays(s.day), defs=deficits(s);
  const prog=after.map(day=>`${day} (${P[day].name}):\n`+P[day].ex.map((r,i)=>`  ${i}. ${r[0]} ${r[1]}×${r[2]}–${r[3]}; нагрузка: ${lvText(LV[day][i])}`).join("\n")).join("\n");
  const r=await S.sample.json(`Ты тренер по гипертрофии. Тренировка ${s.date} (${P[s.day].name}) завершена с отклонениями от программы. Перенеси недобор в ближайшие тренировки так, чтобы недельный объём по мышцам сохранился, но тренировки не раздулись (не больше +3 подходов на тренировку). Можно: добавить подходы к упражнению (add_sets), заменить упражнение (replace), добавить упражнение (add).
${PROFILE}

ЧТО ПРОИЗОШЛО:
${sessionBlock(s)}
НЕДОБОР ПО ПРОГРАММЕ:
${defs.length?defs.map(d=>`- ${d.name}: не сделано ${d.missed} подх.${d.removed?" (упражнение убрано)":""}; нагрузка: ${lvText(d.lv)}`).join("\n"):"нет"}

БЛИЖАЙШИЕ ТРЕНИРОВКИ (индексы упражнений с 0):
${prog}

Ответь только JSON: {"changes":[{"day":"UB","type":"add_sets","exercise_index":0,"sets":2,"reason":"коротко почему"},{"day":"LB","type":"add","name":"…","sets":2,"reps_min":10,"reps_max":15,"levels":{"Грудь":8},"reason":"…"},{"day":"UB","type":"replace","exercise_index":3,"name":"…","levels":{"Грудь":9},"reason":"…"}]}. Если переносить нечего, верни {"changes":[]}.`);
  const out=[];
  (r&&Array.isArray(r.changes)?r.changes:[]).forEach(c=>{
    const day=String(c.day), type=String(c.type); if(!after.includes(day)) return;
    const bi=Math.round(Number(c.exercise_index)), n=Math.min(4,Math.max(1,Math.round(Number(c.sets)||2))), reason=String(c.reason||"").slice(0,160);
    if((type==="add_sets"||type==="replace")&&!(bi>=0&&bi<P[day].ex.length)) return;
    if(type==="add_sets") out.push({id:rid(),day,type,base:bi,n,from:s.date,reason});
    else if(type==="replace"&&c.name) out.push({id:rid(),day,type,base:bi,name:String(c.name).slice(0,80),lv:lvFromObj(c.levels),from:s.date,reason});
    else if(type==="add"&&c.name){ const lo=Math.max(1,Math.round(Number(c.reps_min)||8)); out.push({id:rid(),day,type,name:String(c.name).slice(0,80),n,lo,hi:Math.max(lo,Math.round(Number(c.reps_max)||12)),lv:lvFromObj(c.levels),from:s.date,reason}); }
  });
  return out;
}
function addMods(mods){
  const byDay={}; mods.forEach(m=>{ (byDay[m.day]=byDay[m.day]||[]).push(m); });
  for(const day in byDay) putDoc(modsId(day),{kind:"mods",day,list:[...modsList(day),...byDay[day]]});
}
function dropMod(day,id){ const left=modsList(day).filter(m=>m.id!==id); putDoc(modsId(day),left.length?{kind:"mods",day,list:left}:undefined); }

/* ---------- Рекорды, история упражнения, блины ---------- */
// Расчётный 1ПМ по Эпли: вес × (1 + повторы/30). Для сравнения подходов с разным числом повторов.
const e1rm=(w,r)=>{ w=num(w); r=num(r); return w&&r?w*(1+r/30):0; };
// История упражнения по названию: [{date, day, sets:[{w,r,q}], best}] от старых к новым
function exerciseHistory(name){
  const out=[];
  for(const s of sessions()){ if(!s.ex) continue;
    for(const e of s.ex){ if(xinfo(s,e).name!==name) continue;
      const sets=e.sets.filter(x=>num(x.r)!==null);
      if(sets.length) out.push({date:s.date,day:s.day,sets,best:Math.max(0,...sets.map(x=>e1rm(x.w,x.r)))});
    }
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
// Лучший расчётный 1ПМ до даты (не включая). 0 — истории нет (первый раз рекорд не показываем).
const bestBefore=(name,date)=>exerciseHistory(name).filter(h=>h.date<date).reduce((m,h)=>Math.max(m,h.best),0);
// Рекорды тренировки: подходы, которые побили прошлый лучший результат упражнения
function sessionPRs(s){
  const out=[];
  (s.ex||[]).forEach(e=>{ const name=xinfo(s,e).name, prev=bestBefore(name,s.date); if(!prev) return;
    let top=null; e.sets.forEach(x=>{ const v=e1rm(x.w,x.r); if(v>prev&&(!top||v>top.v)) top={v,w:x.w,r:x.r}; });
    if(top) out.push({name,w:top.w,r:top.r,v:top.v,prev,date:s.date});
  });
  return out;
}
// Блины на сторону для штанги (гриф 20 кг)
const PLATES=[20,15,10,5,2.5,1.25];   // блины в зале (25 нет)
function platesFor(w,bar){ bar=bar||20; let side=(num(w)-bar)/2; if(!(side>0)) return null; const out=[];
  for(const p of PLATES){ while(side>=p-1e-9){ out.push(p); side-=p; } } return side>0.01?null:out; }
const isBarbell=name=>/штанг|присед|станов|румынск|bench|squat|deadlift|barbell/.test(normName(name))&&!/гантел|тренаж|смит|блок/.test(normName(name));

/* ---------- Промпты для Клода ---------- */
const PROFILE=`Профиль: мужчина 26 лет, 177 см, ~83 кг, ~20% жира, стаж ~6 месяцев, цель — гипертрофия. Принимает ААС под наблюдением врача, поэтому особое внимание сухожилиям (грудь, дистальный бицепс, надколенник, ахилл) и давлению. Препараты не обсуждай и не советуй.
Программа: верх/низ 4 дня (Верх A, Низ A, Верх B, Низ B), цикл повторяется неделя за неделей без мезоциклов и разгрузок по календарю; запас повторов (RIR) у каждого упражнения задан в программе. Жимы 1–3 RIR, без отказа и отбива; прибавка в базе не более ~5% в неделю. Двойная прогрессия: все подходы на верхней границе повторов при целевом RIR → вес +2,5–5% (изоляция +1–2 кг). Объём 10–16 эффективных подходов на мышцу в неделю. Нагрузка на мышцу в упражнении задана по шкале 0–10; в объём идёт: 7–10 = 1 подход, 4–6 = 0,5, 1–3 = 0,25.

// резинка у границы: чем дальше тянешь, тем меньше следует (apple-fluid §9)
const rubber=(x,dim,c=.55)=>x*dim*c/(dim+c*Math.abs(x));
function Sheet({title,onClose,children,foot,cls,lead}){
  const ref=useRef(null), drag=useRef(null), panel=!!cls&&cls.includes("over-tabs"), float=panel&&!cls.includes("with-head");
  useEffect(()=>{ const el=ref.current;
    // панель «материализуется» от нижней полоски: масштаб и размытие вместе (apple-fluid §12); шторка выезжает снизу
    if(panel) anim(el,{transform:["translateY(24px) scale(.94)","translateY(0) scale(1)"],opacity:[0,1],filter:["blur(6px)","blur(0px)"]},{bounce:0,duration:.4});
    else anim(el,{transform:["translateY(60px)","translateY(0)"],opacity:[.4,1]},{bounce:0,duration:.4});
    const k=ev=>{ if(ev.key==="Escape") onClose(); }; document.addEventListener("keydown",k); return ()=>document.removeEventListener("keydown",k); },[]);
  // смахнуть вниз: за шапку (у плавающей панели — за любое место); вверх — резинка; решает скорость, а не только расстояние
  const down=ev=>{ if(ev.button>0||!(float||ev.target.closest(".sheet-head"))) return; if(!float&&ev.target.closest("button")) return;
    drag.current={y:ev.clientY,dy:0,cap:false,id:ev.pointerId,hist:[[ev.clientY,performance.now()]]}; };
  const move=ev=>{ const d=drag.current; if(!d) return; const raw=ev.clientY-d.y;
    d.hist.push([ev.clientY,performance.now()]); if(d.hist.length>5) d.hist.shift();
    if(Math.abs(raw)>8&&!d.cap){ d.cap=true; try{ ev.currentTarget.setPointerCapture(d.id); }catch(e){} }
    if(!d.cap) return; d.dy=raw>0?raw:rubber(raw,ref.current.offsetHeight);
    ref.current.style.transition="none"; ref.current.style.transform="translateY("+d.dy+"px)"; };
  const up=()=>{ const d=drag.current; drag.current=null; if(!d||!d.cap) return; const el=ref.current, h=d.hist, a=h[0], z=h[h.length-1];
    const v=(z[0]-a[0])/Math.max(1,z[1]-a[1]); // px/мс, плюс — вниз
    if(v>.45||(d.dy>el.offsetHeight*.3&&v>-.1)){ el.style.transition="transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s"; el.style.transform="translateY("+(el.offsetHeight+60)+"px)"; el.style.opacity="0"; setTimeout(onClose,180); }
    else { el.style.transform=""; anim(el,{transform:["translateY("+d.dy+"px)","translateY(0px)"]},{bounce:.15,duration:.35}); } };
  return ReactDOM.createPortal(html`<div class=${"sheet-wrap"+(cls?" "+cls:"")} onClick=${ev=>{ if(ev.target===ev.currentTarget) onClose(); }}>
    <div class=${"sheet"+(float?" float":"")} role="dialog" aria-label=${title} ref=${ref} onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up}>
      <div class="sheet-head">${lead?html`<span class="sh-lead">${lead}</span>`:null}<b>${title}</b><button class="ibtn" aria-label="Закрыть" onClick=${onClose}><${Icon} n="close"/></button></div>
      ${foot?html`<div class="sheet-foot">${foot}</div>`:null}
      <div class="sheet-body">${children}</div>
    </div></div>`,document.body);
}
function NoteField({value,onChange}){

const qTone=q=>q===""||q==null?"":q==="0"?"q0":q==="1"?"q1":q==="4+"?"q4":"q2";
const Elapsed=({s})=>{
  const [,t]=useState(0);
  useEffect(()=>{ if(!s.start||s.done) return; const h=setInterval(()=>t(x=>x+1),1000); return ()=>clearInterval(h); },[s.start,s.done]);
  if(!s.start) return html`<span class="elapsed mute">0:00</span>`;
  const sec=Math.max(0,Math.round(((s.done&&s.end)||Date.now())-s.start)/1000|0), h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), ss=sec%60;
  return html`<span class="elapsed">${h?h+":"+String(m).padStart(2,"0"):m}:${String(ss).padStart(2,"0")}</span>`;
};

/* ---------- Корректировки следующих тренировок ---------- */
const modKey=m=>m.day+"|"+m.type+"|"+(m.base??"")+"|"+(m.name||"");
function Corrections({s,toast}){
  const [ai,setAi]=useState(null), [off,setOff]=useState({}), [busy,setBusy]=useState(false), [msg,setMsg]=useState("");
  const list=ai||suggestMods(s);
  const planned=ORDER.flatMap(d=>modsList(d).filter(m=>m.from===s.date));
  const sentKeys=new Set(planned.map(modKey));
  const fresh=list.filter(m=>!sentKeys.has(modKey(m)));
  const auto=async()=>{ setBusy(true); setMsg("");
    try{ const r=await suggestModsAuto(s); setAi(r); setOff({}); if(!r.length) setMsg("Переносить нечего: недобор небольшой или уже покрыт."); }
    catch(e){ setMsg(errText(e)); }
    setBusy(false); };
  const apply=()=>{ const chosen=fresh.filter(m=>!off[modKey(m)]); if(!chosen.length) return;
    addMods(chosen.map(m=>Object.assign({},m,{id:rid()})));
    toast({text:`Добавлено в план: ${chosen.length}`,action:"Отменить",run:()=>{ const ks=new Set(chosen.map(modKey)); ORDER.forEach(d=>modsList(d).filter(m=>m.from===s.date&&ks.has(modKey(m))).forEach(m=>dropMod(d,m.id))); }}); };
  return html`<div class="corr">
    <h3>Перенос в ближайшие тренировки</h3>
    ${!list.length&&!planned.length?html`<div class="st">Всё сделано по плану, переносить нечего.</div>`:null}
    ${fresh.length?html`<div class="menu corr-card">${fresh.map(m=>{ const k=modKey(m); return html`<label key=${k} class="mitem corr-item">
        <input type="checkbox" checked=${!off[k]} onChange=${ev=>setOff(Object.assign({},off,{[k]:!ev.target.checked}))}/>
        <span><b>${P[m.day].name} · ${modText(m)}</b>${m.reason?html`<small>${m.reason}</small>`:null}</span>
      </label>`; })}
      <div class="corr-foot">
        <button class="btn primary" onClick=${apply}>Добавить отмеченное в план</button>
        ${S.sample?html`<button class="linkbtn" disabled=${busy} onClick=${auto}>${busy?"Тренер подбирает…":ai?"Ещё варианты от тренера":"Другие варианты от тренера"}</button>`:null}
        ${ai?html`<button class="linkbtn" onClick=${()=>setAi(null)}>Вернуть простой вариант</button>`:null}
      </div></div>`:null}
    ${planned.length?html`<div class="st">Уже в плане (применится, когда откроешь эти тренировки):</div>
      <div class="menu">${planned.map(m=>html`<div key=${m.id} class="mitem corr-item"><span><b>${P[m.day].name} · ${modText(m)}</b></span>
        <button class="ibtn danger" aria-label="Убрать из плана" onClick=${()=>dropMod(m.day,m.id)}><${Icon} n="close" size=${16}/></button></div>`)}</div>`:null}
    ${msg?html`<div class="st">${msg}</div>`:null}
  </div>`;
}

/* ---------- Разбор (тренировки или недели) ---------- */
function Review({label,stored,build,onSave,disabledMsg}){
  const [live,setLive]=useState(""), [err,setErr]=useState("");
  const ctl=useRef(null);
  const run=async()=>{
    const p=build(); if(!p){ setErr(disabledMsg); return; }
    ctl.current=new AbortController(); setErr(""); setLive("…");
    try{ const r=await S.sample(p,{signal:ctl.current.signal,cache:false,onText:({text})=>setLive(text)});
      onSave(r.text+(r.truncated?"\n\n(Ответ оборван, запроси ещё раз.)":"")); setLive(""); }
    catch(e){ setLive(""); if(e&&e.code!=="cancelled"&&!e.text) setErr(errText(e)); if(e&&e.text) onSave(e.text+"\n\n(Ответ прерван.)"); }
    ctl.current=null;
  };
  return html`<div class="review">
    ${live?html`<div class="sum">${live==="…"?html`<div class="st">Анализирую… Ответ может прийти через полминуты.</div>`:html`<${Rich} text=${live}/>`}<div><button class="btn" onClick=${()=>ctl.current&&ctl.current.abort()}>Стоп</button></div></div>`
      :stored?html`<div class="sum"><${Rich} text=${stored}/></div>`:null}
    <div class="row-actions">
      ${S.sample?html`<button class="btn primary" disabled=${!!live} onClick=${run}><${Icon} n="spark" size=${16}/> ${stored?label+" заново":label}</button>`:null}
    </div>
    ${err?html`<div class="st bad">${err}</div>`:null}
  </div>`;
}

// Общее для обоих видов: тренировка, правки, удаление с «Вернуть», неделя мезоцикла, завершение
function useSession(date,day,toast){
  const s=getSession(date,day);
  const edit=fn=>editSession(date,day,fn);
  const remove=i=>{
    const entry=clone(s.ex[i]), name=xinfo(s,entry).name;
    edit(ss=>{ ss.ex.splice(i,1); });
    toast({text:`«${name}» убрано`,action:"Вернуть",run:()=>edit(ss=>{ ss.ex.splice(Math.min(i,ss.ex.length),0,entry); })});
  };
  const setWeek=d=>edit(ss=>{ ss.week=Math.min(6,Math.max(1,ss.week+d));
    ss.ex.forEach(e=>{ if(e.sets.some(x=>x.w||x.r||x.ok)) return; delete e.n; e.sets=Array.from({length:setsFor(xinfo(ss,e).plan.ns,ss.week)},blankSet); }); });
  const finish=()=>edit(ss=>{ ss.done=!ss.done; if(ss.done){ ss.end=Date.now(); if(!ss.dur&&ss.start) ss.dur=String(Math.max(1,Math.round((ss.end-ss.start)/60000))); } });
  return {s,edit,remove,setWeek,finish};
}

function textLog(s){
  let t=`## ${s.date} · ${P[s.day].name}\n`;

  s.ex.forEach(e=>{ const sets=e.sets.filter(x=>x.w||x.r).map(x=>`${x.w||"б/в"}×${x.r||"?"}${x.q?" (запас "+x.q+")":""}${SET_T[x.t]?" ("+SET_T[x.t].l.toLowerCase()+")":""}`).join(", ");
    if(sets||e.note) t+=`- ${xinfo(s,e).name}: ${sets}${e.note?" ("+e.note+")":""}\n`; });

}

function WeekView({date,embedded}){
  const [pw,setPw]=useState(null);

  const cnt=c=>e=>c.real?rowsOf(c.s,e):setsFor(xinfo(c.s,e).plan.ns,wk);

const WD=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];

const RU_MON1=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
// мини-тренд: цвет по направлению (вверх зелёный, вниз жёлтый, ровно серый)
function MiniTrend({vals,dir}){
  if(vals.length<2) return html`<svg width="72" height="28" aria-hidden="true"></svg>`;
  const lo=Math.min(...vals), hi=Math.max(...vals), sp=hi-lo||1;
  return html`<svg width="72" height="28" viewBox="0 0 72 28" aria-hidden="true"><polyline class=${"mt-"+dir} fill="none" stroke-width="2" stroke-linejoin="round"
    points=${vals.map((v,i)=>(2+i*68/(vals.length-1))+","+(24-(v-lo)/sp*20)).join(" ")}/></svg>`;
}
const bestSet=sets=>sets.reduce((b,x)=>!b||e1rm(x.w,x.r)>e1rm(b.w,b.r)?x:b,null);
const setTxt=x=>!x?"":x.w?fmt(num(x.w))+" × "+x.r:x.r+" повт.";
// История: два вида — календарь месяца (день → состав тренировки) и список упражнений с трендом
function HistoryView({openSession,openAsk,openHistory}){
  const list=sessions().filter(hasData).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const today=todayStr();
  const [mode,setModeRaw]=useState(()=>{ try{ return localStorage.getItem("trainlog.hist")||"cal"; }catch(e){ return "cal"; } });
  const setMode=m=>{ setModeRaw(m); try{ localStorage.setItem("trainlog.hist",m); }catch(e){} };
  const [month,setMonth]=useState(today.slice(0,7)), [sel,setSel]=useState(today), [q,setQ]=useState("");
  const byDate={}; list.forEach(x=>{ if(!byDate[x.date]) byDate[x.date]=x; });
  const shiftMonth=n=>{ const [y,m]=month.split("-").map(Number), d=new Date(y,m-1+n,1); setMonth(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); };
  const [y,mo]=month.split("-").map(Number), first=new Date(y,mo-1,1), lead=(first.getDay()+6)%7, n=new Date(y,mo,0).getDate();
  const cells=[]; for(let k=-lead;k<n;k++){ const d=new Date(y,mo-1,k+1); cells.push(d.toLocaleDateString("sv-SE")); }
  while(cells.length%7) { const d=new Date(cells[cells.length-1]+"T00:00:00"); d.setDate(d.getDate()+1); cells.push(d.toLocaleDateString("sv-SE")); }
  const inMonth=list.filter(x=>x.date.slice(0,7)===month), mSets=inMonth.reduce((a,s)=>a+s.ex.reduce((b,e)=>b+doneOf(e),0),0);
  const ss=byDate[sel];
  // упражнения: всё, что когда-либо записано, свежие сверху
  const names=[...new Set(list.flatMap(s=>s.ex.filter(e=>e.sets.some(setDone)).map(e=>xinfo(s,e).name)))];
  const exs=names.filter(nm=>!q||nm.toLowerCase().includes(q.toLowerCase())).map(nm=>{ const h=exerciseHistory(nm); if(!h.length) return null;
    const last=h[h.length-1], tail=h.slice(-6), g=Math.round((tail[tail.length-1].best-tail[0].best)*2)/2;
    return {nm,last,tail:tail.map(x=>x.best),g,dir:tail.length<2||Math.abs(g)<0.5?"fl":g>0?"up":"dn"}; }).filter(Boolean).sort((a,b)=>b.last.date.localeCompare(a.last.date));
  return html`<div class="histv">
    <section class="hero">
      <${AppBar} right=${html`<${CoachBtn} onClick=${openAsk}/>`} title="История"/>
      <div class="hseg" role="group" aria-label="Вид истории">
        <button aria-pressed=${String(mode==="cal")} onClick=${()=>setMode("cal")}><span>Календарь</span></button>
        <button aria-pressed=${String(mode==="ex")} onClick=${()=>setMode("ex")}><span>Упражнения</span></button>
      </div>
    </section>
    ${mode==="cal"?html`
      <div class="cal-h"><div><h2>${RU_MON1[mo-1]}${y!==+today.slice(0,4)?" "+y:""}</h2><small>${inMonth.length} трен. · ${mSets} подх.</small></div>
        <span class="wk-nav"><button class="dn-a" aria-label="Прошлый месяц" onClick=${()=>shiftMonth(-1)}><${Icon} n="left" size=${18}/></button>
        <button class="dn-a" aria-label="Следующий месяц" disabled=${month>=today.slice(0,7)} onClick=${()=>shiftMonth(1)}><${Icon} n="right" size=${18}/></button></span></div>
      <div class="cal">${["пн","вт","ср","чт","пт","сб","вс"].map(d=>html`<span key=${d}>${d}</span>`)}
        ${cells.map(d=>{ const x=byDate[d], out=d.slice(0,7)!==month;
          return html`<button key=${d} class=${"cd"+(out?" out":"")+(d===today?" now":"")+(d===sel?" sel":"")} style=${x?{"--c":PC[x.day]}:null}
            onClick=${()=>setSel(d)} aria-label=${dm(d)+(x?": "+P[x.day].name+", "+x.ex.reduce((a,e)=>a+Math.min(doneOf(e),rowsOf(x,e)),0)+" из "+x.ex.reduce((a,e)=>a+rowsOf(x,e),0):"")} aria-pressed=${String(d===sel)}>
            ${x?html`<${Rings} size=${40} stroke=${4} rings=${[{p:x.ex.reduce((a,e)=>a+Math.min(doneOf(e),rowsOf(x,e)),0)/Math.max(1,x.ex.reduce((a,e)=>a+rowsOf(x,e),0)),color:PC[x.day]}]} label=""/>`:null}<span>${+d.slice(8)}</span></button>`; })}</div>
      <div class="dlegend">${ORDER.map(k=>html`<span key=${k}><${Plate} k=${k}/>${P[k].name}</span>`)}</div>
      ${ss?html`<section class="hday">
        <div class="hd-h"><b>${P[ss.day].name} · ${WDS[new Date(sel+"T00:00:00").getDay()]} ${+sel.slice(8)}</b>
          <span>${ss.ex.reduce((a,e)=>a+doneOf(e),0)}/${ss.ex.reduce((a,e)=>a+rowsOf(ss,e),0)}${ss.dur?" · "+ss.dur+" мин":""}</span></div>
        ${ss.ex.filter(e=>e.sets.some(setDone)).slice(0,5).map(e=>{ const sets=e.sets.filter(setDone), b=bestSet(sets.filter(x=>num(x.r)!==null));
          return html`<div key=${e.uid} class="hd-r"><span>${xinfo(ss,e).name}</span><b>${b?setTxt(b):sets.length+" подх."}</b></div>`; })}
        <button class="capsule sm" onClick=${()=>openSession(ss.date,ss.day)}>Открыть тренировку</button>
      </section>`:html`<section class="hday empty-day"><span>${dm(sel)} — тренировки нет</span>
        ${sel<=today?html`<button class="linkbtn" onClick=${()=>openSession(sel,null)}>Записать тренировку за этот день</button>`:null}</section>`}`
    :html`
      <label class="hsearch"><${Icon} n="search" size=${18}/><span class="sr">Найти упражнение</span>
        <input id="hist-q" type="search" placeholder="Найти упражнение" value=${q} onInput=${ev=>setQ(ev.target.value)}/></label>
      <p class="hx-note">Лучший подход в последний раз · тренд расчётного 1ПМ за 6 тренировок</p>
      ${!exs.length?html`<div class="empty">${q?"Ничего не нашлось.":"Пока нет записей."}</div>`:html`<div class="hxlist">${exs.map(x=>html`<button key=${x.nm} class="hx" onClick=${()=>openHistory(x.nm)}>
        <b>${x.nm}</b><small>${setTxt(bestSet(x.last.sets))} · ${dm(x.last.date)}</small><${MiniTrend} vals=${x.tail} dir=${x.dir}/>
        <em class=${"mt-"+x.dir}>${x.dir==="fl"?"ровно":(x.g>0?"+":"−")+fmt(Math.abs(x.g))+" кг"}</em></button>`)}</div>`}`}
  </div>`;
}

/* ---------- Спросить тренера (чат с действиями) ---------- */
function AskSheet({focus,onClose,date,day,toast}){
  const [turns,setTurns]=useState([]), [input,setInput]=useState(""), [live,setLive]=useState(""), [err,setErr]=useState("");
  const ctl=useRef(null), box=useRef(null);

  useEffect(()=>{ const b=box.current&&box.current.parentNode; if(b&&(turns.length||live)) b.scrollTop=b.scrollHeight; },[turns,live]);
  const context=()=>{ const cur=getSession(date,day), prev=recent(date,3);
    return `Ты персональный тренер по гипертрофии внутри приложения-дневника тренировок. Отвечай по-русски, коротко и по делу (до 150 слов, если не просят подробнее), списками где уместно. Не называй себя ИИ или Claude, ты просто тренер в приложении. При боли в сухожилии советуй убрать упражнение и показаться спортивному врачу.
${PROFILE}

ТЕКУЩАЯ ТРЕНИРОВКА (упражнения пронумерованы):
${sessionBlock(cur,true)}
${prev.length?"ПОСЛЕДНИЕ ТРЕНИРОВКИ:\n"+prev.map(x=>sessionBlock(x)).join("\n"):""}
${S.tools?`У тебя есть инструменты replace_exercise и add_exercise, они меняют текущую тренировку пользователя. Вызывай их ТОЛЬКО если пользователь прямо просит заменить или добавить упражнение. Нагрузку на мышцы передавай в muscle_levels по шкале 1–10 (в тренажёрах вспомогательные мышцы ниже), мышцы только из списка: ${MUS.join(", ")}. После изменения кратко скажи, что сделал.`:"Менять тренировку сам ты не можешь: если предлагаешь замену, назови упражнение, и пользователь заменит его через «⋯ → Заменить упражнение»."}`; };
  const tools=()=>S.tools?[
    {name:"replace_exercise",description:"Заменяет упражнение в текущей тренировке на другое. Возвращает текст с результатом.",
     inputSchema:{type:"object",properties:{exercise_number:{type:"integer",description:"Номер упражнения в текущей тренировке, начиная с 1"},new_name:{type:"string"},muscle_levels:{type:"object",description:"Нагрузка на мышцы по шкале 1–10, ключи только из списка мышц",additionalProperties:{type:"integer"}},primary_muscles:{type:"array",items:{type:"string",enum:MUS}},secondary_muscles:{type:"array",items:{type:"string",enum:MUS}}},required:["exercise_number","new_name"]},
     execute:inp=>{ const cur=getSession(date,day), i=Math.round(Number(inp.exercise_number))-1, name=String(inp.new_name||"").trim();
       if(!(i>=0&&i<cur.ex.length)) throw new Error("Нет упражнения с таким номером"); if(!name) throw new Error("Пустое название");
       const before=clone(cur.ex[i]), old=xinfo(cur,before).name, m=lvFromTool(inp);
       editSession(date,day,ss=>{ const x=ss.ex.find(y=>y.uid===before.uid); if(!x) return; if(x.base>=0) x.alt=name; else x.name=name; if(Object.keys(m).length){ x.lv=m; delete x.mus; } });
       toast({text:`Заменено: «${old}» → «${name}»`,action:"Вернуть",run:()=>editSession(date,day,ss=>{ const k=ss.ex.findIndex(y=>y.uid===before.uid); if(k>=0) ss.ex[k]=before; })});
       return `Готово: «${old}» заменено на «${name}».`; }},
    {name:"add_exercise",description:"Добавляет упражнение в конец текущей тренировки. Возвращает текст с результатом.",
     inputSchema:{type:"object",properties:{name:{type:"string"},sets:{type:"integer"},reps_min:{type:"integer"},reps_max:{type:"integer"},muscle_levels:{type:"object",description:"Нагрузка на мышцы по шкале 1–10, ключи только из списка мышц",additionalProperties:{type:"integer"}},primary_muscles:{type:"array",items:{type:"string",enum:MUS}},secondary_muscles:{type:"array",items:{type:"string",enum:MUS}}},required:["name","sets","reps_min","reps_max"]},
     execute:inp=>{ const name=String(inp.name||"").trim(); if(!name) throw new Error("Пустое название");
       const n=Math.min(10,Math.max(1,Math.round(Number(inp.sets)||3))), lo=Math.max(1,Math.round(Number(inp.reps_min)||8)), hi=Math.max(lo,Math.round(Number(inp.reps_max)||12)), uid="c"+rid();
       editSession(date,day,ss=>{ ss.ex.push({uid,base:-1,name,n,plan:{ns:n,lo,hi,rir:"1",rest:120,note:""},lv:lvFromTool(inp),sets:Array.from({length:n},blankSet),note:""}); });
       toast({text:`Добавлено: «${name}»`,action:"Убрать",run:()=>editSession(date,day,ss=>{ ss.ex=ss.ex.filter(y=>y.uid!==uid); })});
       return `Готово: добавлено «${name}», ${n}×${lo}–${hi}.`; }}

  const send=async(text)=>{

    <div class="chat" ref=${box}>
      ${help?html`<div class="help-t">Тренер видит текущую тренировку, программу и последние записи.${S.tools?" Может сам заменить или добавить упражнение, это отменяется кнопкой «Вернуть».":""}${!S.sample?" Здесь помощник недоступен: напиши вопрос и скопируй запрос кнопкой справа от поля, чтобы вставить его в чат.":""}</div>`:null}
      ${!turns.length&&!live?html`

/* ---------- Таймер, всплывашка, нижние вкладки ---------- */
// Таймер отдыха — полоска сверху. Сворачивается в маленькую таблетку (кнопка ⌃ или смахнуть вверх);
// когда отдых закончился, пульсирует зелёным и сам закрывается через 8 секунд.
function Timer({t,onStop,onShift}){
  const [,tick]=useState(0), [mini,setMini]=useState(false), y0=useRef(null);
  useEffect(()=>{ if(!t) return; const h=setInterval(()=>tick(x=>x+1),250); return ()=>clearInterval(h); },[t]);
  const left=t?Math.max(0,Math.round((t.end-Date.now())/1000)):0, done=!!t&&left===0;
  useEffect(()=>{ if(!done) return; const h=setTimeout(onStop,8000); return ()=>clearTimeout(h); },[done,t&&t.end]);
  if(!t) return null;
  const time=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  if(mini) return html`<button class=${"timer-mini"+(done?" done":"")} onClick=${()=>setMini(false)} aria-label=${(done?"Отдых закончен":"Отдых, осталось "+time)+". Развернуть таймер"}>
    <${Icon} n="timer" size=${16}/><span>${done?"Пора":time}</span></button>`;
  return html`<div class=${"timer"+(done?" done":"")} role="timer"
      onTouchStart=${ev=>{ y0.current=ev.touches[0].clientY; }} onTouchEnd=${ev=>{ if(y0.current!==null&&ev.changedTouches[0].clientY-y0.current<-24) setMini(true); y0.current=null; }}>
    <button onClick=${()=>onShift(-15)} aria-label="Минус 15 секунд">−15</button>
    <div class="t">${time}</div>
    <div class="l">${done?"Пора!":"Отдых"}</div>
    <button onClick=${()=>onShift(15)} aria-label="Плюс 15 секунд">+15</button>
    <button onClick=${()=>setMini(true)} aria-label="Свернуть таймер"><${Icon} n="up" size=${16}/></button>
    <button onClick=${onStop} aria-label="Остановить таймер"><${Icon} n="close" size=${16}/></button>
  </div>`;
}
function Toast({t,onClose}){
  const ref=useRef(null);
  useEffect(()=>{ if(!t) return; anim(ref.current,{transform:["translateY(-8px)","translateY(0)"],opacity:[0,1]}); const h=setTimeout(onClose,5000); return ()=>clearTimeout(h); },[t]);
  if(!t) return null;
  return html`<div class="toast" role="status" ref=${ref}><span>${t.text}</span>${t.action?html`<button onClick=${()=>{ t.run(); onClose(); }}>${t.action}</button>`:null}</div>`;
}

// Концентрические кольца: rings = [{p: 0..1, color, track}], снаружи внутрь; без track дорожка — тот же цвет, приглушённый
function Rings({size,stroke,rings,label,gap=3}){
  const c=size/2;
  return html`<svg class="rings" width=${size} height=${size} viewBox=${"0 0 "+size+" "+size} role="img" aria-label=${label}>
    ${rings.map((r,k)=>{ const rad=c-stroke/2-k*(stroke+gap), C=2*Math.PI*rad, p=Math.max(0,Math.min(1,r.p||0));
      return html`<g key=${k}><circle cx=${c} cy=${c} r=${rad} fill="none" stroke=${r.track||r.color} stroke-opacity=${r.track?1:.24} stroke-width=${stroke}/>
        ${p>0?html`<circle cx=${c} cy=${c} r=${rad} fill="none" stroke=${r.color} stroke-width=${stroke} stroke-linecap="round" stroke-dasharray=${C} stroke-dashoffset=${C*(1-p)} transform=${"rotate(-90 "+c+" "+c+")"}/>`:null}</g>`; })}
  </svg>`;
}
// Мини-график: values — числа по порядку, последняя точка выделена
function Spark({values,w,h,big}){
  w=w||140; h=h||40; const pad=big?10:5;
  if(!values.length) return null;
  const lo=Math.min(...values), hi=Math.max(...values), span=hi-lo||1;
  const pts=values.map((v,i)=>[values.length>1?pad+i*(w-2*pad)/(values.length-1):w/2, h-pad-(v-lo)/span*(h-2*pad)]);
  const last=pts[pts.length-1];
  return html`<svg class="spark" width=${w} height=${h} viewBox=${"0 0 "+w+" "+h} aria-hidden="true">
    ${pts.length>1?html`<polyline points=${pts.map(p=>p.join(",")).join(" ")} fill="none" stroke="var(--acc)" stroke-width=${big?3:2.5} stroke-linecap="round" stroke-linejoin="round"/>`:null}
    ${big?pts.slice(0,-1).map((p,i)=>html`<circle key=${i} cx=${p[0]} cy=${p[1]} r="3.5" fill="var(--acc)"/>`):null}
    <circle cx=${last[0]} cy=${last[1]} r=${big?6:4.5} fill="var(--acc)"/>
  </svg>`;
}
const RU_DAYS=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const RU_MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const dayMonth=d=>{ const t=new Date(d+"T00:00:00"); return t.getDate()+" "+RU_MONTHS[t.getMonth()]; };
const longDate=d=>{ const t=new Date(d+"T00:00:00"); return RU_DAYS[t.getDay()]+", "+t.getDate()+" "+RU_MONTHS[t.getMonth()]; };
const kgf=v=>fmt(Math.round(v*2)/2);

// Сводка недели: тренировки, подходы, мышцы с набранным объёмом
function weekData(date){
  const wk=weekFromDate(date), ws=weekStart(date), we=weekEnd(date);
  const inWeek=sessions().filter(x=>x.date>=ws&&x.date<=we);
  const plan=MUS.map(()=>0), fact=MUS.map(()=>0); let pSets=0, dSets=0, done=0;
  ORDER.forEach(k=>{ const real=inWeek.filter(x=>x.day===k).sort((a,b)=>b.date.localeCompare(a.date))[0], s=real||defSession(k);
    const cnt=e=>real?rowsOf(s,e):setsFor(xinfo(s,e).plan.ns,wk);
    muscleCount(s,cnt).forEach((c,m)=>{ plan[m]+=c.f; }); pSets+=s.ex.reduce((a,e)=>a+cnt(e),0); });
  inWeek.forEach(x=>{ muscleCount(x,effOf).forEach((c,m)=>{ fact[m]+=c.f; }); dSets+=x.ex.reduce((a,e)=>a+doneOf(e),0); if(hasData(x)) done++; });
  const used=MUS_ORDER.filter(m=>plan[m]>0), full=used.filter(m=>fact[m]>=plan[m]-0.01);
  return {wk,ws,we,plan,fact,pSets,dSets,done:Math.min(done,4),used,full};
}

// Шапка экрана по референсу: слева круглая кнопка, по центру заголовок (и подпись), справа действие

// Полоса «значение / норма». Сверх нормы — как в референсе: полоса полная, а розовый отрезок в начале показывает долю перебора
const Meter=({v,max,color})=>{ const p=max?v/max:0, ex=p>1.001?Math.min(1,p-1):0;
  return html`<span class="meter"><i style=${{width:Math.min(100,p*100)+"%",background:color||"var(--accf)"}}></i>${ex?html`<i class="ex" style=${{width:Math.max(4,ex*100)+"%"}}></i>`:null}</span>`; };
const shiftDate=(d,n)=>{ const t=new Date(d+"T00:00:00"); t.setDate(t.getDate()+n); return t.toLocaleDateString("sv-SE"); };
const navDate=d=>{ const t=todayStr(), w=d===t?"Сегодня":d===shiftDate(t,-1)?"Вчера":d===shiftDate(t,1)?"Завтра":RU_DAYS[new Date(d+"T00:00:00").getDay()]; return w+", "+dayMonth(d); };
// Линейный график на тёмной карточке: сетка, подписи осей, точка на последнем значении
function LineChart({pts,w,h}){
  w=w||340; h=h||160; const L=30,R=14,T=16,B=22;
  // «круглый» шаг сетки (1, 2, 5, 10…), чтобы подписи оси не повторялись
  const vs=pts.map(p=>p.v), lo0=Math.min(...vs), hi0=Math.max(...vs), raw=Math.max(1,(hi0-lo0)/3), mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,5,10].map(k=>k*mag).find(x=>x>=raw), lo=Math.floor(lo0/step)*step-(hi0===lo0?step*2:0), hi=lo+step*4<hi0?Math.ceil(hi0/step)*step:lo+step*4;
  const ys=Array.from({length:Math.round((hi-lo)/step)+1},(_,k)=>lo+k*step);
  const X=i=>pts.length>1?L+i*(w-L-R)/(pts.length-1):(L+w-R)/2, Y=v=>T+(h-T-B)*(1-(v-lo)/(hi-lo||1));
  const last=pts.length-1, every=Math.ceil(pts.length/6);
  return html`<svg class="lchart" viewBox=${"0 0 "+w+" "+h} role="img" aria-label=${"График: последнее значение "+fmt(Math.round(vs[last]))}>
    ${ys.map((v,k)=>html`<g key=${k}><line x1=${L} x2=${w-R} y1=${Y(v)} y2=${Y(v)} stroke="var(--grid)" stroke-width=".6"/><text x=${L-6} y=${Y(v)+3} text-anchor="end">${fmt(Math.round(v))}</text></g>`)}
    ${pts.map((p,i)=>i%every===0||i===last?html`<text key=${i} x=${X(i)} y=${h-6} text-anchor="middle">${p.x}</text>`:null)}
    ${pts.length>1?html`<polyline points=${pts.map((p,i)=>X(i)+","+Y(p.v)).join(" ")} fill="none" stroke="var(--teal)" stroke-width="1.6" stroke-linejoin="round"/>`:null}
    <text x=${X(last)} y=${Y(vs[last])-9} text-anchor="middle" class="lc-v">${fmt(Math.round(vs[last]*10)/10)}</text>
    <circle cx=${X(last)} cy=${Y(vs[last])} r="4" fill="var(--teal)"/>
  </svg>`;
}
// Плитки дней недели: как «Приёмы пищи» в референсе
function weekDays(date){
  const wk=weekFromDate(date), ws=weekStart(date), we=weekEnd(date);
  const inWeek=sessions().filter(x=>x.date>=ws&&x.date<=we);
  return ORDER.map(k=>{ const real=inWeek.filter(x=>x.day===k).sort((a,b)=>b.date.localeCompare(a.date))[0], s=real||defSession(k);
    const rows=real?s.ex.reduce((a,e)=>a+rowsOf(s,e),0):s.ex.reduce((a,e)=>a+setsFor(xinfo(s,e).plan.ns,wk),0);
    const done=real?s.ex.reduce((a,e)=>a+Math.min(doneOf(e),rowsOf(s,e)),0):0;
    return {k,real,rows,done}; });
}

// Простой график тренда: две линии сетки, линия, точка на последнем значении, подписи первого и последнего
function TrendChart({vals,unit,w,h}){
  w=w||350; h=h||100; const pad=8, lo=Math.min(...vals), hi=Math.max(...vals), span=hi-lo||1;
  const X=i=>vals.length>1?pad+i*(w-2*pad)/(vals.length-1):w/2, Y=v=>h-22-(v-lo)/span*(h-44);
  const last=vals.length-1;
  return html`<svg class="trend" viewBox=${"0 0 "+w+" "+h} role="img" aria-label=${"С "+fmt(Math.round(vals[0]))+" до "+fmt(Math.round(vals[last]))+" "+unit}>
    <line x1="0" x2=${w} y1=${Y(hi)} y2=${Y(hi)} class="tr-g"/><line x1="0" x2=${w} y1=${Y(lo)} y2=${Y(lo)} class="tr-g"/>
    ${vals.length>1?html`<polyline points=${vals.map((v,i)=>X(i)+","+Y(v)).join(" ")} class="tr-l"/>`:null}
    <circle cx=${X(last)} cy=${Y(vals[last])} r="5" class="tr-d"/>
    <text x="0" y=${h-4} class="tr-t">${fmt(Math.round(vals[0]))} ${unit}</text>
    <text x=${w} y=${Math.max(12,Y(vals[last])-10)} text-anchor="end" class="tr-t tr-v">${fmt(Math.round(vals[last]))} ${unit}</text>
  </svg>`;
}

// Неделя — по экрану «Неделя» макета
function lagTip(date){
  const w=weekData(date), ws=w.ws, we=w.we;
  const inWeek=sessions().filter(x=>x.date>=ws&&x.date<=we&&hasData(x));
  if(!inWeek.length) return null;
  const doneDays=new Set(inWeek.map(x=>x.day)), left=ORDER.filter(k=>!doneDays.has(k));
  // план только по уже проведённым дням: что из них не добрали
  const planDone=MUS.map(()=>0);
  ORDER.filter(k=>doneDays.has(k)).forEach(k=>{ const real=inWeek.filter(x=>x.day===k).sort((a,b)=>b.date.localeCompare(a.date))[0];
    muscleCount(real,e=>rowsOf(real,e)).forEach((c,m)=>{ planDone[m]+=c.f; }); });
  let best=null;
  MUS_ORDER.forEach(m=>{ const gap=planDone[m]-w.fact[m]; if(gap>=1&&(!best||gap>best.gap)) best={m,gap}; });
  if(!best) return null;
  const day=left.find(k=>P[k].ex.some((r,i)=>(LV[k][i][best.m]||0)>=7));
  const bi=day?P[day].ex.findIndex((r,i)=>(LV[day][i][best.m]||0)>=7):-1;
  const n=Math.min(2,Math.ceil(best.gap));
  return {m:best.m,fact:w.fact[best.m],plan:w.plan[best.m],gap:best.gap,
    mod:day?{id:rid(),day,type:"add_sets",base:bi,n,from:inWeek.map(x=>x.date).sort().slice(-1)[0],reason:`не добрано ${fmt(best.gap)} подх. на «${MUS[best.m]}»`}:null};
}

function FocusView({date,setDate,day,setDay,toast,timer,setTimer,openAsk,ui,setUi,openHistory,go}){
  const {s,edit,remove,setWeek,finish}=useSession(date,day,toast), wk=s.week;
  const [idx,setIdx]=useState(null), [sheet,setSheet]=useState(null), [draft,setDraft]=useState(null), [showSum,setShowSum]=useState(false), [pick,setPick]=useState(false);

  let inf=null, rows=0, j=0, lt=null, exDone=false, def={w:"",r:"",q:""};
  if(e){

    j=curSet(s,e); exDone=j<0; if(j<0) j=Math.max(0,rows-1);
    const cur=e.sets[j]||blankSet(), prev=j>0?e.sets[j-1]:null, lp=lt&&(lt.e.sets[j]||lt.e.sets[lt.e.sets.length-1]);
    def={w:cur.w||(prev&&prev.w)||(lp&&lp.w)||"", r:cur.r||(lp&&lp.r)||String(inf.plan.lo), q:cur.q||""};

  // черновик текущего подхода хранится и в тренировке (s.draft), чтобы введённое не терялось при уходе с экрана;
  // подходом он не считается, пока не нажата «Подход сделан»
  const saved=s.draft&&s.draft.key===key?s.draft:null;
  const val=draft&&draft.key===key?draft:saved?Object.assign({},def,saved):Object.assign({key},def);
  const setVal=patch=>{ const d=Object.assign({},val,patch,{key}); setDraft(d); edit(ss=>{ ss.draft={key,w:d.w,r:d.r,q:d.q,t:d.t||""}; }); };
  const upd=fn=>edit(ss=>{ const x=ss.ex.find(y=>y.uid===e.uid); if(x){ if(x.n==null) x.n=rowsOf(ss,x); while(x.sets.length<x.n) x.sets.push(blankSet()); fn(x); } });
  const nextIdx=s.ex.findIndex((x,k)=>k>i&&curSet(s,x)>=0);
  const nk=nextIdx>=0?nextIdx:(i<s.ex.length-1?i+1:-1);
  const nInf=nk>=0?xinfo(s,s.ex[nk]):null;

  const logSet=()=>{
    const prevBest=bestBefore(inf.name,date), isPR=prevBest&&e1rm(val.w,val.r)>prevBest&&!e.sets.some(y=>e1rm(y.w,y.r)>=e1rm(val.w,val.r));
    const last=j>=rows-1, nx=nextIdx>=0?s.ex[nextIdx]:null;
    const next=!last?inf.name+" · подход "+(j+2):nx?xinfo(s,nx).name:"Тренировка закончена";
    const nextSub=!last?(val.w?nfmt(val.w)+" кг × ":"")+val.r+" · как сейчас":nx?rowsOf(s,nx)+" × "+xinfo(s,nx).plan.lo+"–"+xinfo(s,nx).plan.hi:"";
    upd(x=>{ x.sets[j]=Object.assign({},x.sets[j],{w:val.w,r:val.r,q:val.q,t:val.t||"",ok:true}); });
    edit(ss=>{ delete ss.draft; });
    if(isPR) toast({text:`Рекорд в «${inf.name}»: 1ПМ ≈ ${kgf(e1rm(val.w,val.r))} кг`});
    unlockSound(); setTimer({end:Date.now()+inf.plan.rest*1000,total:inf.plan.rest,label:inf.name,next,nextSub,done:"Подход "+(j+1)+" из "+rows+" записан"});
    setDraft(null);
    if(last) setIdx(nextIdx>=0?nextIdx:i);
  };
  const doneSets=s.ex.reduce((a,x)=>a+Math.min(doneOf(x),rowsOf(s,x)),0);
  const summary=showSum||(s.done&&allDone);

  if(summary) return html`<div class="fx">
    <section class="hero">
      <${AppBar} left=${html`<${AbIcon} n="left" label=${showSum?"Назад, к тренировке":"Назад, к прогрессу"} onClick=${()=>showSum?setShowSum(false):go("home")}/>`} title="Итог" sub=${P[day].name} right=${html`<${AbLink} icon="check" label="Готово" onClick=${()=>go("home")}/>`}/>
    </section>
    <${ViewSwitch} ui=${ui} setUi=${setUi}/>
    <${FinishPanel} s=${s} edit=${edit} toast=${toast} head=${{title:P[day].name,sub:longDate(date)}}/>
  </div>`;

  return html`<div class="fx" style=${{"--c":PC[day]}}>
    <${TrainHero} s=${s} date=${date} day=${day} ui=${ui} setUi=${setUi} onAsk=${()=>openAsk(null)} onDay=${()=>setSheet({type:"day"})} onMuscles=${()=>setSheet({type:"muscles"})}/>
    <${SecHead} title=${e?"Упражнение "+(i+1)+" из "+s.ex.length:"Нет упражнений"} onClick=${s.ex.length?()=>setPick(true):null}><${Elapsed} s=${s}/><//>
    ${pick?html`<${Sheet} title="Упражнения" onClose=${()=>setPick(false)}>
      <div class="menu">${s.ex.map((x,k)=>{ const r=rowsOf(s,x), d=Math.min(r,doneOf(x));
        return html`<button key=${x.uid||k} class=${"mitem pick"+(k===i?" cur":"")} onClick=${()=>{ setPick(false); goEx(k); }}>
          <i class=${d>=r&&r?"ok":""}>${d>=r&&r?html`<${Icon} n="check" size=${14}/>`:k+1}</i><span>${xinfo(s,x).name}</span><small>${d} из ${r}</small></button>`; })}</div>
    <//>`:null}
    <${AppliedBanner} s=${s} date=${date} day=${day} edit=${edit}/>

    ${!e?html`<section class="xcard"><p class="st">В тренировке нет упражнений.</p><button class="capsule" onClick=${()=>setSheet({type:"add"})}>Добавить упражнение</button></section>`
    :html`<${React.Fragment}>
      <section class="xcard">
        <div class="x-top">
          <h2>${inf.name}</h2>
          <button class="ibtn" aria-label="Действия с упражнением" onClick=${()=>setSheet({type:"menu",uid:e.uid})}><${Icon} n="more" size=${18}/></button>
        </div>
        <span class="x-sub">${exDone?"Все подходы сделаны":"Подход "+(j+1)+" из "+rows} · цель ${inf.plan.lo}–${inf.plan.hi} повторов · запас ${rirFor(inf.plan.rir)}${e.alt&&!inf.custom?" · вместо: "+inf.base:""}</span>
        <button class="tags" aria-label=${"Нагрузка на мышцы: "+lvSorted(inf.lv).slice(0,3).map(k=>MUS[k]+" "+inf.lv[k]).join(", ")} onClick=${()=>setSheet({type:"mus",uid:e.uid})}>${lvSorted(inf.lv).slice(0,3).map(k=>html`<span key=${k} class=${inf.lv[k]>=7?"hi":inf.lv[k]>=4?"mid":"lo"}>${MUS[k]} ${inf.lv[k]}</span>`)}</button>
        ${lt?html`<div class="lastw" aria-label=${"Прошлый раз, "+dm(lt.date)}><span>Прошлый раз · ${dm(lt.date)}</span>${lt.e.sets.filter(x=>num(x.r)!==null).map((x,k)=>html`<b key=${k} class=${k===j?"cur":""}>${x.w?nfmt(x.w)+" × ":""}${x.r}</b>`)}</div>`:null}
        ${!exDone?html`
          <div class="tiles">
            <${Tile} label="Вес" hint=${isBarbell(inf.name)&&platesFor(val.w)?"по "+platesFor(val.w).map(fmt).join("+"):""} unit="кг" step=${W_STEP} dec=${true} value=${val.w} onChange=${w=>setVal({w})}/>
            <${Tile} label="Повторы" unit="раз" step=${1} value=${val.r} onChange=${r=>setVal({r})}/>
          </div>
          <div class="qwrap">
            <span>Сколько ещё мог сделать</span>
            <div class="seg5" role="group" aria-label="Запас повторов">${["0","1","2","3","4+"].map(v=>html`<button key=${v} aria-pressed=${String(val.q===v)} class=${v==="0"?"q0":""} onClick=${()=>setVal({q:val.q===v?"":v})}>${v}</button>`)}</div>
          </div>
          <${SetType} value=${val.t||""} onChange=${t=>setVal({t})}/>
          <button class="capsule" onClick=${logSet}><${Icon} n="check" size=${20}/>Подход сделан</button>
        `:html`<button class="capsule" onClick=${()=>{ const n=s.ex.findIndex(x=>curSet(s,x)>=0); n>=0?goEx(n):setShowSum(true); }}>${allDone?"Подвести итог":"Следующее упражнение"}</button>`}
      </section>

      <section class="setlist" aria-label="Подходы">
        ${Array.from({length:rows},(_,k)=>{ const x=e.sets[k]||blankSet(), dn=setDone(x), cur=k===j&&!exDone;
          return html`<button key=${k} class=${"sl-row"+(cur?" cur":"")} onClick=${()=>{ if(dn){ upd(y=>{ y.sets[k].ok=false; y.sets[k].r=""; }); setDraft(null); } }} aria-label=${dn?"Подход "+(k+1)+" сделан. Нажми, чтобы переделать":"Подход "+(k+1)}>
            <span>Подход ${k+1}${SET_T[x.t]?html` <i class="st-t" aria-label=${SET_T[x.t].l}>${SET_T[x.t].s}</i>`:null}</span>
            <b class=${dn?"ok":cur?"now":""}>${dn?(x.w?nfmt(x.w)+" × ":"")+(x.r||"")+"  ✓":cur?"сейчас":"–"}</b></button>`; })}
        <div class="sl-act">
          <button onClick=${()=>upd(x=>{ x.n+=1; x.sets.push(blankSet()); })}><${Icon} n="plus" size=${18}/>Подход</button>
          ${rows>1?html`<button onClick=${()=>upd(x=>{ x.n=Math.max(1,x.n-1); x.sets=x.sets.slice(0,x.n); })}><${Icon} n="minus" size=${18}/>Подход</button>`:null}
        </div>
      </section>

      ${nInf?html`<button class="nx" onClick=${()=>goEx(nk)}><span>Дальше: ${nInf.name}</span><small>${rowsOf(s,s.ex[nk])} × ${nInf.plan.lo}–${nInf.plan.hi}</small></button>`:null}
      <${NoteField} value=${e.note||""} onChange=${v=>edit(ss=>{ const x=ss.ex.find(y=>y.uid===e.uid); if(x) x.note=v; })}/>
      <button class="glassbtn finish-btn" onClick=${()=>{ if(!s.done) finish(); setShowSum(true); window.scrollTo(0,0); }}><${Icon} n="flag" size=${18}/>Завершить тренировку</button>
    <//>`}
    <${SessionSheets} sheet=${sheet} setSheet=${setSheet} s=${s} date=${date} day=${day} edit=${edit} remove=${remove} openAsk=${openAsk} openHistory=${openHistory}
      setDate=${setDate} setDay=${setDay} setWeek=${setWeek} ui=${ui} setUi=${setUi}/>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
