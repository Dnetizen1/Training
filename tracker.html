<title>Дневник тренировок</title>
<style>
/* Layout: one-column phone-first app. Sticky top bar with week/RIR, day tabs, exercise cards with set rows, fixed rest-timer bar. */
:root{
  --bg:#eceef1; --card:#ffffff; --line:#d9dde3; --ink:#161a20; --mute:#5d6672;
  --accent:#2446d8; --accent-ink:#ffffff; --accent-soft:#e3e9fd;
  --ok:#17803d; --ok-soft:#dff3e5; --warn:#b4540a; --warn-soft:#fbead9;
  --field:#f5f6f8;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151a; --card:#1b2027; --line:#2c333d; --ink:#e9ecf1; --mute:#98a2b0;
  --accent:#8aa2ff; --accent-ink:#0d1330; --accent-soft:#232c52;
  --ok:#5cd187; --ok-soft:#173424; --warn:#f0a35e; --warn-soft:#3a2a18; --field:#232932; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151a; --card:#1b2027; --line:#2c333d; --ink:#e9ecf1; --mute:#98a2b0;
  --accent:#8aa2ff; --accent-ink:#0d1330; --accent-soft:#232c52;
  --ok:#5cd187; --ok-soft:#173424; --warn:#f0a35e; --warn-soft:#3a2a18; --field:#232932; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding-inline:16px;padding-block:0 120px;max-width:720px;margin-inline:auto}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:700 28px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.save{font-size:13px;color:var(--mute)}
.save.bad{color:var(--warn)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--line);padding:3px;border-radius:10px}
.nav button{border:0;background:transparent;padding:8px 2px;font-size:14px;border-radius:8px;font-weight:600;color:var(--mute)}
.nav button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.days button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 2px;font:700 17px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.days button small{display:block;font:500 11px/1.2 var(--body);text-transform:none;letter-spacing:0;color:var(--mute);margin-top:2px}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days button[aria-pressed="true"] small{color:inherit;opacity:.85}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.chip.warn{background:var(--warn-soft)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.stepper button{border:0;background:transparent;width:32px;height:32px;font-size:18px;border-radius:999px}
.stepper span{min-width:62px;text-align:center;font-weight:600;font-size:14px}
input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:14px}
.cards{display:grid;gap:12px;margin-top:6px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.ex.complete{border-color:var(--ok)}
.ex h2{font:700 21px/1.15 var(--display);letter-spacing:.01em;margin:0}
.plan{color:var(--mute);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px}
.plan b{color:var(--ink);font-weight:600}
.hint{font-size:13.5px;border-radius:8px;padding:6px 10px;background:var(--field);color:var(--mute)}
.hint.up{background:var(--ok-soft);color:var(--ink)}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:22px minmax(0,.9fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;align-items:center}
.set.head{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:center;font-weight:600}
.set .prev{font-size:13px;color:var(--mute);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .n{font:700 16px var(--display);color:var(--mute);text-align:center}
.set input[type=text]{width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-size:18px;font-variant-numeric:tabular-nums;text-align:center}
.tick{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--field);font-size:20px;line-height:1;color:var(--mute)}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.quiet{border-color:transparent;color:var(--mute);background:transparent}
textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;resize:vertical;min-height:40px}
.foot{display:grid;gap:10px;margin-top:14px}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;justify-content:center;z-index:9}
.timer[hidden]{display:none!important}
.timer .t{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;min-width:70px;text-align:center}
.timer .l{font-size:13px;opacity:.8;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px}
.timer.done{background:var(--ok);color:#fff}
.sess{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0}
.sess summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.sess summary::-webkit-details-marker{display:none}
.sess .d{font:700 18px var(--display);letter-spacing:.02em}
.sess .s{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.sess .body{padding:0 14px 14px;display:grid;gap:8px;font-size:14.5px}
.sess .body div b{font-weight:600}
.sess .body .mono{font-variant-numeric:tabular-nums;color:var(--mute)}
.list{display:grid;gap:8px;margin-top:6px}
.empty{color:var(--mute);padding:28px 8px;text-align:center}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:6px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--mute);min-width:0}
.form input{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;width:100%;min-width:0}
.form .full{grid-column:1/-1}
.tbl{overflow-x:auto;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
h3{font:700 18px var(--display);letter-spacing:.04em;text-transform:uppercase;margin:18px 0 0;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.tick{transition:background .12s}}

.swap{display:grid;gap:8px;background:var(--field);border-radius:10px;padding:10px}
.swap .opts{display:flex;flex-wrap:wrap;gap:6px}
.swap .opts button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px}
.swap .own{display:flex;gap:6px}
.swap .own input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px}
.was{font-size:12px;color:var(--warn);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ririn{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;width:100%}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;min-width:0}
.sum h4{font:700 18px/1.2 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:10px 0 0}
.sum h4:first-child{margin-top:0}
.sum p,.sum ul,.sum ol{margin:0}
.sum ul,.sum ol{padding-left:20px;display:grid;gap:4px}
.sum code{background:var(--field);padding:1px 5px;border-radius:5px;font-size:.92em}
.sum .st{color:var(--mute);font-size:14px}

.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mchips span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.mchips span b{font-weight:700}
.mchips span.ind{background:transparent;color:var(--mute);border-style:dashed}
.tbl td.dir{font-weight:600}
.tbl td.ok{color:var(--ok);font-weight:600}
.tbl td.low{color:var(--warn);font-weight:600}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line);background:var(--field)}
.note{color:var(--mute);font-size:13.5px;margin-top:10px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">

<div class="top">
  <div class="brand"><h1>Дневник тренировок</h1><span class="save" id="save" role="status"></span></div>
  <div class="nav" role="tablist">
    <button role="tab" data-view="train" aria-selected="true">Тренировка</button>
    <button role="tab" data-view="week" aria-selected="false">Неделя</button>
    <button role="tab" data-view="hist" aria-selected="false">История</button>
    <button role="tab" data-view="body" aria-selected="false">Замеры</button>
  </div>
</div>
<main id="main"></main>
<div class="timer" id="timer" hidden>
  <button id="t-minus" aria-label="Минус 15 секунд">−15</button>
  <div class="t" id="t-val">0:00</div>
  <div class="l" id="t-lbl">Отдых</div>
  <button id="t-plus" aria-label="Плюс 15 секунд">+15</button>
  <button id="t-stop">Стоп</button>
</div>

<script>
/* ---------- Программа ---------- */
// [название, подходы, повт. от, повт. до, RIR, отдых (сек), заметка]
const P = {
  UA:{name:"Верх A", sub:"горизонталь", ex:[
    ["Жим штанги лёжа",4,6,8,"2 (посл. 1)",180,"Без отбива, негатив 2–3 с, не до отказа"],
    ["Тяга с упором грудью",3,8,10,"1–2",140,""],
    ["Подтягивания / верт. тяга",4,6,10,"1–2",140,""],
    ["Жим гантелей сидя",2,8,10,"2",120,""],
    ["Махи в стороны, кроссовер (из-за спины)",4,12,20,"0–1",80,""],
    ["Сгибания на наклонной скамье (суперсет)",3,8,12,"0–1",90,""],
    ["Разгибания из-за головы, кроссовер",4,10,15,"0–1",90,""]]},
  LA:{name:"Низ A", sub:"присед", ex:[
    ["Приседания со штангой",3,5,8,"2",180,""],
    ["Румынская тяга",3,6,10,"2",165,""],
    ["Жим ногами",3,10,12,"1",120,""],
    ["Сгибания ног сидя",3,10,12,"0–1",90,""],
    ["Подъёмы на носки стоя",4,8,12,"0–1",80,"Пауза 2 с внизу; в последнем подходе частичные в растяжении"],
    ["Задние дельты в тренажёре (суперсет с икрами)",3,12,20,"0–1",60,""]]},
  UB:{name:"Верх B", sub:"наклон + вертикаль", ex:[
    ["Жим гантелей на наклонной 30°",3,8,10,"1–2",150,""],
    ["Тяга гантели одной рукой",3,8,12,"1",120,""],
    ["Тяга верхнего / горизонтального блока",3,10,12,"1",120,""],
    ["Сведения в кроссовере / пек-дек",3,10,15,"0–1",90,"Акцент на растяжение"],
    ["Махи гантелями в стороны",4,12,20,"0–1",80,""],
    ["Сгибания «Байесиан» (суперсет)",3,10,15,"0–1",90,""],
    ["Разгибания на блоке (пушдаун)",3,10,15,"0–1",90,""],
    ["Молотковые сгибания",2,10,12,"0–1",60,""]]},
  LB:{name:"Низ B", sub:"тренажёры + односторонняя", ex:[
    ["Гакк-приседания",3,8,10,"1–2",150,""],
    ["Болгарские выпады (вес на ногу)",3,8,12,"1–2",120,""],
    ["Сгибания ног сидя",4,10,15,"0–1",90,""],
    ["Разгибания ног",3,12,15,"0–1",90,"Полная амплитуда, пауза внизу"],
    ["Ягодичный мост / хип-траст",2,8,12,"1",120,""],
    ["Подъёмы на носки сидя",4,12,15,"0–1",60,""],
    ["Махи в стороны, кроссовер (суперсет с икрами)",3,12,20,"0–1",60,""],
    ["Обратные разведения, кроссовер (суперсет)",3,15,20,"0–1",60,""]]}
};
const ORDER = ["UA","LA","UB","LB"];
const DELT=["Махи гантелями в стороны","Махи в кроссовере","Махи в тренажёре","Махи сидя с гантелями"];
const ALT = {
 "Жим штанги лёжа":["Жим гантелей лёжа","Жим в тренажёре (грудь)","Жим в Смите лёжа"],
 "Тяга с упором грудью":["Тяга в тренажёре с упором грудью","Тяга гантелей лёжа на наклонной","Горизонтальная тяга блока"],
 "Подтягивания / верт. тяга":["Тяга верхнего блока широким хватом","Тяга верхнего блока нейтральным хватом","Гравитрон"],
 "Жим гантелей сидя":["Жим в тренажёре на плечи","Жим гантелей стоя","Жим Арнольда"],
 "Махи в стороны, кроссовер (из-за спины)":DELT,
 "Сгибания на наклонной скамье (суперсет)":["Сгибания «Байесиан»","Сгибания на скамье Скотта","Сгибания со штангой EZ"],
 "Разгибания из-за головы, кроссовер":["Французский жим гантели из-за головы","Разгибания из-за головы с канатом","Разгибания в тренажёре"],
 "Приседания со штангой":["Приседания в Смите","Гакк-приседания","Жим ногами","Гоблет-присед"],
 "Румынская тяга":["Румынская тяга с гантелями","Гиперэкстензия с весом","Румынская тяга в Смите"],
 "Жим ногами":["Гакк-приседания","Приседания в Смите","Разгибания ног"],
 "Сгибания ног сидя":["Сгибания ног лёжа","Сгибания ног стоя","Нордик-сгибания"],
 "Подъёмы на носки стоя":["Подъёмы на носки в Смите","Подъёмы на носки в жиме ногами","Подъёмы на носки с гантелью"],
 "Задние дельты в тренажёре (суперсет с икрами)":["Обратные разведения в кроссовере","Разведения гантелей лёжа на скамье","Тяга к лицу на канате"],
 "Жим гантелей на наклонной 30°":["Жим штанги на наклонной","Жим в тренажёре на наклонной","Жим в Смите на наклонной"],
 "Тяга гантели одной рукой":["Тяга в тренажёре одной рукой","Тяга блока одной рукой","Тяга Т-грифа"],
 "Тяга верхнего / горизонтального блока":["Тяга верхнего блока узким хватом","Горизонтальная тяга блока","Подтягивания"],
 "Сведения в кроссовере / пек-дек":["Пек-дек","Сведения в кроссовере","Сведения гантелей лёжа"],
 "Махи гантелями в стороны":DELT,
 "Сгибания «Байесиан» (суперсет)":["Сгибания на наклонной скамье","Сгибания в кроссовере стоя","Сгибания на скамье Скотта"],
 "Разгибания на блоке (пушдаун)":["Разгибания с канатом","Разгибания в тренажёре","Разгибания из-за головы, кроссовер"],
 "Молотковые сгибания":["Сгибания с канатом (молот)","Сгибания обратным хватом","Сгибания с гантелями сидя"],
 "Гакк-приседания":["Жим ногами","Приседания в Смите","Приседания со штангой"],
 "Болгарские выпады (вес на ногу)":["Выпады в Смите","Выпады с гантелями","Сплит-присед"],
 "Разгибания ног":["Разгибания ног одной ногой","Сисси-присед","Жим ногами узко"],
 "Ягодичный мост / хип-траст":["Ягодичный мост со штангой","Хип-траст в тренажёре","Обратная гиперэкстензия"],
 "Подъёмы на носки сидя":["Подъёмы на носки в жиме ногами","Подъёмы на носки в Смите","Подъёмы на носки с гантелью"],
 "Махи в стороны, кроссовер (суперсет с икрами)":DELT,
 "Обратные разведения, кроссовер (суперсет)":["Задние дельты в тренажёре","Тяга к лицу на канате","Разведения гантелей лёжа на скамье"]
};
const exName=(s,i)=>(s.ex[i]&&s.ex[i].alt)||P[s.day].ex[i][0];
const WEEKS = {1:"RIR 3",2:"RIR 2",3:"RIR 1–2",4:"изоляция 0–1 RIR",5:"изоляция 0–1 RIR",6:"разгрузка: ½ подходов, RIR 3–4"};
const START = "2026-10-01";

function setsFor(n, wk){ return wk===6 ? Math.ceil(n/2) : n; }
function rirFor(rir, wk){ return wk===1 ? "3" : wk===6 ? "3–4" : rir; }
function weekFromDate(d){
  const days = Math.floor((new Date(d+"T00:00:00") - new Date(START+"T00:00:00"))/864e5);
  return ((Math.max(0,Math.floor(days/7)))%6)+1;
}

/* ---------- Мышцы ---------- */
const MUS=["Грудь","Спина","Передняя дельта","Средняя дельта","Задняя дельта","Бицепс","Трицепс","Квадрицепс","Бицепс бедра","Ягодицы","Икры"];
// на упражнение: {мышца: вес}; 1 = основная (прямой подход), .5 = вспомогательная
const MAP={
 UA:[{0:1,6:.5,2:.5},{1:1,5:.5,4:.5},{1:1,5:.5},{2:1,6:.5},{3:1},{5:1},{6:1}],
 LA:[{7:1,9:.5},{8:1,9:.5},{7:1,9:.5},{8:1},{10:1},{4:1}],
 UB:[{0:1,6:.5,2:.5},{1:1,5:.5,4:.5},{1:1,5:.5,4:.5},{0:1,2:.5},{3:1},{5:1},{6:1},{5:1}],
 LB:[{7:1,9:.5},{7:1,9:.5},{8:1},{7:1},{9:1},{10:1},{3:1},{4:1}]
};
// setsAt(i) -> число подходов упражнения i; возвращает [{d:прямые, f:дробные}] по мышцам
function muscleCount(day,setsAt){
  const r=MUS.map(()=>({d:0,f:0}));
  MAP[day].forEach((m,i)=>{ const n=setsAt(i); for(const k in m){ if(m[k]===1) r[k].d+=n; r[k].f+=n*m[k]; } });
  return r;
}
const planSets=(day,wk)=>i=>setsFor(P[day].ex[i][1],wk);
const doneSets=s=>i=>(s.ex[i]?s.ex[i].sets.filter(x=>num(x.w)!==null&&num(x.r)!==null).length:0);
function weekStart(d){ const t=new Date(d+"T00:00:00"); const wd=(t.getDay()+6)%7; t.setDate(t.getDate()-wd); return t.toLocaleDateString("sv-SE"); }
function weekEnd(d){ const t=new Date(weekStart(d)+"T00:00:00"); t.setDate(t.getDate()+6); return t.toLocaleDateString("sv-SE"); }

let db=null, uid=null, store={}, local=false;
const LS="trainlog.v1";
const saveEl=document.getElementById("save");
function setSave(t,bad){ saveEl.textContent=t; saveEl.className="save"+(bad?" bad":""); }
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS)||"{}"); }catch(e){ return {}; } }
function lsWrite(){ try{ localStorage.setItem(LS, JSON.stringify(store)); }catch(e){} }
const timers={}, chains={}, pending=new Set(), vers={};
function persist(id){
  clearTimeout(timers[id]); pending.add(id); const v=vers[id]=(vers[id]||0)+1;
  setSave("Сохраняю…");
  timers[id]=setTimeout(()=>{
    const data=store[id];
    if(!db){ pending.delete(id); lsWrite(); setSave(local?"Сохранено на этом устройстве":"", false); return; }
    chains[id]=(chains[id]||Promise.resolve()).then(()=>
      db.collection("data/users/"+uid).doc(id).set(JSON.parse(JSON.stringify(data)))
    ).then(()=>{ if(vers[id]===v) pending.delete(id); setSave("Сохранено"); },()=>setSave("Не сохранилось. Проверь доступ",true));
  },700);
}
function sessions(){ return Object.entries(store).filter(([k,v])=>v&&v.kind==="session").map(([k,v])=>({id:k,...v})); }
function bodies(){ return Object.entries(store).filter(([k,v])=>v&&v.kind==="body").map(([k,v])=>({id:k,...v})); }

const todayStr=()=>new Date().toLocaleDateString("sv-SE");
let view="train", dayKey="UA", date=todayStr(), dayPicked=false, dateAuto=true, swapOpen=null, sampleFn=null, sumCtl=null, sumLive="";
const sid=()=>"s_"+date+"_"+dayKey;
function blankSession(){
  return {kind:"session",date,day:dayKey,week:weekFromDate(date),bw:"",note:"",done:false,
    ex:P[dayKey].ex.map(e=>({sets:Array.from({length:setsFor(e[1],weekFromDate(date))},()=>({w:"",r:"",ok:false})),note:""}))};
}
function cur(){
  const id=sid();
  if(!store[id]) store[id]=blankSession();
  return store[id];
}
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const num=v=>{ const x=parseFloat(String(v).replace(",",".")); return isFinite(x)?x:null; };
const fmt=x=>String(Math.round(x*100)/100).replace(".",",");

function lastTime(name){
  let best=null;
  for(const s of sessions()){
    if(s.date>=date||!s.ex) continue;
    s.ex.forEach((e,i)=>{
      if(exName(s,i)!==name||!e.sets.some(x=>num(x.w)!==null&&num(x.r)!==null)) return;
      if(!best||s.date>best.date) best={date:s.date,e};
    });
  }
  return best;
}

      <h2>${esc(shown)}</h2>
      <div class="plan"><span><b>${planned}×${lo}–${hi}</b></span><span>RIR <b>${esc(rirFor(rir,wk))}</b></span><span>отдых <b>${rest>=60?fmt(rest/60)+" мин":rest+" с"}</b></span></div>

    for(let j=0;j<rows;j++){

      h+=`<div class="set" data-j="${j}">
        <span class="n">${j+1}</span>
        <span class="prev">${lp.w?esc(lp.w)+"×"+esc(lp.r):"–"}</span>
        <input type="text" inputmode="decimal" data-f="w" value="${esc(x.w)}" placeholder="${esc(lp.w||"")}" aria-label="Вес, подход ${j+1}">
        <input type="text" inputmode="numeric" data-f="r" value="${esc(x.r)}" placeholder="${esc(lp.r||lo)}" aria-label="Повторы, подход ${j+1}">

      <input class="ririn" type="text" data-f="rir" value="${esc(ed.rir||"")}" placeholder="Реальный RIR в последнем подходе" aria-label="Реальный RIR">

function summary(s){
  const d=P[s.day];
  let t=`## ${s.date} · ${d.name} · нед. ${s.week}\n`;
  if(s.bw) t+=`Вес утром: ${s.bw} кг`+(s.dur?` · ${s.dur} мин`:"")+"\n";
  s.ex.forEach((e,i)=>{
    const sets=e.sets.filter(x=>num(x.w)!==null||num(x.r)!==null).map(x=>`${x.w||"?"}×${x.r||"?"}`).join(", ");
    if(sets||e.note) t+=`- ${exName(s,i)}: ${sets}${e.rir?" · RIR "+e.rir:""}${e.note?" ("+e.note+")":""}\n`;
  });
  if(s.note) t+=`Итог: ${s.note}\n`;
  return t;
}

main.addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  if(b.dataset.day){ dayKey=b.dataset.day; dayPicked=true; renderTrain(); return; }
  if(b.dataset.wk){ const s=cur(); s.week=Math.min(6,Math.max(1,s.week+Number(b.dataset.wk))); const old=s.ex.map(e=>e.sets.length);
    s.ex.forEach((e,i)=>{ const want=setsFor(P[dayKey].ex[i][1],s.week); while(e.sets.length<want&&!e.sets.some(x=>x.w||x.r)) e.sets.push({w:"",r:"",ok:false}); if(!e.sets.some(x=>x.w||x.r)) e.sets.length=want; });
    persist(sid()); renderTrain(); return; }
  if(b.id==="totoday"){ date=todayStr(); dateAuto=true; renderTrain(); return; }
  if(b.id==="sumgo"){ runSummary(); return; }
  if(b.id==="sumstop"){ sumCtl&&sumCtl.abort(); return; }
  if(b.id==="sumcopy"){ const txt=buildPrompt(cur());
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>setSave("Запрос скопирован, вставь его Клоду"),()=>setSave("Копирование недоступно",true)); return; }
  if(b.id==="finish"){ const s=cur(); s.done=!s.done; persist(sid()); renderTrain(); return; }
  if(b.id==="copytxt"){ const txt=summary(cur());
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>setSave("Скопировано"),()=>{ const ta=document.getElementById("snote"); setSave("Копирование недоступно",true); }); return; }
  const card=b.closest(".ex"); if(!card) return;
  const i=+card.dataset.i, s=cur(), ed=s.ex[i];
  if(b.dataset.act==="add"){ ed.sets.push({w:"",r:"",ok:false}); persist(sid()); renderTrain(); }
  else if(b.dataset.act==="del"){ ed.sets.pop(); persist(sid()); renderTrain(); }
  else if(b.dataset.act==="swap"){ swapOpen=swapOpen===i?null:i; renderTrain(); }
  else if(b.dataset.act==="pick"){ const nm=b.dataset.name; if(nm) ed.alt=nm; else delete ed.alt; swapOpen=null; persist(sid()); renderTrain(); }
  else if(b.dataset.act==="own"){ const v=document.getElementById("own-"+i).value.trim(); if(v){ ed.alt=v; swapOpen=null; persist(sid()); renderTrain(); } }
  else if(b.dataset.act==="copy"){ const lt=lastTime(ed.alt||P[dayKey].ex[i][0]); if(lt){ ed.sets=lt.e.sets.map(x=>({w:x.w,r:x.r,ok:false})); persist(sid()); renderTrain(); } }
  else if(b.dataset.act==="tick"){
    const j=+b.closest(".set").dataset.j;
    while(ed.sets.length<=j) ed.sets.push({w:"",r:"",ok:false});
    const set=ed.sets[j]; set.ok=!set.ok;
    const row=b.closest(".set");
    for(const f of ["w","r"]){ const inp=row.querySelector(`[data-f=${f}]`); if(!set[f]&&inp.placeholder&&set.ok){ set[f]=inp.placeholder; inp.value=inp.placeholder; } }
    b.setAttribute("aria-pressed",set.ok);
    persist(sid());
    if(set.ok){ startTimer(P[dayKey].ex[i][5], P[dayKey].ex[i][0]); }
    const planned=setsFor(P[dayKey].ex[i][1],s.week);
    card.classList.toggle("complete", ed.sets.slice(0,planned).every(x=>x.ok));
  }
});

let tEnd=0, tInt=null;

/* ---------- Саммери от Клода ---------- */
function md(src){
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`(.+?)`/g,"<code>$1</code>");
  let out="",list=null; const close=()=>{ if(list){ out+="</"+list+">"; list=null; } };
  for(const raw of esc(src).split("\n")){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){ close(); continue; }
    if((m=l.match(/^#{1,4}\s+(.*)/))){ close(); out+="<h4>"+inl(m[1])+"</h4>"; }
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=="ul"){ close(); out+="<ul>"; list="ul"; } out+="<li>"+inl(m[1])+"</li>"; }
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=="ol"){ close(); out+="<ol>"; list="ol"; } out+="<li>"+inl(m[1])+"</li>"; }
    else { close(); out+="<p>"+inl(l)+"</p>"; }
  }
  close(); return out;
}
function sessionBlock(s){
  const d=P[s.day]; let t=`${s.date} · ${d.name} · неделя ${s.week}`+(s.bw?` · вес утром ${s.bw} кг`:"")+(s.dur?` · ${s.dur} мин`:"")+"\n";
  s.ex.forEach((e,i)=>{
    const [,ns,lo,hi,rir]=d.ex[i];
    const sets=e.sets.filter(x=>x.w||x.r).map(x=>`${x.w||"?"}×${x.r||"?"}${x.ok?"":" (не отмечен)"}`).join(", ");
    t+=`- ${exName(s,i)}${e.alt?` [замена для «${d.ex[i][0]}»]`:""} · план ${setsFor(ns,s.week)}×${lo}–${hi}, RIR ${rirFor(rir,s.week)} · факт: ${sets||"не выполнено"}${e.rir?` · реальный RIR: ${e.rir}`:""}${e.note?` · заметка: ${e.note}`:""}\n`;
  });
  if(s.note) t+=`Самочувствие/сон/боли: ${s.note}\n`;
  return t;
}
function buildPrompt(s){
  const prev=sessions().filter(x=>x.date<s.date&&x.ex&&x.ex.some(e=>e.sets.some(y=>y.w||y.r))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);
  return `Ты опытный тренер по гипертрофии. Оцени мою тренировку и дай конкретные рекомендации.

Контекст: мужчина 26 лет, 177 см, ~83 кг, ~20% жира, стаж ~6 месяцев, цель — гипертрофия. Принимаю ААС под наблюдением врача, поэтому особое внимание сухожилиям (грудь, бицепс, надколенник) и давлению. Препараты не обсуждай.
Программа: верх/низ, 4 дня в неделю (Верх A, Низ A, Верх B, Низ B), мезоцикл 6 недель: нед.1 RIR 3, полный объём, нед.2 RIR 2, нед.3 RIR 1–2, нед.4–5 изоляция 0–1 RIR, нед.6 разгрузка (½ подходов, RIR 3–4). Жимы — 1–3 RIR, без отказа и отбива, прибавка веса в базе не более ~5% в неделю. Двойная прогрессия: все подходы на верхней границе повторов при целевом RIR → вес +2,5–5% (изоляция +1–2 кг).
Питание сейчас: лёгкий дефицит ~2400 ккал, белок ~180 г.

ТРЕНИРОВКА ДЛЯ ОЦЕНКИ:
${sessionBlock(s)}
${prev.length?"ПРЕДЫДУЩИЕ ТРЕНИРОВКИ (для сравнения):\n"+prev.map(sessionBlock).join("\n"):"Предыдущих тренировок в дневнике нет, это первая."}
Ответь по-русски, коротко (до 250 слов), без воды, в такой структуре:
## Оценка
Одна-две фразы и оценка из 10 за выполнение плана.
## Что хорошо

(объём, близость к отказу, техника по заметкам, сигналы по сухожилиям/самочувствию)
## Следующая тренировка
Конкретные веса и повторы по ключевым упражнениям этого дня и что поменять.
Если данных мало или они выглядят неполными, так и скажи, не выдумывай.`;
}
function paintSummary(){
  const box=document.getElementById("sumbox"); if(!box) return;
  const s=store[sid()];
  if(sumLive!==null&&sumLive!==""&&sumCtl){ box.innerHTML=`<div class="sum">${sumLive==="…"?`<div class="st">Клод думает… Первый ответ может прийти через полминуты.</div>`:md(sumLive)}<div class="row-actions"><button class="btn" id="sumstop">Стоп</button></div></div>`; return; }
  if(sumLive) box.innerHTML=`<div class="sum"><div class="st">${esc(sumLive)}</div></div>`;
  else if(s&&s.summary) box.innerHTML=`<div class="sum">${md(s.summary)}</div>`;
  else box.innerHTML="";
}
async function runSummary(){
  const s=cur();
  if(!s.ex.some(e=>e.sets.some(x=>x.w&&x.r))){ sumLive="Сначала впиши хотя бы один подход (вес и повторы)."; paintSummary(); return; }
  sumCtl=new AbortController(); sumLive="…"; paintSummary();
  const id=sid();
  try{
    const r=await sampleFn(buildPrompt(s),{signal:sumCtl.signal,cache:false,onText:({text})=>{ sumLive=text; if(sid()===id) paintSummary(); }});
    const st=store[id]||s; st.summary=r.text+(r.truncated?"\n\n(Ответ оборван, нажми ещё раз.)":""); store[id]=st; persist(id);
    sumCtl=null; sumLive="";
  }catch(e){
    const partial=e&&e.text; sumCtl=null;
    const msg={cancelled:"",not_granted:"Доступ к Клоду не разрешён. Используй «Копировать запрос для Клода».",rate_limited:"Слишком много запросов или лимит исчерпан. Попробуй позже.",session_expired:"Нужно заново войти в аккаунт."}[e&&e.code];
    sumLive=partial?partial:(msg===undefined?"Не получилось получить ответ. Попробуй ещё раз.":msg);
    if(e&&e.code==="cancelled"&&!partial) sumLive="";
  }
  if(sid()===id) paintSummary();
}

/* ---------- Неделя ---------- */
let planWeek=null;
function renderWeek(){
  const wk=planWeek||weekFromDate(date);
  const pd=ORDER.map(k=>muscleCount(k,planSets(k,wk)));
  const ws=weekStart(date), we=weekEnd(date);
  const fact=MUS.map(()=>0);
  sessions().filter(x=>x.date>=ws&&x.date<=we&&x.ex).forEach(x=>{ muscleCount(x.day,doneSets(x)).forEach((c,k)=>{ fact[k]+=c.f; }); });
  const totD=MUS.map((_,k)=>pd.reduce((a,d)=>a+d[k].d,0));
  const totF=MUS.map((_,k)=>pd.reduce((a,d)=>a+d[k].f,0));
  const perDay=ORDER.map(k=>P[k].ex.reduce((a,e,i)=>a+setsFor(e[1],wk),0));
  const hasFact=fact.some(v=>v>0);
  const d2=x=>x.split("-").reverse().slice(0,2).join(".");
  main.innerHTML=`<div class="meta" style="margin-top:6px">
      <div class="stepper"><button data-pw="-1" aria-label="Неделя назад">−</button><span>Неделя ${wk}</span><button data-pw="1" aria-label="Неделя вперёд">+</button></div>
      <span class="chip${wk===6?" warn":""}">${esc(WEEKS[wk])}</span>
    </div>
    <div class="tbl"><table><thead><tr><th>Мышца</th>${ORDER.map(k=>`<th>${P[k].name}</th>`).join("")}<th>Всего</th><th>Дроб.</th><th>Факт</th></tr></thead><tbody>
    ${MUS.map((m,k)=>{
      const cls=!hasFact?"":fact[k]>=totF[k]-0.01?"ok":"low";
      return `<tr><td>${m}</td>${pd.map(d=>d[k].d?`<td class="dir">${d[k].d}</td>`:d[k].f?`<td style="color:var(--mute)">+${fmt(d[k].f)}</td>`:`<td style="color:var(--mute)">–</td>`).join("")}<td class="dir">${totD[k]||"–"}</td><td>${fmt(totF[k])}</td><td class="${cls}">${hasFact?fmt(fact[k]):"–"}</td></tr>`;
    }).join("")}
    </tbody><tfoot><tr><td>Подходов за тренировку</td>${perDay.map(n=>`<td>${n}</td>`).join("")}<td>${perDay.reduce((a,b)=>a+b,0)}</td><td></td><td></td></tr></tfoot></table></div>
    <p class="note"><b>Верх A … Низ B</b>: прямые подходы на мышцу в каждой тренировке; «+1,5» значит только косвенная нагрузка (например, трицепс от жимов). <b>Всего</b> прямых за неделю. <b>Дроб.</b>: прямой подход = 1, косвенный = 0,5; ориентир 10–16 в неделю. <b>Факт</b>: дробные подходы с заполненными весом и повторами за календарную неделю ${d2(ws)}–${d2(we)}; зелёный, если план выполнен.</p>`;
}
main.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-pw]"); if(!b) return;
  planWeek=Math.min(6,Math.max(1,(planWeek||weekFromDate(date))+Number(b.dataset.pw))); renderWeek();
});

/* ---------- История ---------- */
function renderHist(){
  const list=sessions().filter(s=>s.ex&&s.ex.some(e=>e.sets.some(x=>x.w||x.r))).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  if(!list.length){ main.innerHTML=`<div class="empty">Пока нет записей. Заполни первую тренировку, и она появится здесь.</div>`; return; }
  main.innerHTML=`<div class="list">`+list.map(s=>{
    let vol=0,cnt=0;
    s.ex.forEach(e=>e.sets.forEach(x=>{ const w=num(x.w),r=num(x.r); if(w!==null&&r!==null){ vol+=w*r; cnt++; } }));
    const d=P[s.day];
    const body=s.ex.map((e,i)=>{
      const sets=e.sets.filter(x=>x.w||x.r).map(x=>`${esc(x.w||"?")}×${esc(x.r||"?")}`).join(", ");
      return sets||e.note?`<div><b>${esc(exName(s,i))}</b><br><span class="mono">${sets}</span>${e.note?`<br>${esc(e.note)}`:""}</div>`:"";
    }).join("");
    return `<details class="sess"><summary><span class="d">${s.date.split("-").reverse().join(".")} · ${d.name}</span><span class="s">нед. ${s.week} · ${cnt} подх. · ${Math.round(vol).toLocaleString("ru")} кг объём${s.done?" · ✓":""}</span></summary>
    <div class="body">${s.bw?`<div class="mono">Вес утром: ${esc(s.bw)} кг${s.dur?` · ${esc(s.dur)} мин`:""}</div>`:""}${body}${s.note?`<div>${esc(s.note)}</div>`:""}${s.summary?`<div class="sum">${md(s.summary)}</div>`:""}</div></details>`;
  }).join("")+`</div>`;
}

/* ---------- Замеры ---------- */
const BF=[["w","Вес, кг"],["waist","Талия, см"],["arm","Рука, см"],["thigh","Бедро, см"],["bp","Давление"],["hr","Пульс покоя"]];
function renderBody(){
  const rows=bodies().sort((a,b)=>b.date.localeCompare(a.date));
  main.innerHTML=`<form class="form" id="bform">
    <label class="full">Дата<input type="date" id="b-date" value="${todayStr()}"></label>
    ${BF.map(([k,l])=>`<label>${l}<input type="text" id="b-${k}" inputmode="${k==="bp"?"text":"decimal"}"></label>`).join("")}
    <button class="btn primary full" type="submit">Добавить замер</button>
  </form>
  <h3>Журнал</h3>
  ${rows.length?`<div class="tbl"><table><thead><tr><th>Дата</th>${BF.map(([k,l])=>`<th>${l.replace(", кг","").replace(", см","")}</th>`).join("")}<th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${r.date.split("-").reverse().join(".")}</td>${BF.map(([k])=>`<td>${esc(r[k]||"–")}</td>`).join("")}<td><button class="btn quiet" data-del="${esc(r.id)}" aria-label="Удалить замер">✕</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Замеров нет. Мерь утром, натощак, в одинаковых условиях.</div>`}`;
}
main.addEventListener("submit",ev=>{
  if(ev.target.id!=="bform") return;
  ev.preventDefault();
  const d=document.getElementById("b-date").value||todayStr();
  const rec={kind:"body",date:d};
  BF.forEach(([k])=>{ rec[k]=document.getElementById("b-"+k).value.trim(); });
  const id="b_"+d; store[id]=rec; persist(id); renderBody();
});
main.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-del]"); if(!b) return;
  const id=b.dataset.del; delete store[id];
  if(db){ db.collection("data/users/"+uid).doc(id).delete().then(()=>setSave("Удалено"),()=>setSave("Не удалилось",true)); } else lsWrite();
  renderBody();
});

/* ---------- Навигация ---------- */
function render(){
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===view));
  if(view==="train") renderTrain(); else if(view==="week") renderWeek(); else if(view==="hist") renderHist(); else renderBody();
}
document.querySelector(".nav").addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b) return; view=b.dataset.view; render(); window.scrollTo(0,0);
});

function pickNextDay(){
  if(dayPicked) return;
  const done=sessions().filter(s=>s.ex&&s.ex.some(e=>e.sets.some(x=>x.w||x.r))).sort((a,b)=>b.date.localeCompare(a.date));
  if(done.length){ const i=ORDER.indexOf(done[0].day); dayKey=ORDER[(i+1)%4]; }
}

/* ---------- Запуск ---------- */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&dateAuto&&date!==todayStr()){ date=todayStr(); if(view==="train"&&!sumCtl) renderTrain(); }
});
render();
(async()=>{ try{ sampleFn=window.claude?await window.claude.use("sample"):null; }catch(e){ sampleFn=null; } if(sampleFn&&view==="train"&&!document.activeElement.closest?.("#main")) renderTrain(); })();
(async()=>{
  try{
    const user=window.claude?await window.claude.use("user"):null;
    uid=user&&user.id?await user.id():null;
    db=uid&&window.claude?await window.claude.use("db"):null;
  }catch(e){ db=null; }
  if(!db){
    local=true; store=lsRead(); setSave("Сохранение на этом устройстве");
    pickNextDay(); render(); return;
  }
  let first=true;
  db.collection("data/users/"+uid).onSnapshot(snap=>{
    const prev=JSON.stringify(store[sid()]||null);
    const next={}; snap.docs.forEach(d=>{ next[d.id]=JSON.parse(JSON.stringify(d.data())); });
    // локальные несохранённые правки не затираем
    for(const id of pending) if(store[id]) next[id]=store[id];
    store=next;
    if(first){ first=false; pickNextDay(); setSave("Синхронизировано"); render(); return; }
    const typing=document.activeElement&&main.contains(document.activeElement)&&/INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if(typing) return;
    if(view!=="train"||JSON.stringify(store[sid()]||null)!==prev) render();
  },()=>{ db=null; local=true; store=lsRead(); setSave("Нет синхронизации, пишу на устройство",true); render(); });
})();
</script>
