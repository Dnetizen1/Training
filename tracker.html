.bbell::-webkit-scrollbar{display:none}
.bbell::before{content:"";position:absolute;left:0;right:0;top:39px;height:6px;border-radius:3px;background:var(--track)}
.bb-sleeve,.bb-collar{position:relative;flex:none;border-radius:3px;background:var(--arrow)}
.bb-sleeve{width:8px;height:30px;margin-top:27px}
.bb-collar{width:10px;height:18px;margin-top:33px}
.bb-b{position:relative;flex:none;display:grid;grid-template-rows:84px auto;justify-items:center;align-items:center;gap:4px;width:28px;padding:0;border:0;background:none;color:var(--mute2)}
.bb-b small{font:600 13px/16px var(--font);font-variant-numeric:tabular-nums}
.bb-b.full small{color:var(--ink2)}
.bb-b.cur small{color:var(--ink);font-weight:700}
.bb-p{display:block;width:20px;border-radius:3px;background:linear-gradient(to top,var(--c) var(--p),var(--bg) var(--p));box-shadow:inset 0 0 0 2px var(--c);transition:--p .3s var(--ease),transform .15s var(--ease)}
.bb-b.cur .bb-p{box-shadow:inset 0 0 0 2px var(--c),0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.bb-b:active .bb-p{transform:scale(.94)}
.bb-now{font-size:14px;color:var(--mute)}
.bb-now b{color:var(--ink);font-weight:600}
.exb{scroll-margin-top:calc(16px + env(safe-area-inset-top,0px))}
.linkbtn.th-mus{margin-top:0;padding:12px 0;color:var(--ink2)}

/* выбор вида и все переключатели: белая таблетка */
.vswitch button{border-radius:21px;background:var(--fill);color:var(--mute);font-weight:600}
.vswitch button[aria-pressed="true"],.days button[aria-pressed="true"],.seg button[aria-pressed="true"],.viewseg button[aria-pressed="true"],.seg3 button[aria-pressed="true"],.seg5 button[aria-pressed="true"],.qpick-b button.on{background:var(--sel);color:var(--sel-ink)}
.seg5 button.q0[aria-pressed="true"]{background:var(--p-red);color:#fff}
.days,.seg,.viewseg,.seg3,.seg5{border-radius:22px}
.days button,.seg button,.seg5 button{border-radius:18px}

/* кнопки: главное действие — синий блин, капсула */
.capsule,.btn.primary,.cta,.finish .review .row-actions .btn,.corr-foot .btn.primary{background:var(--accf);color:#fff;font-weight:600}
.capsule{min-height:52px;border-radius:26px}
.btn{border-radius:22px;font-weight:600}
.linkbtn{color:var(--acc)}
.tbadge,.sec2 .elapsed{color:var(--ink);background:var(--fill)}

/* карточки r20 */
.exb,.xcard,.ccard,.gcard,.banner,.dtile,.rowc,.mitem,.setlist,.nextcard,.tiles4 div,.durtile,.notetile,.bodytiles button,.bars,.tbl,.sum,.card,.grp,.lv,.form,.hist-chart{border-radius:20px}
.exb{padding:16px 16px 12px}
.exb-title,.x-top h2{font-family:var(--font);font-size:18px;line-height:24px;font-weight:600}
.sec2{font-size:20px;font-weight:700}
.sec2 .tbadge,.sec2 .elapsed{font-family:var(--font);font-weight:600;font-size:16px;height:32px;line-height:32px;border-radius:16px;background:var(--fill)}

/* нагрузка на мышцы — точкой цвета блина: 7–10 красный, 4–6 синий, 1–3 жёлтый */
.lvline span,.tags span{display:inline-flex;align-items:center;gap:6px;height:24px;line-height:24px;padding:0 12px 0 8px;border-radius:12px;background:var(--fill);color:var(--ink2);font-size:13px}
.lvline span::before,.tags span::before{content:"";flex:none;width:8px;height:8px;border-radius:4px;background:var(--p-yellow)}
.lvline span.hi::before,.tags span.hi::before{background:var(--p-red)}
.lvline span.mid::before,.tags span.mid::before{background:#5B8DEB}
.lvline span.hi,.lvline span.mid,.tags span.hi{background:var(--fill);color:var(--ink)}
.lvline span.more::before{display:none}
.lvrow.hi{background:var(--lv-hi)}.lvrow.mid{background:var(--lv-mid)}

/* подходы */
.row{border-top-color:var(--sep)}
.row input[type=text],.q{border-radius:12px}
.row.done input[type=text]{background:var(--acc-soft)}
.row.done .n{color:var(--acc);font-weight:700}
.row.done input[type=text]{background:#24334F}
.row input::placeholder{color:#96969B;opacity:1}
.row input[type=text]:focus{border-color:var(--acc);border-width:2px;background:var(--card)}
.q.q0{background:var(--p-red);color:#fff}.q.q1{background:var(--lv-hi)}.q.q2{background:var(--acc-soft)}
.hint.up{background:var(--ok-soft)}

/* «Прогресс»: дни — блинами своего цвета */
.dt-img{right:16px;bottom:auto;top:48px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,var(--card) 0 12%,var(--c) 13% 62%,color-mix(in srgb,var(--c) 70%,#000) 63% 69%,var(--c) 70%)}
.kr-fg,.ring2-fg{stroke:var(--accf)}
.db-t i,.track .factb{background:var(--accf)}
.gc-cells small{color:var(--acc)}
.ds-day.on.today b{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.ds-day.today b{box-shadow:inset 0 0 0 2px var(--ink)}
.badge{background:var(--acc-soft);color:var(--acc)}

/* нижняя панель: парящая таблетка, активная вкладка — белая, «+» — красный блин */
.tabbar{left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom,0px));max-width:616px;margin-inline:auto;padding:6px;border-radius:32px;background:var(--tab);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tabbar button{height:52px;border-radius:26px;color:var(--mute)}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-selected="true"]{background:var(--sel);color:var(--sel-ink)}
.tb-fab > span{width:52px;height:52px;border-radius:26px;background:var(--fab);box-shadow:none}
.sheet-wrap.over-tabs{bottom:calc(72px + max(16px,env(safe-area-inset-bottom,0px)))}
.sheet-wrap.over-tabs .sheet{border-radius:24px}
body,:root[data-view="train"] body{padding-bottom:calc(110px + max(16px,env(safe-area-inset-bottom,0px)))}

/* шторки, чат, таймер */
.sheet{background:var(--bg)}
.sheet-head::before{background:var(--track)}
.sheet-head b{font-size:20px}
.sheet-wrap{background:rgba(24,24,26,.82)}
.pillsel{border-radius:21px}
.qa-s,.qa-b,.qa-d{border-radius:16px}
.msg.user{background:var(--accf)}
.timer{background:var(--accf);border-radius:20px}
.timer.done{background:#1F7F49;color:#fff}
.toast{border-radius:20px}
.toast button,.sl-act button,.xacts button{color:var(--acc)}
.sl-row b.ok,.lastw b.cur{color:var(--acc)}
.segs button i{background:var(--accf)}
.tile-in{border-color:var(--accf)}
.help-b{color:var(--ink)}

/* заставка: зал, без свечения */
.splash{background:var(--bg);color:var(--ink);font-size:28px;font-weight:800}

/* нажатие и фокус: на телефоне hover нет, поэтому отклик — лёгкое сжатие; выбранная таблетка плавно меняет и фон, и текст */
:is(.tabbar button,.vswitch button,.days button,.seg button,.seg5 button,.qpick-b button,.ab-i,.ab-coach,.ab-link,.lvline,.tags,.capsule,.btn){transition:transform .15s var(--ease),background-color .2s,color .2s}
:is(.tabbar button:not(.tb-fab),.vswitch button,.days button,.seg button,.seg5 button,.qpick-b button,.ab-i,.ab-coach,.ab-link,.lvline,.tags):active{transform:scale(.96)}
.tb-fab > span{transition:transform .25s var(--ease)}
.tb-fab:active > span{transform:scale(.92)}
.tb-fab.open:active > span{transform:rotate(45deg) scale(.92)}
.tb-fab:focus-visible{outline:0}
.tb-fab:focus-visible > span{outline:2px solid var(--acc);outline-offset:2px}
:is(.days,.seg,.seg5) button:focus-visible{outline-offset:-3px}
:is(.days,.seg,.seg5,.vswitch,.qpick-b) :is(button[aria-pressed="true"],button.on):focus-visible{outline-color:var(--accf)}
.segs button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.notetile:focus-within{box-shadow:0 0 0 2px var(--acc)}
.qpick-b button.q0.on{background:var(--p-red);color:#fff}
.linkbtn:disabled,:is(.capsule,.days button,.seg5 button,.vswitch button):disabled{opacity:.45;cursor:default}
/* цели касания не меньше 44pt */
.ab-coach,.ab-i{width:44px;height:44px;border-radius:22px}
.ab-link{height:44px;border-radius:22px}
.dn-a,.exb-head .ibtn{width:44px;height:44px}
/* «Неделя»: лист больше не наезжает на шапку — шапка без панели, наезд из v8 закрывал заголовок */
.blacksheet{margin-top:0;border-radius:0}

/* ===== v9.1: экраны по вариантам 2 (холст «Экраны») ===== */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wk-nav{display:flex;gap:4px}
.dn-a:disabled{opacity:.3;cursor:default}
/* Прогресс: шапка — сегодняшняя тренировка, фон в оттенке дня */
.thero{--tint:color-mix(in srgb,var(--c) 20%,#18181A);display:grid;gap:12px;margin:0 calc(-1*var(--g));padding:6px var(--g) 22px;background:var(--tint);border-radius:0 0 28px 28px}
html:has(.thero){background:var(--tint,var(--bg))}
.th-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;color:color-mix(in srgb,var(--c) 35%,#F4F4F2)}
.th-day{justify-self:start;border:0;background:none;padding:0;color:var(--ink);font:800 40px/1.05 var(--disp);text-align:left}
.th-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:8px}
.th-bar .bbwrap{margin-top:0;--bg:var(--tint)}
.th-bar .bbell::before{background:color-mix(in srgb,var(--c) 30%,#3A3A3F)}
.th-cnt{display:grid;justify-items:end;padding-top:24px}
.th-cnt b{font:800 28px/1 var(--disp)}
.th-cnt small{font-size:13px;color:var(--ink2)}
.th-go{min-height:52px;border:0;border-radius:26px;background:var(--sel);color:var(--sel-ink);font:600 16px var(--font)}
.wk-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:26px}
.wk-h .sec2{margin:0;width:auto;flex:1;min-width:0}
.wk-h .sec2 > svg{display:none}
.wk-n{font-style:normal;font-family:var(--font);font-size:15px;font-weight:500;color:var(--mute)}
.home .today-back{justify-self:start;margin:4px 0 0}
.wrings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.wr{display:grid;justify-items:center;gap:6px;border:0;background:none;padding:4px 0;color:var(--mute);font-size:13px;min-width:0}
.wr b{color:var(--ink);font-weight:600;font-size:14px}
.tr-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:30px}
.tr-h .sec2{margin:0;width:auto;min-width:0;font-size:18px}
.tr-h .sec2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-h > span{flex:none;font-size:14px}
.tr-up{color:var(--ok)}.tr-dn{color:var(--warn)}
.trend{display:block;width:100%;height:auto;margin-top:10px}
.tr-g{stroke:var(--fill);stroke-width:1}
.tr-l{fill:none;stroke:var(--accf);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.tr-d{fill:var(--accf)}
.tr-t{fill:var(--mute);font:500 11px var(--font)}
.tr-v{fill:var(--ink);font-size:12px}
.plist3{display:grid;border-radius:20px;background:var(--card);overflow:hidden}
.plist3 button{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:8px 16px;border:0;border-top:1px solid var(--sep);background:none;color:var(--ink);font-size:16px;text-align:left}
.plist3 button:first-child{border-top:0}
.plist3 span{display:grid;min-width:0}
.plist3 small{font-size:13px;color:var(--mute)}
.plist3 b{flex:none;font-weight:600}
.home .gcard{margin-top:0}
/* Неделя: мышцы плитками, заливка — набранное, жёлтая рамка — отстаёт */
.wk-sum{margin:6px 0 0;font-size:16px;line-height:1.4;color:var(--ink2)}
.mtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.mtile{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:104px;padding:10px 12px;border-radius:16px;background:var(--card);overflow:hidden;font-size:13px;font-weight:500}
.mtile i{position:absolute;left:0;right:0;bottom:0;background:var(--acc-soft)}
.mtile span,.mtile b{position:relative}
.mtile b{font:700 22px var(--disp)}
.mtile b small{font:500 13px var(--font);color:var(--mute)}
.mtile.ok i{background:var(--ok-soft)}
.mtile.ok b::after{content:" ✓";font:600 15px var(--font);color:var(--ok)}
.weekscr .banner{margin-top:16px}
/* Тренировка: сделанное — строкой, следующие — компактно */
.xrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:52px;padding:6px 14px;border:0;border-radius:16px;background:var(--card);color:var(--ink);text-align:left;font-size:15px;font-weight:500;scroll-margin-top:16px}
.xrow i{display:grid;place-items:center;width:26px;height:26px;border-radius:13px;font-style:normal;font-size:13px;font-weight:700}
.xrow.done i{background:var(--accf);color:#fff}
.xrow.next{min-height:46px;background:none;box-shadow:inset 0 0 0 1px var(--sep);color:var(--ink2);font-weight:400}
.xrow.next i{box-shadow:inset 0 0 0 2px var(--accf);color:var(--acc)}
.xrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xrow small{font-size:13px;color:var(--mute);white-space:nowrap}
.exlist{gap:8px}
/* История: календарь и упражнения */
.hseg{display:flex;gap:8px;margin-top:12px}
.hseg button{min-height:40px;padding:0 18px;border:0;border-radius:20px;background:var(--fill);color:var(--mute);font:600 15px var(--font);transition:background-color .2s,color .2s}
.hseg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.cal-h h2{margin:0;font:800 24px var(--disp)}
.cal-h small{font-size:14px;color:var(--mute)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 0;margin:14px -8px 0;text-align:center}
.cal > span{font-size:12px;color:var(--mute);padding-bottom:4px}
.cd{justify-self:center;width:44px;height:44px;border:0;border-radius:22px;background:none;color:var(--ink);font:500 16px var(--font);padding:0}
.cd.out{opacity:.35}
.cd.now{box-shadow:inset 0 0 0 2px var(--ink)}
.cd.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.histv .dlegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--mute)}
.histv .dlegend span{display:inline-flex;align-items:center;gap:6px}
.hday{display:grid;gap:0;margin-top:16px;padding:14px 16px;border-radius:20px;background:var(--card)}
.hd-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:8px}
.hd-h b{font:700 17px var(--disp)}
.hd-h span{font-size:14px;color:var(--mute);white-space:nowrap}
.hd-r{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--sep);font-size:15px}
.hd-r span{min-width:0}
.hd-r b{flex:none;font-weight:600}
.hday .capsule{margin-top:10px}
.hday.empty-day{gap:8px;color:var(--mute)}
.hday.empty-day .linkbtn{justify-self:start;padding:10px 0}
.hsearch{display:flex;align-items:center;gap:10px;height:44px;margin-top:16px;padding:0 16px;border-radius:22px;background:var(--card);color:var(--mute)}
.hsearch input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--ink);font:400 16px var(--font);outline:0;-webkit-appearance:none;appearance:none}
.hsearch:focus-within{box-shadow:0 0 0 2px var(--acc)}
.hx-note{margin:12px 4px 8px;font-size:13px;color:var(--mute)}
.hxlist{display:grid;border-radius:20px;background:var(--card);overflow:hidden}
.hx{display:grid;grid-template-columns:minmax(0,1fr) 72px 68px;grid-template-rows:auto auto;gap:2px 12px;align-items:center;width:100%;padding:12px 14px;border:0;border-top:1px solid var(--sep);background:none;color:var(--ink);text-align:left}
.hx:first-child{border-top:0}
.hx b{font-size:15px;font-weight:600;line-height:1.25}
.hx small{grid-row:2;font-size:13px;color:var(--mute)}
.hx svg{grid-row:1/3;grid-column:2}
.hx em{grid-row:1/3;grid-column:3;font-style:normal;text-align:right;font-weight:600;font-size:14px}
polyline.mt-up{stroke:var(--ok)}polyline.mt-dn{stroke:var(--warn)}polyline.mt-fl{stroke:var(--mute)}
em.mt-up{color:var(--ok)}em.mt-dn{color:var(--warn)}em.mt-fl{color:var(--mute)}
/* «+»: главное действие сверху */
.qa-main{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;padding:0 20px;border:0;border-radius:32px;background:var(--c);color:#fff;text-align:left}
.qa-main b{display:block;font:700 17px var(--disp)}
.qa-main small{font-size:14px;opacity:.85}
.qa-other{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px}
.qa-other button{display:grid;justify-items:center;gap:6px;border:0;background:none;padding:4px 0;color:var(--ink2);font:500 13px var(--font)}
.qa-other i{width:44px;height:44px;border-radius:22px;background:radial-gradient(circle,var(--bg) 0 14%,var(--c) 15%)}
.qa-rest{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px}
.qa-rest span{font-size:14px;color:var(--mute);margin-right:4px}
.qa-rest button{min-height:40px;padding:0 16px;border:0;border-radius:20px;background:var(--fill);color:var(--ink);font:600 15px var(--font)}
.qa-rows{display:grid;margin-top:8px}
.qa-rows button{display:flex;align-items:center;gap:14px;min-height:54px;padding:0 4px;border:0;border-top:1px solid var(--sep);background:none;color:var(--ink);font:500 16px var(--font);text-align:left}
.qa-rows button span{flex:1}
.qa-rows small{font-size:14px;color:var(--mute)}
.qa-rows svg{color:var(--ink2)}
:is(.wr,.xrow,.cd,.hx,.qa-main,.qa-other button,.qa-rest button,.qa-rows button,.th-go,.plist3 button):active{transform:scale(.97)}
:is(.wr,.xrow,.cd,.hx,.qa-main,.qa-other button,.qa-rest button,.qa-rows button,.th-go,.plist3 button){transition:transform .15s var(--ease)}
/* таймер: свёрнутая таблетка и пульс по окончании отдыха */
.timer{gap:6px;padding:8px 10px;touch-action:pan-x}
.timer .l{font-size:14px}
.timer button{min-width:36px;height:36px;border-radius:18px}
.timer-mini{justify-self:end;display:inline-flex;align-items:center;gap:6px;height:36px;margin:0 8px;padding:0 14px;border:0;border-radius:18px;background:var(--accf);color:#fff;font:700 16px var(--font);font-variant-numeric:tabular-nums;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.timer-mini.done{background:#1F7F49}
@keyframes restpulse{0%{box-shadow:0 0 0 0 rgba(47,165,98,.7)}70%{box-shadow:0 0 0 14px rgba(47,165,98,0)}100%{box-shadow:0 0 0 0 rgba(47,165,98,0)}}
.timer.done,.timer-mini.done{animation:restpulse 1.2s ease-out infinite}
@media (prefers-reduced-motion:reduce){.timer.done,.timer-mini.done{animation:none}}
/* шапка: тренер и настройки — белые круглые кнопки с тёмной иконкой */
.ab-coach,.ab-i{background:var(--sel);color:var(--sel-ink)}
/* «Неделя»: недобор — надписью в плитке вместо рамки */
.mtile em{position:relative;align-self:flex-start;margin-top:4px;padding:1px 7px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font:600 11px/18px var(--font);font-style:normal;white-space:nowrap}
.mtile span{line-height:1.2}
.mnote{margin:10px 2px 0;font-size:13px;line-height:1.4;color:var(--mute)}
/* тип подхода: мио / дропсет — значок у номера и выбор в панели подхода */
.st-t{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:4px;padding:0 4px;border-radius:9px;background:var(--p-yellow);color:#18181A;font:700 11px/1 var(--font);font-style:normal;vertical-align:1px}
.sttype{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sttype button{min-height:36px;padding:0 14px;border:0;border-radius:18px;background:var(--fill);color:var(--ink);font:600 14px var(--font);transition:background-color .2s,color .2s}
.sttype button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.sttype small{flex-basis:100%;font-size:12px;color:var(--mute)}
.qpick .sttype{margin-top:4px;padding-top:10px;border-top:1px solid var(--sep)}
.xcard .sttype{margin-top:-4px}

/* ===== v10 «Фитнес» (см. DESIGN.md): язык Apple Fitness — чистый чёрный, кольца вместо грифа, SF, лаймовый акцент ===== */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif; --round:var(--num);
  --bg:#000; --panel:#000; --card:#1C1C1E; --fill:#2C2C2E; --fill2:#2C2C2E; --inner:#2C2C2E; --track:#3A3A3C; --pillbg:#1C1C1E;
  --chip:#2C2C2E; --chip-ink:#F5F5F7; --chip2:#2C2C2E; --sep:#2C2C2E; --tab:rgba(0,0,0,.72);
  --ink:#F5F5F7; --ink2:#D1D1D6; --mute:#98989F; --mute2:#98989F; --lbl:#98989F; --arrow:#636366; --grid:#2C2C2E;
  /* дни программы: у каждого свой цвет кольца на всех экранах (различаются и по светлоте) */
  --d-ua:#FA114F; --d-la:#FF9F0A; --d-ub:#00F0FF; --d-lb:#BF8CFF;
  /* единственный цвет действия: кнопки, «+», текущая вкладка, кольца объёма мышц; текст на нём чёрный */
  --acc:#A6FF00; --accf:#A6FF00; --acc-ink:#000; --fab:#A6FF00; --acc-soft:#26330A; --acc-track:rgba(166,255,0,.24);
  --sel:#3A3A3C; --sel-ink:#F5F5F7;
  --ok:#A6FF00; --ok-soft:#26330A; --warn:#FFD60A; --warn-soft:#3A3205; --red:#FF453A; --pink:#FA114F; --blue:#64D2FF; --teal:#00F0FF;
  --p-red:#FA114F; --p-blue:#64D2FF; --p-yellow:#FFD60A; --p-green:#A6FF00; --p-white:#F5F5F7;
  --lv-hi:#3A0F1A; --lv-mid:#0F2F33; --lv-lo:#2C2C2E;
  --grn:var(--acc); --grn-track:var(--acc-track); --tile:var(--fill); --roundb:var(--track); --sheet:#1C1C1E;
  --c-pink:#FA114F; --c-yellow:#FFD60A; --c-green:#A6FF00;
}
html,body{background:#000}
body{font-family:var(--font);-webkit-font-smoothing:antialiased;letter-spacing:0}
h1,h2,.appbar h1,.ab-t b,.sumhead h2,.sec2,.sheet-head b,.splash,.cal-h h2,.hd-h b,.qa-main b{font-family:var(--disp);letter-spacing:-.02em}
.big,.gc-v,.kring b,.kcol b,.tiles4 b,.durtile b,.th-h b,.th-cnt b,.mtile b,.tile-v,.tile input,.timer-mini,.timer .t{font-family:var(--num);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
:focus-visible{outline-color:var(--acc)}

/* заголовки экранов: крупный слева, как в приложениях Apple */
.appbar.left h1{font-size:34px;line-height:40px;font-weight:700}
.appbar .ab-t h1{font-size:22px;font-weight:700}
.hero-nav .ab-t b{font-size:17px;font-weight:600}
.ab-t small{font-size:13px;color:var(--mute)}
.ab-coach,.ab-i{background:var(--card);color:var(--ink)}
.ab-link{height:44px;padding:0 16px;border-radius:22px;background:var(--card);color:var(--acc);font:600 15px var(--font)}

/* Прогресс: заголовок, карточка «Сегодня» */
.pg-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.pg-h small{font-size:13px;color:var(--mute)}
.pg-h h1{margin:0;font:700 34px/40px var(--disp);letter-spacing:-.02em}
.pg-act{display:flex;gap:8px}
html:has(.thero){background:#000}
.thero{display:grid;gap:12px;margin:14px 0 0;padding:18px;border-radius:22px;background:var(--card)}
.th-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.th-cap{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.th-cap i{width:8px;height:8px;border-radius:4px;background:var(--c)}
.th-day{display:block;margin-top:2px;padding:0;border:0;background:none;color:var(--ink);font:700 24px/28px var(--disp);letter-spacing:-.02em;text-align:left}
.th-cnt{display:grid;justify-items:end;padding:0}
.th-cnt b{font-size:48px;line-height:44px;font-weight:700}
.th-cnt b em{font-style:normal;font-size:24px;color:var(--mute)}
.th-cnt small{font-size:13px;color:var(--mute)}
.th-go{min-height:50px;border:0;border-radius:25px;background:var(--acc);color:var(--acc-ink);font:600 17px var(--font)}

/* упражнения кольцами (вместо грифа): одно кольцо — упражнение, сегмент — подход */
.bbwrap{display:grid;gap:10px;margin-top:4px}
.xrings{display:flex;justify-content:space-between;gap:2px;overflow-x:auto;scrollbar-width:none}
.xrings::-webkit-scrollbar{display:none}
.xr{flex:none;display:grid;justify-items:center;gap:4px;min-width:40px;padding:0;border:0;background:none;color:var(--mute);font:500 12px/16px var(--font);font-variant-numeric:tabular-nums}
.xr.cur{color:var(--ink);font-weight:700}
.xr.cur .setring{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 45%,transparent))}
.xr:active .setring{transform:scale(.92)}
.setring{display:block;transition:transform .15s var(--ease)}
.bb-now{font-size:15px;line-height:20px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb-now span{color:var(--mute)}

/* шапка тренировки: счёт крупно, кольца упражнений */
.sumcard{margin:0;padding:6px 0 0;background:none;gap:4px}
.th-h{gap:8px;align-items:baseline}
.th-h b{font-size:48px;line-height:48px;font-weight:700}
.th-h b em{font-size:22px;color:var(--mute);font-weight:700}
.th-h span,.th-sub{font-size:13px;color:var(--mute)}
.sumcard .bbwrap{margin-top:12px}
.linkbtn.th-mus{color:var(--acc)}

/* Неделя на «Прогрессе»: концентрические кольца, по одному на день, и легенда */
.wkcard{display:flex;gap:18px;align-items:flex-start;margin-top:12px;padding:18px;border-radius:22px;background:var(--card)}
.wkcard > .rings{flex:none}
.wk-b{flex:1;min-width:0;display:grid;gap:2px}
.wkcard .wk-h{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;margin:0 0 6px}
.wk-t{display:grid;gap:2px;padding:0;border:0;background:none;color:var(--ink);text-align:left}
.wk-t b{font:600 17px/22px var(--disp)}
.wk-t small{font-size:13px;color:var(--mute)}
.wkcard .dn-a{width:32px;height:32px;margin:-4px -6px 0 0;color:var(--mute)}
.wl{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:30px;padding:0;border:0;background:none;color:var(--ink);font:400 15px var(--font);text-align:left}
.wl i{width:10px;height:10px;border-radius:5px}
.wl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl b{font:700 17px var(--num);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wl b.z{color:var(--mute)}
.home .today-back{margin-top:8px}
.tr-h{margin-top:28px}
.tr-l{stroke:var(--d-ua);stroke-width:3}.tr-d{fill:var(--d-ua)}
.tr-up{color:var(--acc)}
.plist3,.gcard{border-radius:22px;background:var(--card)}

/* карточки: #1C1C1E, r22, без рамок и теней */
.exb,.xcard,.ccard,.gcard,.banner,.dtile,.rowc,.mitem,.setlist,.nextcard,.tiles4 div,.durtile,.notetile,.bodytiles button,.bars,.tbl,.sum,.card,.grp,.lv,.form,.hist-chart,.hday,.hxlist,.plist3{border-radius:22px;background:var(--card);box-shadow:none;border:0}
.exb-title,.x-top h2{font-family:var(--disp);font-size:20px;line-height:24px;font-weight:700;letter-spacing:-.01em}
.sec2{font-size:22px;font-weight:700}
.sec2 .tbadge,.sec2 .elapsed{font-family:var(--num);background:var(--card);color:var(--ink)}

/* переключатели: тёмная дорожка, бегунок #3A3A3C */
.vswitch{padding:3px;border-radius:22px;background:var(--card);gap:0}
.vswitch button{height:38px;border-radius:19px;background:none;color:var(--mute);font:600 15px var(--font)}
.vswitch button[aria-pressed="true"],.days button[aria-pressed="true"],.seg button[aria-pressed="true"],.viewseg button[aria-pressed="true"],.seg3 button[aria-pressed="true"],.seg5 button[aria-pressed="true"],.qpick-b button.on,.hseg button[aria-pressed="true"],.sttype button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.seg5 button.q0[aria-pressed="true"],.qpick-b button.q0.on{background:var(--sel);color:var(--sel-ink)}
.days,.seg,.viewseg,.seg3,.seg5{background:var(--card);border-radius:22px}
.hseg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;padding:3px;border-radius:22px;background:var(--card)}
.hseg button{min-height:38px;border-radius:19px;background:none}

/* кнопки: главное действие — лайм с чёрным текстом */
.capsule,.btn.primary,.cta,.finish .review .row-actions .btn,.corr-foot .btn.primary{background:var(--acc);color:var(--acc-ink);font-weight:600}
.capsule{min-height:50px;border-radius:25px;font-size:17px}
.btn{border-radius:22px}
.linkbtn,.toast button,.sl-act button,.xacts button,.help-b{color:var(--acc)}

/* нагрузка на мышцы: точка — 7–10 розовая, 4–6 голубая, 1–3 серая */
.lvline span,.tags span{background:var(--fill);color:var(--ink2)}
.lvline span::before,.tags span::before{background:#8E8E93}
.lvline span.hi::before,.tags span.hi::before{background:var(--d-ua)}
.lvline span.mid::before,.tags span.mid::before{background:var(--d-ub)}

/* подходы в журнале: ячейки #2C2C2E, цифры округлым SF */
.row input[type=text],.q{border-radius:12px;background:var(--fill);font-family:var(--num);font-weight:700}
.row.done input[type=text]{background:var(--fill)}
.row.done .n{color:var(--c,var(--acc))}
.row input[type=text]:focus{border-color:var(--acc);background:var(--fill)}
.q.q0{background:var(--fill);color:var(--ink)}.q.q1,.q.q2{background:var(--fill)}
.st-t{background:var(--warn);color:#000}

/* Журнал: сделанные — строкой с кружком-галочкой, следующие — номером */
.xrow{border-radius:0;background:var(--card);min-height:48px}
.xrow.done i{background:var(--c,var(--acc));color:#000}
.xrow.next{background:var(--card);box-shadow:none;color:var(--ink)}
.xrow.next i{box-shadow:none;color:var(--mute);font-family:var(--num)}
.xrow small{font-family:var(--num);font-weight:600;color:var(--mute)}
.exlist{gap:0;border-radius:22px;overflow:hidden}
.exlist > .xrow + .xrow{box-shadow:inset 0 1px 0 var(--sep)}
.exlist > .exb{margin:8px 0}
.exlist > .exb:first-child{margin-top:0}

/* Фокус: огромные цифры, круглые −/+ */
.tile{background:var(--card)}
.tile-v{background:none;border-radius:12px}
.tile-v .big,.tile-in{font-size:64px;line-height:64px;font-weight:700}
.tile .round{border-radius:50%;background:var(--fill);color:var(--ink)}

/* Итог и плитки */
.tiles4 b,.durtile b{font-weight:700}
.kr-fg,.ring2-fg{stroke:var(--acc)}
.db-t i,.track .factb,.segs button i{background:var(--acc)}
.gc-cells small{color:var(--mute)}
.badge{background:var(--acc-soft);color:var(--acc)}
.tile-in{border-color:var(--acc)}
.hint.up{background:var(--ok-soft)}

/* Неделя: плитка мышцы — кольцо объёма с числом внутри */
.mtiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mtile{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;min-height:76px;padding:14px;border-radius:20px;background:var(--card);font-size:15px}
.mt-r{position:relative;flex:none;display:grid;place-items:center;width:48px;height:48px}
.mt-r .rings{position:absolute;inset:0}
.mt-r b{position:relative;font-size:17px;font-weight:700}
.mt-t{display:grid;gap:2px;min-width:0}
.mt-t > span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-t small{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:var(--mute)}
.mt-t small.ok{color:var(--acc)}
.mtile em{align-self:start;margin:0;background:var(--warn-soft);color:var(--warn)}
.mtile.ok b::after{content:none}
.weekscr .banner{background:var(--card)}

/* История: календарь — дни тренировок мини-кольцами цвета дня */
.cd{position:relative;display:grid;place-items:center;font-family:var(--num);font-weight:600}
.cd .rings{position:absolute;left:2px;top:2px;width:40px;height:40px}
.cd > span{position:relative}
.cd.now{box-shadow:none;color:var(--acc);font-weight:800}
.cd.sel{box-shadow:none;background:var(--fill)}
.cd.sel.now{color:var(--acc)}
.cal-h h2{font-size:28px}
.plate{width:10px;height:10px;border-radius:5px;background:var(--c);box-shadow:none}
.dt-img{display:none}

/* «+»: лаймовая кнопка дня, дни — чипами с точкой */
.qa-main{min-height:64px;border-radius:32px;background:var(--acc);color:#000}
.qa-main small{opacity:1;color:#1C1C1E}
.qa-other{display:flex;flex-wrap:wrap;gap:8px}
.qa-other button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;background:var(--fill);color:var(--ink);font:600 15px var(--font)}
.qa-other i{width:10px;height:10px;border-radius:5px;background:var(--c)}
.qa-rest button{min-height:52px;padding:0 18px;border-radius:16px;background:var(--fill);font:700 20px var(--num);letter-spacing:-.02em}

/* нижняя панель: во всю ширину, полупрозрачная чёрная с размытием, только иконки; текущая — лайм, «+» — лаймовый круг */
.tabbar{left:0;right:0;bottom:0;max-width:none;margin:0;padding:4px 8px max(30px,env(safe-area-inset-bottom,0px));border-radius:0;background:var(--tab);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:none}
.tabbar button{height:48px;border-radius:24px;background:none;color:var(--mute)}
.tabbar button[aria-selected="true"]{background:none;color:var(--acc)}
.tb-fab > span{width:44px;height:44px;border-radius:22px;background:var(--acc);color:#000;box-shadow:none}
.sheet-wrap.over-tabs{bottom:calc(52px + max(30px,env(safe-area-inset-bottom,0px)))}
.sheet-wrap.over-tabs .sheet{border-radius:28px}
body,:root[data-view="train"] body{padding-bottom:calc(100px + max(30px,env(safe-area-inset-bottom,0px)))}

/* шторки, таймер, тосты */
.sheet{background:#1C1C1E}
.sheet-wrap{background:rgba(0,0,0,.6)}
.sheet .grp,.sheet .card,.sheet .form,.sheet .rowc{background:var(--fill)}
.msg.user{background:var(--acc);color:#000}
.timer{background:var(--card);color:var(--ink);border-radius:22px}
.timer .t{color:var(--acc)}
.timer button{background:var(--fill);color:var(--ink)}
.timer.done{background:var(--acc);color:#000}
.timer.done .t,.timer.done button{color:#000}
.timer-mini{background:var(--card);color:var(--acc);font-size:20px}
.timer-mini.done{background:var(--acc);color:#000}
@keyframes restpulse{0%{box-shadow:0 0 0 0 rgba(166,255,0,.6)}70%{box-shadow:0 0 0 14px rgba(166,255,0,0)}100%{box-shadow:0 0 0 0 rgba(166,255,0,0)}}
.toast{background:var(--fill);border-radius:22px}
.splash{background:#000;color:var(--ink);font:700 28px var(--disp)}

/* отклик на нажатие */
:is(.wl,.wk-t,.xr,.th-day,.qa-other button):active{transform:scale(.97)}
:is(.wl,.wk-t,.th-day,.qa-other button){transition:transform .15s var(--ease)}
:is(.days,.seg,.seg5,.vswitch,.qpick-b,.hseg) :is(button[aria-pressed="true"],button.on):focus-visible{outline-color:var(--acc)}
.btn.primary,.btn.wide.primary{background:var(--acc);color:var(--acc-ink)}
.mtile{align-items:center;padding:12px}
.mt-t > span{white-space:normal;overflow:visible;line-height:1.2;font-size:15px}
.mt-r b{font-size:15px;letter-spacing:-.04em}
.wk-t small{white-space:nowrap}

/* правки: плитки «Изменение/Талия» на всю ширину карточки, дата в замерах по центру поля, шторка упражнения приподнята над нижней кромкой */
.gcard{justify-items:stretch}
.gc-cells{width:100%;justify-self:stretch}
.form input[type=date]{display:flex;align-items:center;line-height:44px;padding-block:0}
.form input[type=date]::-webkit-date-and-time-value{margin:0;min-height:0;line-height:44px;text-align:left}
.sheet-wrap.lift{padding-bottom:max(34px,calc(16px + env(safe-area-inset-bottom,0px)))}
.sheet-wrap.lift .sheet{border-radius:28px}

/* «Неделя»: число целиком в кольце, закрытая цель — заливкой без подписи */
.mt-r,.mt-r .rings{width:56px;height:56px}
.mt-r b{font-size:17px}
.mt-r b.n4{font-size:15px}
.mt-r b.n5{font-size:13px;letter-spacing:-.05em}
.mtile.ok{background:var(--acc-soft)}
.mtile.ok .mt-t > span{color:var(--ink)}

/* шторка: тело всегда листается (без «подвала» строка авто съедала всю высоту) */
.sheet{display:flex;flex-direction:column}
.sheet-head,.sheet-foot{flex:none}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;align-content:start}

/* нижняя панель: Liquid Glass. Приём из PedroPerillo/liquid-glass-ui (MIT): стекло .lg с бликом по краю и скользящий индикатор на пружине */
:root{--lg-tint:rgba(30,36,50,.34);--lg-tint-strong:rgba(255,255,255,.16);--lg-edge:rgba(255,255,255,.28);--lg-shadow:rgba(0,0,0,.5);--lg-spring:cubic-bezier(.3,1.4,.5,1);--lg-ease:cubic-bezier(.2,.8,.2,1)}
.tabbar{left:50%;right:auto;transform:translateX(-50%);width:min(calc(100% - 72px),320px);max-width:none;margin:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;gap:0;height:64px;padding:0 5px;border-radius:32px;border:0;
  isolation:isolate;background:var(--lg-tint);-webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%);
  box-shadow:0 10px 30px var(--lg-shadow),0 1px 2px var(--lg-shadow)}
.tabbar::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  box-shadow:inset 1.5px 1.5px 0 -.5px var(--lg-edge),inset -1px -1px 0 -.5px var(--lg-edge),inset 0 0 12px rgba(255,255,255,.12)}
.lg-ind{position:absolute;left:0;top:6px;height:52px;width:0;border-radius:26px;background:var(--lg-tint-strong);box-shadow:inset 0 0 0 .5px var(--lg-edge);z-index:0;pointer-events:none;opacity:0;
  transition:transform .45s var(--lg-spring),width .3s var(--lg-ease),opacity .2s}
.tabbar button{position:relative;z-index:1;height:52px;border-radius:26px;background:none;box-shadow:none;color:rgba(255,255,255,.78);transition:color .2s,transform .15s var(--ease)}
.tabbar button[aria-selected="true"]{background:none;box-shadow:none;color:var(--acc)}
.tb-fab > span{width:44px;height:44px;border-radius:22px;background:var(--acc);color:#000;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 14px color-mix(in srgb,var(--acc) 40%,transparent)}
.sheet-wrap.over-tabs{bottom:calc(64px + 26px + 10px + env(safe-area-inset-bottom,0px))}
body,:root[data-view="train"] body{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-transparency:reduce){.tabbar{background:#2A2A2D;-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){.lg-ind{transition:none}}
/* «Неделя»: плитки на узком экране — названия не обрезаются */
.mtile{gap:8px;padding:12px 10px}
.mt-r,.mt-r .rings{width:52px;height:52px}
.mt-t > span{font-size:14px;overflow-wrap:anywhere;hyphens:auto}

/* ===== единая шапка страниц (за основу «Прогресс»): мелкая дата сверху, крупный заголовок слева, кнопки справа ===== */
.pg-h{align-items:flex-end;min-height:62px;padding-top:6px}
.hero:has(> .pg-h){padding-top:0}
.pg-h > div{min-width:0}
.pg-h small{display:block;font-size:13px;line-height:16px;color:var(--mute)}
.pg-h h1{margin:0;font:700 34px/40px var(--disp);letter-spacing:-.02em;white-space:nowrap}
.pg-h h1 .pg-t{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-align:left}
.pg-h h1 .pg-t svg{flex:none;color:var(--mute);margin-top:4px}
.pg-act{flex:none;align-items:center}
.pg-act .pillsel{height:44px;border-radius:22px}
.wk-sum{margin:10px 0 0}
.histv > .hero{padding-bottom:0}
.hseg{margin-top:14px}

/* «Журнал / Фокус» делятся пополам */
.vswitch,.ttl + .vswitch,.navrow + .vswitch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:16px 0 0}
.vswitch button{flex:1 1 0;width:100%}

/* «?» в строке легенды справа от «сделано» */
.legend .help-b{margin-left:auto;flex:none}
.help-t{margin-top:8px}
.mt-r,.mt-r .rings{width:50px;height:50px}
.mtile{gap:7px}
.mt-t > span{font-size:13.5px;overflow-wrap:normal;hyphens:none}

/* «Сегодня»: название дня первым, слева сверху, крупно — как счёт подходов */
.th-row{align-items:flex-start}
.th-day{margin:0;font:700 48px/44px var(--disp);letter-spacing:-.02em}
.th-cnt{padding:0;margin-top:4px}
.th-cnt b{font-size:48px;line-height:44px}
/* «Сегодня»: название дня и счёт подходов в одну строку, без пустоты под ними */
.th-row{align-items:baseline;gap:10px}
.th-cnt{display:flex;align-items:baseline;gap:6px;margin:0;padding:0;white-space:nowrap}
.th-cnt b{font-size:48px;line-height:44px}
.th-cnt b em{font-size:24px}
.th-cnt small{font-size:13px;line-height:1}
.thero{gap:10px}

/* карточка дня (Прогресс и Тренировка): оттенок и акценты — цвет текущей тренировки */
.thero{background:color-mix(in srgb,var(--c) 13%,var(--card))}
.thero .th-day{display:inline-flex;align-items:center;gap:6px;color:var(--c)}
.thero .th-day svg{flex:none;color:var(--mute);margin-top:6px}
.thero .th-cnt b{color:var(--c)}
.thero .th-cnt b em{color:color-mix(in srgb,var(--c) 55%,var(--mute))}
.row.cur input[type=text]{border-color:color-mix(in srgb,var(--c,var(--acc)) 70%,transparent)}
.thero .linkbtn.th-mus{justify-self:start}

/* поле «Спросить тренера» — на своём фоне */
.sheet-foot{padding:8px 12px 12px}
.sheet-foot textarea{background:#2C2C2E;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:12px 16px;color:var(--ink)}
.sheet-foot textarea:focus{outline:0;border-color:var(--acc);background:#303033}
.thero .th-day{white-space:nowrap}
.thero.tr .th-cnt small{display:none}
.sheet-foot textarea{resize:none}

/* карточка дня: фон снова обычный, цвет дня только в надписях (включая «подходов») */
.thero,.thero.tr{background:var(--card)}
.thero .th-cnt small{color:color-mix(in srgb,var(--c) 75%,var(--mute))}

/* шторки смахиваются вниз за шапку */
.sheet-head{touch-action:none;cursor:grab}
.sheet-head .ibtn{touch-action:manipulation}

/* быстрое добавление — плавающая стеклянная панель (Liquid Glass), по ширине как нижняя полоска */
.sheet-wrap.over-tabs{background:rgba(0,0,0,.28);bottom:calc(64px + 26px + 12px + env(safe-area-inset-bottom,0px));align-items:flex-end}
.sheet-wrap.over-tabs .sheet{width:min(calc(100% - 72px),320px);max-width:none;padding:14px 14px 14px;border-radius:32px;position:relative;isolation:isolate;touch-action:none;cursor:grab;
  background:var(--lg-tint);-webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%);
  box-shadow:0 10px 30px var(--lg-shadow),0 1px 2px var(--lg-shadow)}
.sheet-wrap.over-tabs .sheet::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  box-shadow:inset 1.5px 1.5px 0 -.5px var(--lg-edge),inset -1px -1px 0 -.5px var(--lg-edge),inset 0 0 12px rgba(255,255,255,.12)}
.sheet-wrap.over-tabs .sheet-head{display:none}
.sheet-wrap.over-tabs .sheet-body{padding:0;gap:0}
.sheet-wrap.over-tabs .sheet::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:rgba(255,255,255,.35);z-index:3}
.sheet-wrap.over-tabs .sheet-body{padding-top:10px}
.over-tabs .qa-main{min-height:60px;padding:0 18px}
.over-tabs .qa-other{margin-top:12px}
.over-tabs .qa-other button,.over-tabs .qa-rest button{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14)}
.over-tabs .qa-rest{gap:6px}
.over-tabs .qa-rest button{min-height:44px;padding:0 14px;font-size:17px;border-radius:22px}
.over-tabs .qa-rows button{border-top-color:rgba(255,255,255,.14)}
.over-tabs .qa-rows small{white-space:nowrap}

/* кнопки в шапках (настройки, тренер, назад, «Завершить», период, стрелки недели) — Liquid Glass */
:is(.ab-i,.ab-coach,.ab-link,.pillsel,.dn-a){position:relative;isolation:isolate;background:var(--lg-tint);-webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%);
  border:0;box-shadow:0 4px 14px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.3);transition:transform .15s var(--ease),background-color .2s}
:is(.ab-i,.ab-coach,.ab-link,.pillsel,.dn-a)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 1.5px 1.5px 0 -.5px var(--lg-edge),inset -1px -1px 0 -.5px var(--lg-edge),inset 0 0 8px rgba(255,255,255,.10)}
:is(.ab-i,.ab-coach,.ab-link,.pillsel,.dn-a):active{transform:scale(.94);background:var(--lg-tint-strong)}
.dn-a{border-radius:50%}
.dn-a:disabled{opacity:.4;box-shadow:none}
.ab-link{color:var(--acc)}

/* «?» слева в шапке шторки — симметрично кнопке закрытия */
.sh-lead{position:absolute;left:6px;top:24px;width:44px;height:44px;display:grid;place-items:center}
.sheet-head .help-b{width:36px;height:36px;border-radius:18px}

/* быстрое добавление чуть шире полоски вкладок */
.sheet-wrap.over-tabs .sheet{width:min(calc(100% - 40px),350px)}

/* переключатели — Liquid Glass со скользящей подсветкой выбранного пункта (без JS, на :has) */
:is(.vswitch,.hseg,.seg,.days,.seg5){--n:2;--i:0;position:relative;isolation:isolate;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0;padding:3px;border-radius:999px;border:0;
  background:var(--lg-tint);-webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%);
  box-shadow:0 4px 14px rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.3)}
.days{--n:4}.days.two{--n:2}.seg5{--n:5}
:is(.vswitch,.hseg,.seg,.days,.seg5)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  box-shadow:inset 1.5px 1.5px 0 -.5px var(--lg-edge),inset -1px -1px 0 -.5px var(--lg-edge),inset 0 0 10px rgba(255,255,255,.08)}
:is(.vswitch,.hseg,.seg,.days,.seg5)::before{content:"";position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:999px;
  background:var(--lg-tint-strong);box-shadow:inset 0 0 0 .5px var(--lg-edge);transform:translateX(calc(var(--i)*100%));transition:transform .45s var(--lg-spring)}
:is(.vswitch,.hseg,.seg,.days,.seg5):not(:has([aria-pressed="true"]))::before{opacity:0}
:is(.vswitch,.hseg,.seg,.days,.seg5):has(> :nth-child(2)[aria-pressed="true"]){--i:1}
:is(.vswitch,.hseg,.seg,.days,.seg5):has(> :nth-child(3)[aria-pressed="true"]){--i:2}
:is(.vswitch,.hseg,.seg,.days,.seg5):has(> :nth-child(4)[aria-pressed="true"]){--i:3}
:is(.vswitch,.hseg,.seg,.days,.seg5):has(> :nth-child(5)[aria-pressed="true"]){--i:4}
:is(.vswitch,.hseg,.seg,.days,.seg5) > button{position:relative;z-index:1;background:none!important;box-shadow:none!important;border-radius:999px;color:var(--mute);transition:color .2s}
:is(.vswitch,.hseg,.seg,.days,.seg5) > button[aria-pressed="true"]{color:var(--ink);font-weight:600}
:is(.vswitch,.hseg,.seg,.days,.seg5) > button[aria-pressed="true"] svg{color:var(--acc)}
.days{margin:0 12px 12px}
@media (prefers-reduced-motion:reduce){:is(.vswitch,.hseg,.seg,.days,.seg5)::before{transition:none}}

/* ===== v: возвращаем белый, единый заголовок, «Мышцы за тренировку», шторки ===== */
/* карточка дня: название и счёт белые, цвет дня остаётся в кольцах */
.thero .th-day,.thero .th-cnt b{color:var(--ink)}
.thero .th-cnt b em,.thero .th-cnt small{color:var(--mute)}
.thero .th-day svg{color:var(--mute)}

/* заголовок страницы: меньше и ровно по центру ряда с кнопками, чтобы не спорить с крупной цифрой карточки */
.pg-h{align-items:center;min-height:62px;padding-top:18px}
.hero:has(> .pg-h){padding-top:0}
.pg-h h1{font:700 28px/34px var(--disp);letter-spacing:-.02em}
.pg-h small{margin-bottom:0}

/* «Мышцы за тренировку» — стеклянная строка-кнопка */
.thero .th-mus{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 14px;border:0;border-radius:22px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12);color:var(--ink);font:500 15px var(--font);text-align:left}
.thero .th-mus span{flex:1}
.thero .th-mus svg:first-child{color:var(--acc)}
.thero .th-mus svg:last-child{color:var(--mute)}

/* шторки: ровная шапка и стеклянная поверхность в общем стиле */
.sheet-wrap:not(.over-tabs){background:rgba(0,0,0,.4)}
.sheet-wrap:not(.over-tabs) .sheet{position:relative;isolation:isolate;padding-inline:0;border-radius:32px 32px 0 0;
  background:rgba(34,34,37,.72);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet-wrap:not(.over-tabs) .sheet::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;
  box-shadow:inset 1.5px 1.5px 0 -.5px var(--lg-edge),inset -1px -1px 0 -.5px var(--lg-edge)}
.sheet-head{position:relative;display:flex;align-items:center;min-height:64px;padding:16px 10px 0 10px}
.sheet-head::before{top:8px}
.sheet-head b{flex:1;padding:0 0 0 44px;text-align:center;font-size:19px;line-height:24px}
.sheet-head .ibtn{margin:0}
.sh-lead{left:10px;top:16px;bottom:0;width:44px;height:auto}
.sheet-body{padding:8px 20px 24px}

/* ===== шапка: слоты слева/по центру/справа; вариант A (по умолчанию) — заголовок слева, кнопки справа ===== */
.pg-h{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"c l r";align-items:center;gap:8px;min-height:62px;padding-top:18px}
.pg-l{grid-area:l;display:flex;gap:8px}.pg-c{grid-area:c;min-width:0}.pg-act{grid-area:r;display:flex;gap:8px}
.pg-l:empty,.pg-act:empty{display:none}
.ab-link{display:inline-flex;align-items:center;gap:6px}
.ab-link svg{display:none}
/* варианты B и C: заголовок по центру, кнопки без подписей — иконкой слева и справа */
:root:is([data-hdr="b"],[data-hdr="c"]) .pg-h{grid-template-columns:minmax(44px,1fr) auto minmax(44px,1fr);grid-template-areas:"l c r"}
:root:is([data-hdr="b"],[data-hdr="c"]) .pg-l:empty,:root:is([data-hdr="b"],[data-hdr="c"]) .pg-act:empty{display:block}
:root:is([data-hdr="b"],[data-hdr="c"]) .pg-l{justify-self:start}
:root:is([data-hdr="b"],[data-hdr="c"]) .pg-act{justify-self:end}
:root:is([data-hdr="b"],[data-hdr="c"]) .pg-c{text-align:center}
:root:is([data-hdr="b"],[data-hdr="c"]) .ab-link{width:44px;padding:0;justify-content:center;color:var(--acc)}
:root:is([data-hdr="b"],[data-hdr="c"]) .ab-link svg{display:block}
:root:is([data-hdr="b"],[data-hdr="c"]) .ab-link span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:root:is([data-hdr="b"],[data-hdr="c"]) .pillsel{width:44px;padding:0;justify-content:center}
:root:is([data-hdr="b"],[data-hdr="c"]) .pillsel > span,:root:is([data-hdr="b"],[data-hdr="c"]) .pillsel > svg:not(:first-child){display:none}
:root[data-hdr="b"] .pg-h h1{font-size:24px;line-height:30px}
:root[data-hdr="c"] .pg-h h1{font:600 17px/22px var(--font);letter-spacing:-.01em}
:root[data-hdr="c"] .pg-h small{font-size:12px}

/* «Мышцы за тренировку» — такая же плавающая стеклянная панель, как быстрое добавление, но с шапкой и прокруткой */
.sheet-wrap.over-tabs.with-head .sheet{width:min(calc(100% - 40px),350px);max-height:calc(100% - 70px);padding:0;touch-action:auto;cursor:auto}
.sheet-wrap.over-tabs.with-head .sheet::before{content:none}
.sheet-wrap.over-tabs.with-head .sheet-head{display:flex;min-height:58px;padding:10px 8px 0}
.sheet-wrap.over-tabs.with-head .sheet-head::before{display:block;top:6px;background:rgba(255,255,255,.35)}
.sheet-wrap.over-tabs.with-head .sheet-head .ibtn{visibility:visible}
.sheet-wrap.over-tabs.with-head .sh-lead{left:8px;top:10px}
.sheet-wrap.over-tabs.with-head .sheet-body{padding:4px 16px 16px;overflow-y:auto}
.over-tabs.with-head .bars{padding:0;background:none;box-shadow:none}
.sheet-wrap.over-tabs .sheet{transform-origin:50% 100%}

/* край прокрутки у плавающей полоски: контент уходит под неё в затемнение, а не обрезается (apple-fluid §12) */
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(110px + env(safe-area-inset-bottom,0px));z-index:11;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.85) 70%)}
@media (prefers-reduced-transparency:reduce){:is(.tabbar,.sheet,.ab-i,.ab-coach,.ab-link,.pillsel,.dn-a,.vswitch,.hseg,.seg,.days,.seg5){-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background-color:#2C2C2E!important}}

/* вторичная кнопка-капсула в стекле: «Завершить тренировку», «Вернуться к тренировке» */
.glassbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:27px;position:relative;isolation:isolate;
  background:var(--lg-tint);-webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%);color:var(--ink);font:600 17px var(--font);
  box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .1s ease-out,background-color .2s}
.glassbtn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 1.5px 1.5px 0 -.5px var(--lg-edge),inset -1px -1px 0 -.5px var(--lg-edge)}
.glassbtn svg{color:var(--acc)}
.glassbtn:active{transform:scale(.97);background:var(--lg-tint-strong)}
.exlist .finish-btn{margin-top:-4px}
.fx .finish-btn{margin-top:18px}
.done-ex{margin-top:20px}
.done-ex[open] > summary svg:last-child{transform:rotate(90deg)}
.done-ex > summary svg:last-child{transition:transform .2s var(--ease)}
.done-ex .exlist{padding:0 12px 12px;margin-top:4px}
.done-ex + .finish-btn{margin-top:14px}
.xrow.now i{background:var(--c);color:#000}

/* проход по apple-design: один акцент, цифры белые, без стекла на стекле */
.wkcard .dn-a,.cal-h .dn-a{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;color:var(--mute)}
.wkcard .dn-a::after,.cal-h .dn-a::after{content:none}
.tiles4 .acc,.tiles4 .grn,.tiles4 b{color:var(--ink)}
.done-ex > summary,.done-ex > summary span{color:var(--ink);display:flex;align-items:center;gap:8px}
.done-ex > summary svg{color:var(--mute)}
.x-top .ibtn,.exb-head .ibtn{color:var(--mute)}

/* тренировка: «Журнал / Фокус» сразу под шапкой, ниже — полоска колец без карточки */
.pg-h + .vswitch{margin-top:6px}
.trstrip{display:grid;gap:8px;margin-top:16px}
.trstrip .bbwrap{margin:0}
.tr-cnt{font-size:13px;color:var(--mute)}
.tr-cnt b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.trstrip + .sec2,.trstrip + .applied{margin-top:22px}
/* кнопки под списком — ровный шаг как между карточками */
.exlist .addex,.exlist .finish-btn{margin:0}
.exlist .addex{margin-top:16px}
.exlist .finish-btn{margin-top:10px}
.done-ex .exlist .finish-btn{display:none}
/* свёрнутые упражнения — сгруппированный список со скруглёнными краями и отступом от открытой карточки */
.exlist > .exb + .xrow{margin-top:12px}
.exlist > .xrow + .exb{margin-top:12px}
.exlist > .xrow:first-child,.exlist > .exb + .xrow{border-top-left-radius:16px;border-top-right-radius:16px}
.exlist > .xrow:has(+ .exb),.exlist > .xrow:has(+ .addex),.exlist > .xrow:has(+ .empty){border-bottom-left-radius:16px;border-bottom-right-radius:16px}

/* «Неделя»: итог тремя цифрами под плитками вместо абзаца */
.wkstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:12px;padding:14px 4px;border-radius:20px;background:var(--card)}
.wkstats > div{display:grid;justify-items:center;gap:2px;text-align:center}
.wkstats > div + div{border-left:.5px solid var(--sep)}
.wkstats b{font:700 24px/28px var(--num);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.wkstats b em{font-style:normal;font-size:15px;color:var(--mute)}
.wkstats b.warn{color:var(--warn)}
.wkstats span{font-size:12px;line-height:15px;color:var(--mute)}
.wk-low{margin:10px 4px 0;font-size:13px;color:var(--warn)}
.weekscr .mnote{margin:10px 4px 0}
.weekscr .pg-h + .mtiles{margin-top:14px}

/* «?» в шапке и стеклянная подсказка */
.ab-q{font:700 19px var(--font);color:var(--ink)}
.ab-q.on{background:var(--lg-tint-strong)}
.gtip-wrap{position:fixed;inset:0;z-index:45}
.gtip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 70px);right:16px;width:min(300px,calc(100% - 32px));padding:16px 18px;border-radius:24px;transform-origin:calc(100% - 22px) -8px;
  display:grid;gap:8px;isolation:isolate;color:var(--ink);font-size:14px;line-height:1.4;
  background:rgba(40,40,44,.6);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 12px 36px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.3)}
.gtip::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 1.5px 1.5px 0 -.5px var(--lg-edge),inset -1px -1px 0 -.5px var(--lg-edge),inset 0 0 12px rgba(255,255,255,.1)}
.gtip b{font-size:15px;font-weight:600}
.gtip p{margin:0;color:var(--ink2)}
.tip-warn{font-style:normal;padding:1px 7px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:12px}
@media (prefers-reduced-transparency:reduce){.gtip{background:#2C2C2E;-webkit-backdrop-filter:none;backdrop-filter:none}}
.wkstats > div{align-content:start}
.wkstats{margin-top:14px}

/* тренировка: такой же отступ от шапки, как на «Неделе» */
.pg-h + .vswitch{margin-top:14px}

/* «Неделя»: недобор — круглый значок в правом верхнем углу плитки */
.mtile{position:relative}
.mt-badge{position:absolute;top:8px;right:8px;display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--warn);color:#000;font:700 12px/1 var(--num);font-style:normal;font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.wk-low{display:flex;align-items:center;gap:8px;margin:12px 4px 0;font-size:13px;line-height:17px;color:var(--mute)}
.wk-low .mt-badge{position:static;flex:none;box-shadow:none}

/* «Подробно по дням»: карточка в общем стиле, таблица листается внутри, страница не расползается */
.weekscr{min-width:0;max-width:100%;overflow-x:clip}
.weekscr details.grp.more{display:block;width:100%;min-width:0;max-width:100%;margin-top:16px;overflow:hidden;border-radius:20px;background:var(--card)}
.weekscr details.grp.more > summary{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;color:var(--ink);font-size:16px;font-weight:500;border:0}
.weekscr details.grp.more > summary span{display:flex;align-items:center;gap:10px}
.weekscr details.grp.more > summary svg{color:var(--mute)}
.weekscr details.grp.more > summary svg:last-child{transition:transform .25s var(--ease)}
.weekscr details.grp.more[open] > summary svg:last-child{transform:rotate(90deg)}
.weekscr details.grp.more[open] > summary{border-bottom:.5px solid var(--sep)}
.weekscr details .bars{margin:0;padding:14px 16px 4px;background:none;border-radius:0;box-shadow:none}
.weekscr details .tbl{width:auto;max-width:none;margin:12px 12px 0;overflow-x:auto;border-radius:14px;background:var(--fill)}
.weekscr details .tbl th:first-child,.weekscr details .tbl td:first-child{background:var(--fill)}
.weekscr details .tbl tfoot td{background:color-mix(in srgb,var(--fill) 70%,#fff 4%)}
.weekscr details .help{margin:10px 16px 0}
.weekscr details .review{margin:12px 16px 16px}
.weekscr details .tbl th:first-child,.weekscr details .tbl td:first-child{white-space:normal;min-width:112px;max-width:128px;line-height:1.2}

/* значок недобора: перебиваем старое правило «.mtile i» (заливка-полоса) */
.mtile i.mt-badge{position:absolute;top:8px;right:8px;left:auto;bottom:auto;z-index:2}
.wk-low i.mt-badge{position:static}

/* «Фокус»: пустой вес — ровное тире по центру, без единицы */
.tile-v .big.tile-empty{color:var(--mute2);font-weight:500}

/* ===== Liquid Glass для полей и мелких кнопок (поверх карточек — лёгкая «стеклянная» заливка с бликом по краю) ===== */
:root{--gl-fill:rgba(255,255,255,.07);--gl-fill-on:rgba(255,255,255,.12);--gl-rim:inset 0 0 0 .5px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.1)}
/* поля ввода */
.row:not(.done) input[type=text],.noteedit,.form input,.form textarea,.adform input[type=text],.own input,.notetile textarea,.durtile input,.tile-in,.hsearch,input[type=date],.stp-in{
  background:var(--gl-fill)!important;box-shadow:var(--gl-rim);border-color:transparent}
.row:not(.done):not(.cur) input[type=text]{border-color:transparent}
.row input[type=text]:focus,.noteedit:focus,.form input:focus,.form textarea:focus,.own input:focus,.durtile input:focus,.tile-in:focus,input[type=date]:focus,.hsearch:focus-within{
  outline:0;background:var(--gl-fill-on)!important;box-shadow:inset 0 0 0 1.5px var(--acc)}
.row.done input[type=text]{box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--ok) 40%,transparent)}
.hsearch{border-radius:22px}
.hsearch input{background:none!important;box-shadow:none}
/* мелкие кнопки на карточках */
.q:not(.q0):not(.q1):not(.q2):not(.q4),.round,.exb-add .btn:not(.primary),.lvb,.qpick-b button:not(.on),.sttype button:not([aria-pressed="true"]),.st-acts button,.nav-i,.chip-s:not(.ok):not(.cur){
  background:var(--gl-fill);box-shadow:var(--gl-rim);transition:transform .1s ease-out,background-color .2s}
:is(.q,.round,.exb-add .btn,.lvb,.qpick-b button,.sttype button,.st-acts button,.nav-i,.chip-s):active{transform:scale(.94);background:var(--gl-fill-on)}
/* карточка «… отстаёт» — стеклянная */
.weekscr .banner{position:relative;isolation:isolate;background:var(--lg-tint);-webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%);border-radius:22px}
.weekscr .banner::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 1.5px 1.5px 0 -.5px var(--lg-edge),inset -1px -1px 0 -.5px var(--lg-edge)}
.mtile i.mt-badge{background:var(--warn);color:#000}
.mtile:has(.mt-badge) .mt-t{padding-right:20px}
/* значок недобора — как уведомление на иконке: в правом верхнем углу кольца */
.mtile .mt-r i.mt-badge{position:absolute;top:-6px;right:-8px;left:auto;bottom:auto;z-index:2;min-width:20px;height:20px;padding:0 5px;font-size:11px;border-radius:10px;background:var(--warn);color:#000;box-shadow:0 0 0 2px var(--card)}
.mtile:has(.mt-badge) .mt-t{padding-right:0}
.tile-v .big.tile-empty{display:inline-block;transform:translateY(-6px)}

/* «Фокус»: пустой вес — тире той же высоты, единица остаётся, кнопки ± на одной линии */
.tile-v .big.tile-empty{display:inline;transform:none;color:var(--mute2);font-weight:500}

/* тип подхода — стеклянный сегмент со скользящей подсветкой, как «Сколько ещё мог сделать» */
.sttype{display:grid;gap:6px}
.seg3g{--n:3;--i:0;position:relative;isolation:isolate;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:3px;border-radius:999px;
  background:var(--lg-tint);-webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%);box-shadow:0 4px 14px rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.3)}
.seg3g::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;box-shadow:inset 1.5px 1.5px 0 -.5px var(--lg-edge),inset -1px -1px 0 -.5px var(--lg-edge),inset 0 0 10px rgba(255,255,255,.08)}
.seg3g::before{content:"";position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:999px;background:var(--lg-tint-strong);box-shadow:inset 0 0 0 .5px var(--lg-edge);transform:translateX(calc(var(--i)*100%));transition:transform .45s var(--lg-spring)}
.seg3g:has(> :nth-child(2)[aria-pressed="true"]){--i:1}
.seg3g:has(> :nth-child(3)[aria-pressed="true"]){--i:2}
.sttype .seg3g > button{position:relative;z-index:1;min-height:34px;padding:0;border-radius:999px;background:none!important;box-shadow:none!important;color:var(--mute);font:600 14px var(--font);transition:color .2s}
.sttype .seg3g > button[aria-pressed="true"]{color:var(--ink)}
.sttype small{text-align:center}
@media (prefers-reduced-motion:reduce){.seg3g::before{transition:none}}

/* «Спросить тренера» — плавающая стеклянная панель как быстрое добавление, поле ввода высокое */
.sheet-wrap.over-tabs.ask .sheet{max-height:calc(100% - 40px)}
.ask .sheet-foot{padding:4px 14px 10px;align-items:stretch;flex-direction:column}
.ask .sheet-foot textarea{min-height:132px;border-radius:20px}
.ask .sheet-foot .btn{width:100%}
.ask .sheet-body{padding:4px 14px 16px}

/* ===== крупные блоки — «стекло»: светлая полупрозрачная заливка, блик по верхнему краю, мягкая тень.
   Размытие фона не включаем: под карточками чёрный фон, blur там ничего не даёт, а стоит дорого. В шторках не применяем — стекло на стекле (apple-fluid §12). */
:root{--card-glass:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.045));--card-rim:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 .5px rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.35)}
:is(.exb,.xcard,.setlist,.thero,.wkcard,.mtile,.wkstats,.tiles4 div,.durtile,.notetile,.card,.hday,.hx,.hxlist,.plist3,.sum,.corr-card,.weekscr details.grp.more,.home .grp,.tip,.nextcard,.hist-chart):not(.sheet *){
  background:var(--card-glass);box-shadow:var(--card-rim)}
.exlist > .xrow{background:var(--card-glass)}
.exlist > .xrow:first-child,.exlist > .exb + .xrow{box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.mtile.ok:not(.sheet *){background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 22%,transparent),color-mix(in srgb,var(--acc) 12%,transparent))}
@media (prefers-reduced-transparency:reduce){:is(.exb,.xcard,.setlist,.thero,.wkcard,.mtile,.wkstats,.tiles4 div,.card,.hday,.hx,.exlist > .xrow){background:var(--card)!important}}
.sheet-wrap.over-tabs.ask .sheet{max-height:calc(100% - 70px)}
.ask .sheet-foot{flex:none;gap:8px}
.ask .sheet-body{padding-top:12px}
/* «Фокус»: число и тире не переносятся и не сжимаются — обе плитки одной высоты */
.tile-v .big{flex:none;white-space:nowrap}
.tile-v .big.tile-empty{display:block;transform:none}
/* пустой вес: тире рисуем полоской, а не символом — символ из запасного шрифта раздувал строку и сдвигал ± */
.tile-v .big.tile-empty{display:flex;align-items:center;justify-content:center;width:44px;height:64px;line-height:64px}
.tile-v .big.tile-empty::before{content:"";width:36px;height:6px;border-radius:3px;background:var(--mute2)}

/* нижняя панель: «капля» тянется в сторону движения (передний край быстрее заднего) и чуть приподнимается в полёте */
.tabbar .lg-ind{left:0;right:auto;width:auto;transform:none;
  transition:left .5s var(--lg-spring),right .5s var(--lg-spring),transform .25s var(--lg-ease),background-color .25s,opacity .2s}
.tabbar .lg-ind.to-r{transition:right .26s cubic-bezier(.2,.8,.2,1),left .52s var(--lg-spring),transform .25s var(--lg-ease),background-color .25s,opacity .2s}
.tabbar .lg-ind.to-l{transition:left .26s cubic-bezier(.2,.8,.2,1),right .52s var(--lg-spring),transform .25s var(--lg-ease),background-color .25s,opacity .2s}
.tabbar .lg-ind.moving{transform:scaleY(1.1);background:rgba(255,255,255,.22)}
.tabbar:has(button:not(.tb-fab):active) .lg-ind{transform:scale(1.06,1.12);background:rgba(255,255,255,.24)}
@media (prefers-reduced-motion:reduce){.tabbar .lg-ind,.tabbar .lg-ind.to-r,.tabbar .lg-ind.to-l{transition:opacity .2s}}

/* ===== шапка iOS 26: заголовок 34 px слева, подпись под ним, справа стеклянные кнопки ===== */
.pg-h{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"c r";align-items:center;gap:12px;min-height:62px;padding-top:18px}
.pg-c{grid-area:c;display:flex;flex-direction:column;min-width:0;text-align:left}
.pg-h h1{margin:0;font:700 34px/41px var(--disp);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-h small{margin:0;font-size:15px;line-height:20px;color:var(--mute)}
.pg-h h1 .pg-t{gap:4px}
.pg-h h1 .pg-t svg{margin-top:6px}
.pg-act{grid-area:r;display:flex;align-items:center;gap:8px;align-self:start}
.pg-act:empty{display:none}
.ab-link svg{display:none}
/* две кнопки и больше — одна капсула, как сгруппированные кнопки панели в iOS 26 */
.pg-act:has(> :nth-child(2)){gap:0;position:relative;isolation:isolate;border-radius:22px;background:var(--lg-tint);
  -webkit-backdrop-filter:blur(12px) saturate(180%);backdrop-filter:blur(12px) saturate(180%);box-shadow:0 4px 14px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.3)}
.pg-act:has(> :nth-child(2))::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 1.5px 1.5px 0 -.5px var(--lg-edge),inset -1px -1px 0 -.5px var(--lg-edge),inset 0 0 8px rgba(255,255,255,.1)}
.pg-act:has(> :nth-child(2)) > *{width:46px;height:44px;padding:0;justify-content:center;background:none!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-radius:22px}
.pg-act:has(> :nth-child(2)) > *::after{content:none}
.pg-act:has(> :nth-child(2)) > :active{transform:scale(.9)}
.pg-act:has(> :nth-child(2)) .pillsel > span,.pg-act:has(> :nth-child(2)) .pillsel > svg:not(:first-child){display:none}
.pg-act:has(> :nth-child(2)) .pillsel svg:first-child{width:22px;height:22px}

/* плавающие панели (быстрое добавление, тренер, мышцы) — шире, по 10 px от краёв */
.sheet-wrap.over-tabs .sheet,.sheet-wrap.over-tabs.with-head .sheet{width:min(calc(100% - 20px),440px)}

/* кнопка пояснения слева — того же вида, что крестик справа */
.sheet-head .sh-help{color:var(--ink2)}
.sheet-head .sh-help[aria-expanded="true"]{color:var(--acc)}

/* «Спросить тренера»: поле внизу, как в «Сообщениях»: однострочное, растёт по мере ввода; круглая кнопка справа */
.ask .sheet-body{order:2;padding:4px 14px 8px}
.ask .sheet-foot{order:3;flex:none;flex-direction:row;padding:6px 10px 10px}
.composer{display:flex;align-items:flex-end;gap:8px;width:100%;padding:4px 4px 4px 14px;border-radius:22px;background:var(--gl-fill);box-shadow:var(--gl-rim)}
.composer:focus-within{box-shadow:inset 0 0 0 1.5px var(--acc)}
.ask .sheet-foot .composer textarea{flex:1;min-width:0;min-height:36px;height:36px;max-height:148px;padding:8px 0;margin:0;border:0;border-radius:0;background:none!important;box-shadow:none!important;font-size:16px;line-height:20px;resize:none;overflow-y:auto}
.ask .sheet-foot .composer textarea:focus{outline:0;box-shadow:none}
.send-b{flex:none;display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:18px;background:var(--acc);color:#000;transition:transform .1s ease-out,opacity .2s}
.send-b:active{transform:scale(.9)}
.send-b:disabled{opacity:.3}
.send-b.stop{background:var(--ink);color:#000}
.ask .help-t{margin:0 0 10px}

/* размеры по шкале iOS: крупный заголовок 34, карточка дня — Title 1 (28), счёт тем же размером */
.thero .th-day{font:700 28px/34px var(--disp);letter-spacing:-.02em}
.thero .th-cnt b{font-size:28px;line-height:34px}
.thero .th-cnt b em{font-size:17px}
.thero .th-day svg{margin-top:2px}

/* =====================================================================================================
   v11 — по референсу Apple Fitness (iOS 26), замеры со скриншотов 390×844 pt (см. DESIGN.md, «Референс Fitness»).
   Принцип: два уровня. Контент — плоские карточки #1C1C1E (едва заметный градиент вправо), без рамок и теней.
   Стекло — только у плавающего слоя: нижняя панель, кнопки шапки, чипсы, всплывающие панели.
   Поля 18, внутренний отступ карточки 15 ≈ радиус 16, зазор между карточками 9, между разделами 16–24.
   ===================================================================================================== */
:root{
  --g:18px; --gap:9px; --r-card:16px; --pad:15px;
  --card:#1C1C1E; --surface:linear-gradient(100deg,#1C1C1E 45%,#212123);
  --on-card:rgba(118,118,128,.24); --on-card-hi:rgba(118,118,128,.34);   /* поля и мелкие кнопки на карточке */
  --close-bg:#3A3A3C; --chev-bg:#5C5C60; --btn-in-card:#48484C;
  --mute:#98989F; --sep:#2C2C2E;
  --tb-h:58px; --tb-b:max(10px,calc(env(safe-area-inset-bottom,0px) - 14px));
  /* старые «стеклянные» карточки и поля — теперь плоские, как в референсе */
  --card-glass:var(--surface); --card-rim:none;
  --gl-fill:var(--on-card); --gl-fill-on:var(--on-card-hi); --gl-rim:none;
}

/* --- шапка: заголовок 21/26 bold (Title 2), подпись 13 серым, кнопки-круги 40 --- */
.pg-h{align-items:center;min-height:50px;padding-top:10px;gap:12px}
.pg-h h1{font:700 21px/26px var(--disp);letter-spacing:0}
.pg-h small{font-size:13px;line-height:17px;margin-top:1px}
.pg-h h1 .pg-t{gap:2px}
.pg-h h1 .pg-t svg{margin-top:3px}
.pg-act{align-self:center}
.pg-act > *{width:40px;height:40px;border-radius:20px}
.pg-act:has(> :nth-child(2)){border-radius:20px}
.pg-act:has(> :nth-child(2)) > *{width:44px;height:40px}
.pg-act .ab-link{width:auto;padding:0 14px}
.pg-h + .vswitch,.pg-h + .mtiles,.pg-h + .thero{margin-top:12px}
.hero:has(> .pg-h){padding-bottom:0}

/* компактная шапка при прокрутке: заголовок по центру, кнопки на том же месте, контент под ней размыт */
.navmini{position:fixed;left:0;right:0;top:0;z-index:13;height:calc(env(safe-area-inset-top,0px) + 60px);padding:env(safe-area-inset-top,0px) var(--g) 0;
  display:flex;align-items:center;justify-content:flex-end;visibility:hidden;opacity:0;transition:opacity .2s ease,visibility 0s linear .2s;pointer-events:none}
:root[data-scrolled] .navmini{visibility:visible;opacity:1;transition:opacity .2s ease;pointer-events:auto}
.navmini::before{content:"";position:absolute;left:0;right:0;top:0;bottom:-28px;z-index:-1;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.82),rgba(0,0,0,.55) 62%,rgba(0,0,0,0));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent);mask-image:linear-gradient(to bottom,#000 60%,transparent)}
.navmini .nm-c{position:absolute;left:96px;right:96px;top:env(safe-area-inset-top,0px);height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.navmini .nm-c b{font:600 17px/22px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.navmini .nm-c small{font-size:13px;line-height:16px;color:var(--mute)}
.navmini .nm-t{display:inline-flex;align-items:center;gap:3px;border:0;background:none;padding:0;color:var(--ink);pointer-events:auto}
.navmini .nm-t svg{color:var(--mute)}
.navmini .pg-act{display:flex}
:root[data-quick="1"] .navmini,body:has(.sheet-wrap) .navmini{z-index:11}

/* --- разделы: заголовок 21 bold, как «Free Monthly Sampler» --- */
.sec2{font:700 21px/26px var(--disp);letter-spacing:0;margin:24px 0 10px}
.wk-h .sec2,.tr-h .sec2{margin:0}

/* --- карточки: радиус 16, отступ 15, зазор 9 --- */
.exb,.xcard,.setlist,.thero,.wkcard,.mtile,.wkstats,.tiles4 div,.durtile,.notetile,.card,.hday,.hx,.hxlist,.plist3,.sum,.corr-card,.tip,.nextcard,.hist-chart,.banner,.home .grp,.bodytiles button{border-radius:var(--r-card)}
.weekscr details.grp.more,.exlist{border-radius:var(--r-card)}
.exlist > .xrow:first-child,.exlist > .exb + .xrow{border-top-left-radius:var(--r-card);border-top-right-radius:var(--r-card);box-shadow:none}
.exlist > .xrow:has(+ .exb),.exlist > .xrow:has(+ .addex),.exlist > .xrow:has(+ .empty){border-bottom-left-radius:var(--r-card);border-bottom-right-radius:var(--r-card)}
.thero,.xcard,.card,.hday{padding:var(--pad)}
.exb{padding:var(--pad) var(--pad) 12px}
.mtiles{gap:var(--gap)}
.tiles4{gap:var(--gap)}
.exlist > .exb + .xrow,.exlist > .xrow + .exb{margin-top:var(--gap)}
.thero + .wkcard,.home > section + section{margin-top:var(--gap)}

/* --- текст в карточках: заголовок 16–17 semibold, значения SF Rounded 26 semibold --- */
.exb-title,.x-top h2{font:600 18px/23px var(--font);letter-spacing:0}
.mt-t > span{font-weight:600}
.thero .th-day{font:700 26px/31px var(--disp);letter-spacing:0}
.thero .th-cnt b{font:600 26px/31px var(--num);letter-spacing:-.01em}
.thero .th-cnt b em{font-size:16px}
.tiles4 b,.wkstats b{font:600 26px/30px var(--num);letter-spacing:-.01em}
.tiles4 span,.wkstats span{font-size:13px}

/* --- кнопки: главная — лаймовая пилюля 46; второстепенная на странице — пилюля цвета карточки с лаймовым текстом; на карточке — серая с лаймовым текстом --- */
.capsule,.th-go{min-height:46px;border-radius:23px;font:600 17px var(--font)}
.glassbtn,.exlist .addex{min-height:46px;border-radius:23px;background:var(--card)!important;color:var(--acc);font:600 17px var(--font);
  -webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.glassbtn::after{content:none}
.glassbtn svg,.exlist .addex svg{color:var(--acc)}
.glassbtn:active,.exlist .addex:active{background:#2C2C2E!important}
.exlist .addex{position:relative;width:100%;margin:33px 0 0}
.exlist .addex::before{content:"";position:absolute;left:0;right:0;top:-17px;height:.5px;background:var(--sep)}
.exlist .finish-btn{margin-top:var(--gap)}
.exlist{overflow:visible}

/* --- чипсы сверху (Журнал/Фокус, Календарь/Упражнения) — как «For You / Explore» в Fitness+: тёмные пилюли 40, выбранная белая с чёрным текстом; белая подложка переезжает --- */
:is(.vswitch,.hseg){gap:8px;padding:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;border-radius:0}
:is(.vswitch,.hseg)::after{content:none}
:is(.vswitch,.hseg) > button{position:static;z-index:auto;height:40px;min-height:40px;padding:0 14px;border-radius:20px;background:#242426!important;color:var(--ink);font:500 16px var(--font);display:flex;align-items:center;justify-content:center;gap:6px}
:is(.vswitch,.hseg) > button > *{position:relative;z-index:2}
:is(.vswitch,.hseg) > button[aria-pressed="true"]{color:#000;font-weight:600}
:is(.vswitch,.hseg) > button svg,:is(.vswitch,.hseg) > button[aria-pressed="true"] svg{color:inherit}
:is(.vswitch,.hseg)::before{z-index:1;top:0;bottom:0;left:0;width:calc((100% - 8px)/2);border-radius:20px;background:#F4F4F4;box-shadow:none;
  transform:translateX(calc(var(--i)*(100% + 8px)))}

/* --- сегменты внутри карточек (запас, тип подхода, день) — как системный UISegmentedControl: плоская дорожка, светлый бегунок --- */
:is(.seg,.days,.seg5),.seg3g{background:var(--on-card);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
:is(.seg,.days,.seg5)::after,.seg3g::after{content:none}
:is(.seg,.days,.seg5)::before,.seg3g::before{background:#5A5A5E;box-shadow:0 2px 6px rgba(0,0,0,.25)}

/* --- нижняя панель как в Fitness: по ширине контента, 58 высотой, иконка + подпись 10, выбранная — светлая пилюля и лайм --- */
.tabbar{left:var(--g);right:var(--g);width:auto;max-width:none;transform:none;margin:0;bottom:var(--tb-b);height:var(--tb-h);padding:0 3px;border-radius:29px;
  background:rgba(30,30,32,.6);box-shadow:0 8px 28px rgba(0,0,0,.45)}
.tabbar button{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);border-radius:26px}
.tabbar button svg{width:24px;height:24px}
.tabbar .tb-l{font:600 10px/12px var(--font);letter-spacing:.01em;white-space:nowrap}
.tabbar button[aria-selected="true"]{color:var(--acc)}
.tabbar .lg-ind{top:3px;height:52px;border-radius:26px;background:rgba(255,255,255,.13)}
.tabbar .lg-ind.moving{background:rgba(255,255,255,.2)}
.tb-fab > span{width:44px;height:44px}
.sheet-wrap.over-tabs{bottom:calc(var(--tb-b) + var(--tb-h) + 10px)}
body,:root[data-view="train"] body{padding-bottom:calc(var(--tb-b) + var(--tb-h) + 28px)}
body::after{height:calc(var(--tb-b) + var(--tb-h) + 34px);background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.7) 75%)}

/* --- карточка-подсказка «… отстаёт» как «A Customisable Summary»: заголовок 16, текст серым, серая кнопка с лаймовым текстом, крестик в круге 24 --- */
.weekscr .banner{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;padding:var(--pad);gap:6px}
.weekscr .banner::after{content:none}
.banner .bn-h{align-items:flex-start}
.banner .bn-h b{font:600 16px/21px var(--font)}
.banner > span{font-size:15px;line-height:20px;color:var(--mute)}
.banner .bn-h .ibtn{width:24px;height:24px;flex:none;border-radius:12px;background:var(--close-bg);color:#D1D1D6;margin:0}
.banner .bn-h .ibtn svg{width:13px;height:13px}
.banner .capsule{margin-top:8px;background:var(--btn-in-card);color:var(--acc)}

/* --- раскрывающиеся строки: шеврон в сером круге 18, как у «Step Count ›» --- */
.weekscr details.grp.more > summary svg:last-child,.done-ex > summary svg:last-child{width:20px;height:20px;padding:4px;border-radius:10px;background:var(--chev-bg);color:#1C1C1E}

/* --- кольца упражнений: равные колонки сеткой, края слева и справа одинаковые --- */
.xrings{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));justify-items:center;gap:0;overflow:visible}
.xr{min-width:0}
/* кольца Activity: сплошная дуга, номер внутри, у сделанного — галочка */
.xr-in{position:relative;display:grid;place-items:center;width:36px;height:36px}
.xr-in .actring{position:absolute;inset:0;transition:transform .15s var(--ease)}
.xr-in b{position:relative;font:600 13px/1 var(--num);color:var(--mute);font-variant-numeric:tabular-nums}
.xr.cur .xr-in b{color:var(--ink)}
.xr.full .xr-in b{color:var(--c)}
.xr.cur .actring{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 50%,transparent))}
.xr:active .actring{transform:scale(.9)}
/* «Вес» — карточка как «Step Count»: значение SF Rounded 26; пусто — лаймовое действие и серая подсказка слева */
.gcard{background:var(--surface);border-radius:var(--r-card);padding:var(--pad);text-align:left}
.gcard .gc-v{font:600 26px/31px var(--num);letter-spacing:-.01em}
.gcard .gc-v.gc-empty{font:600 17px/22px var(--font);color:var(--acc);letter-spacing:0}
.gcard .gc-r,.gcard .gc-r span{justify-content:flex-start;text-align:left;font-size:15px;line-height:20px;color:var(--mute)}
.cal-h h2{font:700 21px/26px var(--disp);letter-spacing:0}
.mtile{gap:11px}

/* нижнее меню как в iOS 26 (Telegram, Health, Photos): капсула с вкладками + отдельная круглая кнопка справа — у нас «+» */
.tabbar{right:calc(var(--g) + var(--tb-h) + 10px);grid-template-columns:repeat(4,minmax(0,1fr))}
