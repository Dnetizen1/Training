<title>Дневник тренировок</title>
<style>
/* Раскладка по образцу Strong/Hevy (см. DESIGN.md): журнал без карточек, таблица подходов, шторки, нижние вкладки.
   Палитра: цвета дисков IWF, у каждого дня свой диск и он же акцент. Шрифты: Unbounded / Golos Text / JetBrains Mono. */
:root{
  --bg:#eceef0; --surface:#ffffff; --sunk:#f4f5f7; --line:#d2d6dc; --rule:#e5e8ec;
  --ink:#111418; --mute:#5a626d; --inv:#ffffff;
  --p-red:#d4252d; --p-blue:#1d55d4; --p-yellow:#e2ad0f; --p-green:#16924a;
  --day:var(--p-blue); --day-ink:#ffffff; --day-soft:#e3eafb;
  --ok:#16924a; --ok-soft:#e1f2e7; --warn:#c2410c; --warn-soft:#fbe9df;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:4px; --r-card:6px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-day="LA"]{--day:var(--p-red);--day-soft:#f9e1e2}
:root[data-day="UB"]{--day:var(--p-yellow);--day-ink:#111418;--day-soft:#fbf1d2}
:root[data-day="LB"]{--day:var(--p-green);--day-soft:#dff1e6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1b1d; --surface:#232326; --sunk:#2b2b2f; --line:#38383d; --rule:#2f2f33;
  --ink:#ececee; --mute:#a3a3aa; --inv:#1b1b1d;
  --p-red:#ff5a60; --p-blue:#5d8dff; --p-yellow:#f2c94c; --p-green:#3fca7b;
  --day-soft:#1c2740; --ok:#3fca7b; --ok-soft:#14301f; --warn:#ff8a4c; --warn-soft:#3a2416; color-scheme:dark}
  :root:not([data-theme="light"])[data-day="LA"]{--day-soft:#3a1c1e}
  :root:not([data-theme="light"])[data-day="UB"]{--day-soft:#3a3218}
  :root:not([data-theme="light"])[data-day="LB"]{--day-soft:#15301f}
  :root:not([data-theme="light"]){--day-ink:#1b1b1d}}
:root[data-theme="dark"]{
  --bg:#1b1b1d; --surface:#232326; --sunk:#2b2b2f; --line:#38383d; --rule:#2f2f33;
  --ink:#ececee; --mute:#a3a3aa; --inv:#1b1b1d;
  --p-red:#ff5a60; --p-blue:#5d8dff; --p-yellow:#f2c94c; --p-green:#3fca7b;
  --day-soft:#1c2740; --day-ink:#1b1b1d; --ok:#3fca7b; --ok-soft:#14301f; --warn:#ff8a4c; --warn-soft:#3a2416; color-scheme:dark}
:root[data-theme="dark"][data-day="LA"]{--day-soft:#3a1c1e}
:root[data-theme="dark"][data-day="UB"]{--day-soft:#3a3218}
:root[data-theme="dark"][data-day="LB"]{--day-soft:#15301f}

*{box-sizing:border-box}
html{scroll-padding-bottom:140px}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding-inline:16px;padding-block:0 calc(150px + env(safe-area-inset-bottom,0px));max-width:680px;margin-inline:auto;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--day);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.empty{color:var(--mute);padding:28px 8px;text-align:center}
.st{color:var(--mute);font-size:13.5px}
.st.bad{color:var(--warn)}

/* статус сохранения: тихо в углу */
.save{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:12px;z-index:6;font:500 11px var(--mono);color:var(--mute);display:flex;align-items:center;gap:6px;pointer-events:none}
.save::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.save.bad,.save.bad::before{color:var(--warn);background:none}
.save.bad::before{background:var(--warn)}

/* шапка экрана */
.wk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:26px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.wk-top{display:flex;align-items:center;gap:12px}
.wk-name{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
h1{font:700 22px/1.05 var(--display);letter-spacing:-.02em;margin:0;white-space:nowrap}
.elapsed{font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.days button{display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;padding:8px 2px;font-size:13.5px;font-weight:600;color:var(--mute);white-space:nowrap;transition:background .2s var(--ease),color .2s var(--ease)}
.days button + button{border-left:1px solid var(--line)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--inv)}
.plate{flex:none;display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--c) 72%,#000 28%),inset 0 0 0 5px var(--c);position:relative}
.plate::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
.wk-name .plate{width:20px;height:20px}
.wk-name .plate::after{inset:7px}
.days button[aria-pressed="true"] .plate::after{background:var(--ink)}
.wk-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 8px;font:500 13.5px var(--mono);height:32px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);height:32px}
.stepper button{border:0;background:transparent;width:30px;height:30px;font-size:17px}
.stepper span{min-width:52px;text-align:center;font:600 12.5px var(--mono)}
.goal{font:600 12px var(--mono);padding:6px 8px;border-radius:var(--r);background:var(--day-soft)}
.goal.warn{background:var(--warn-soft)}

/* полоса мышц тренировки */
.mline{display:flex;gap:4px 14px;flex-wrap:wrap;padding:10px 0;font-size:13px;border-bottom:1px solid var(--line)}
.mline b{font:600 13px var(--mono);margin-right:4px}
.mline .ind{color:var(--mute)}
.helpbox{margin-top:10px;background:var(--day-soft);border-radius:var(--r-card);padding:12px 12px 4px;font-size:14px}
.helpbox .btn{padding-left:0}

/* журнал упражнений */
.exlist{display:grid}
.exb{padding:16px 0 14px;border-bottom:1px solid var(--line);display:grid;gap:8px;min-width:0}
.exb-head{display:flex;align-items:flex-start;gap:6px}
.exb-title{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:2px 0;font:600 17.5px/1.25 var(--body);color:var(--day);letter-spacing:-.005em}
:root[data-day="UB"] .exb-title{color:color-mix(in srgb,var(--p-yellow) 55%,var(--ink) 45%)}
.exb.complete .exb-title::after{content:" ✓";color:var(--ok)}
.exb-meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--ink)}
.exb-meta .mono{font-size:12.5px;color:var(--mute)}
.exb-meta .mono b{color:var(--ink)}
.exb-note{font-size:13px;color:var(--mute)}
.linkbtn{border:0;background:none;padding:0;color:var(--day);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.hint{font-size:13px;border-radius:var(--r);padding:7px 10px;display:flex;gap:8px;align-items:center}
.hint.up{background:var(--ok-soft)}
.hint svg{flex:none;color:var(--ok)}

.log{display:grid;margin-top:2px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1.05fr) minmax(0,.9fr) 40px 42px;gap:6px;align-items:center;padding:3px 4px;margin-inline:-4px;border-radius:var(--r);transition:background .2s var(--ease)}
.row.head{font:600 10.5px var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.04em;text-align:center;padding-block:0 2px}
.row.head > :first-child{text-align:left}
.row.head .qh{border:0;background:none;padding:0;font:inherit;color:var(--day);text-decoration:underline dotted;text-underline-offset:3px;letter-spacing:inherit;text-transform:inherit}
.row.done{background:var(--ok-soft)}
.row .n{font:600 14px var(--mono);color:var(--mute);padding-left:4px}
.row.done .n{color:var(--ok)}
.row .prev{font:500 12.5px var(--mono);color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input[type=text]{width:100%;min-width:0;height:40px;background:var(--sunk);border:1px solid transparent;border-radius:var(--r);padding:0 2px;font:600 17px var(--mono);text-align:center;transition:border-color .15s var(--ease),background .15s var(--ease)}
.row.done input[type=text]{background:transparent}
.row input[type=text]:focus{background:var(--surface);border-color:var(--day);outline:0}
.row input::placeholder{color:var(--mute);opacity:.5;font-weight:500}
.q{height:40px;border:1px dashed var(--line);background:transparent;border-radius:var(--r);font:600 14px var(--mono);color:var(--mute)}
.q.q0{background:var(--p-red);border:0;color:#fff}
.q.q1{background:color-mix(in srgb,var(--p-red) 30%,var(--warn-soft));border:0;color:var(--ink)}
.q.q2{background:var(--day-soft);border:0;color:var(--ink)}
.q.q4{background:var(--sunk);border:0;color:var(--ink)}
.tick{width:42px;height:40px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--line);display:grid;place-items:center;transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.tick:hover{color:var(--mute);border-color:var(--mute)}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.qpick{display:flex;align-items:center;gap:6px;padding:6px 0 8px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.qpick button{min-width:44px;height:36px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font:600 14px var(--mono)}
.qpick button.q0{background:var(--p-red);color:#fff;border-color:var(--p-red)}
.qpick button.on{outline:2px solid var(--ink);outline-offset:1px}
.exb-add{display:flex;gap:6px}
.exb-notein{border:0;border-bottom:1px solid transparent;background:transparent;padding:4px 0;font-size:14px;color:var(--ink)}
.exb-notein:focus{border-bottom-color:var(--day);outline:0}
.exb-notein::placeholder{color:var(--mute);opacity:.8}
.addex{margin-top:14px}

/* кнопки */
.row-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 12px;min-height:38px;font-size:14px;font-weight:600;transition:background .15s var(--ease),border-color .15s var(--ease),transform .1s var(--ease)}
.btn:hover{border-color:var(--mute)}
.btn:active{transform:translateY(1px)}
.btn.wide{flex:1;width:100%}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--inv)}
.btn.primary svg{color:var(--day)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.quiet{border-color:transparent;background:transparent;color:var(--mute)}
.btn.quiet:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border:0;background:transparent;border-radius:var(--r);color:var(--mute);padding:0;flex:none}
.ibtn:hover{background:var(--sunk);color:var(--ink)}
.ibtn.danger:hover{color:var(--p-red)}
textarea{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:var(--r);padding:8px 10px;font-size:15px;resize:vertical;min-height:40px}
textarea:focus{border-color:var(--day);background:var(--surface);outline:0}

/* итог тренировки */
.finish{display:grid;gap:12px;margin-top:26px}
.finish h2,h3{font:700 15px var(--display);margin:0;letter-spacing:-.01em}
h3{margin-top:24px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface)}
.stats div{padding:10px 12px;display:grid;gap:2px}
.stats div + div{border-left:1px solid var(--line)}
.stats span{font-size:12px;color:var(--mute)}
.stats b{font:700 20px var(--mono)}
.stats small{font-size:12px;color:var(--mute);font-weight:500}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label,.adform label{display:grid;gap:4px;font-size:13px;color:var(--mute);min-width:0}
.form input,.adform input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;font-size:16px;width:100%;min-width:0}
.form textarea{background:var(--surface);border-color:var(--line)}
.form .full,.adform .full{grid-column:1/-1}
.adform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.review{display:grid;gap:10px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px;display:grid;gap:8px;min-width:0}
.rich{display:grid;gap:6px;min-width:0;overflow-wrap:anywhere}
.rich h4{font:700 13px/1.3 var(--display);margin:10px 0 0}
.rich h4:first-child{margin-top:0}
.rich p,.rich ul,.rich ol{margin:0}
.rich ul,.rich ol{padding-left:20px;display:grid;gap:4px}
.rich li::marker{color:var(--day)}
.rich code{font:500 .9em var(--mono);background:var(--sunk);padding:1px 5px;border-radius:3px}

/* шторки */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(8,10,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:88%;border-radius:10px 10px 0 0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 10px 12px 16px;border-bottom:1px solid var(--line)}
.sheet-head b{font:600 16px var(--body);margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{overflow-y:auto;padding:14px 16px;display:grid;gap:12px;align-content:start}
.sheet-foot{display:flex;gap:8px;align-items:flex-end;padding:10px 16px 14px;border-top:1px solid var(--line)}
.sheet-foot textarea{flex:1;min-width:0;background:var(--surface);border-color:var(--line)}
.sheet-foot .btn{min-height:44px}
.menu{display:grid;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);overflow:hidden}
.mitem{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:13px 14px;text-align:left;font-size:15px}
.mitem + .mitem{border-top:1px solid var(--rule)}
.mitem svg{flex:none;color:var(--mute)}
.mitem:hover{background:var(--sunk)}
.mitem.ai svg{color:var(--day)}
.mitem.danger{color:var(--p-red)}
.mitem.danger svg{color:var(--p-red)}
.own{display:flex;gap:6px}
.own input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;font-size:15px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--day)}
.mus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.mus button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 10px;text-align:left;font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:baseline;min-width:0}
.mus button small{color:var(--mute);font:500 11px var(--mono)}
.mus button.s{border-color:var(--day);box-shadow:inset 3px 0 0 var(--day)}
.mus button.p{background:var(--day);border-color:var(--day);color:var(--day-ink)}
.mus button.p small{color:inherit;opacity:.8}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 6px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--inv)}
.seg button:disabled{opacity:.4}
.chat{display:grid;gap:10px}
.msg{border-radius:var(--r-card);padding:10px 12px;max-width:92%;min-width:0;font-size:15px}
.msg.user{justify-self:end;background:var(--ink);color:var(--inv);white-space:pre-wrap}
.msg.assistant{justify-self:start;background:var(--surface);border:1px solid var(--line)}

/* неделя */
.bars{display:grid;gap:7px;margin-top:14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}
.bar{display:grid;grid-template-columns:118px minmax(0,1fr) 62px;gap:8px;align-items:center;font-size:13px}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:12px;background:var(--sunk);border-radius:2px;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;display:block}
.track .zone{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.track .planb{background:var(--line);height:4px;top:4px}
.track .factb{background:var(--warn);opacity:.85}
.track .factb.ok{background:var(--ok)}
.bv{text-align:right;font-size:12px;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin-top:4px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px}
.legend .planb{background:var(--line)}
.legend .factb{background:var(--ok)}
.legend .zone{background:color-mix(in srgb,var(--ok) 20%,transparent)}
.tbl{overflow-x:auto;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}
table{border-collapse:collapse;width:100%;font:500 13px var(--mono);font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left;font-family:var(--body)}
th{color:var(--mute);font:600 12px var(--body)}
th .plate{width:12px;height:12px;vertical-align:-2px;margin-right:5px}
th .plate::after{inset:4px;background:var(--surface)}
tr:last-child td{border-bottom:0}
td.dir{font-weight:700}
td.mute{color:var(--mute)}
td.ok{color:var(--ok);font-weight:700}
td.low{color:var(--warn);font-weight:700}
tfoot td{font-weight:700;border-top:1px solid var(--line);background:var(--sunk)}
.note{color:var(--mute);font-size:13px;margin-top:10px}

/* история */
.list{display:grid;margin-top:6px}
.sess{border-bottom:1px solid var(--line)}
.sess summary{list-style:none;cursor:pointer;padding:14px 0;display:grid;gap:3px}
.sess summary::-webkit-details-marker{display:none}
.sess .d{display:flex;align-items:center;gap:8px;font-weight:600}
.sess .s{color:var(--mute);font:500 12.5px var(--mono);padding-left:22px}
.sess .body{padding:0 0 14px 22px;display:grid;gap:10px;font-size:14.5px}
.sess .body .mono{font-size:13px;color:var(--mute)}

/* нижние вкладки, таймер, кнопка тренера, всплывашка */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:12;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:8px 2px 9px;color:var(--mute);font-size:11.5px;font-weight:600}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"] svg{color:var(--day)}
.timer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:11;background:var(--ink);color:var(--inv);padding:8px 16px;display:flex;align-items:center;gap:10px;justify-content:center}
.timer .t{font:700 22px/1 var(--mono);min-width:66px;text-align:center}
.timer .l{font-size:13px;opacity:.75;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{display:grid;place-items:center;background:transparent;border:1px solid currentColor;color:inherit;border-radius:var(--r);height:30px;padding:0 8px;font:600 12.5px var(--mono)}
.timer.done{background:var(--ok);color:#fff}

const WEEKS = {1:"RIR 3",2:"RIR 2",3:"RIR 1–2",4:"изоляция 0–1 RIR",5:"изоляция 0–1 RIR",6:"разгрузка: ½ подходов, RIR 3–4"};
const START = "2026-10-01";

function setsFor(n, wk){ return wk===6 ? Math.ceil(n/2) : n; }
function rirFor(rir, wk){ return wk===1 ? "3" : wk===6 ? "3–4" : rir; }
function weekFromDate(d){
  const days = Math.floor((new Date(d+"T00:00:00") - new Date(START+"T00:00:00"))/864e5);
  return ((Math.max(0,Math.floor(days/7)))%6)+1;
}

function weekEnd(d){ const t=new Date(weekStart(d)+"T00:00:00"); t.setDate(t.getDate()+6); return t.toLocaleDateString("sv-SE"); }
const restTxt=r=>r>=60?Math.floor(r/60)+":"+String(r%60).padStart(2,"0"):r+" с";

// Безопасный мини-markdown: сначала экранируем, потом заголовки, списки, жирный
function md(src){
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`(.+?)`/g,"<code>$1</code>");
  let out="",list=null; const close=()=>{ if(list){ out+="</"+list+">"; list=null; } };
  for(const raw of esc(src).split("\n")){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){ close(); continue; }
    if((m=l.match(/^#{1,4}\s+(.*)/))){ close(); out+="<h4>"+inl(m[1])+"</h4>"; }
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=="ul"){ close(); out+="<ul>"; list="ul"; } out+="<li>"+inl(m[1])+"</li>"; }
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=="ol"){ close(); out+="<ol>"; list="ol"; } out+="<li>"+inl(m[1])+"</li>"; }
    else { close(); out+="<p>"+inl(l)+"</p>"; }
  }
  close(); return out;
}

/* ---------- Модель упражнения ---------- */
// base>=0 — упражнение программы; base=-1 — добавлено вручную
function xinfo(s,e){
  const row=e.base>=0&&P[s.day]?P[s.day].ex[e.base]:null;
  const plan=row?{ns:row[1],lo:row[2],hi:row[3],rir:row[4],rest:row[5],note:row[6]}:Object.assign({ns:3,lo:8,hi:12,rir:"1",rest:120,note:""},e.plan||{});
  const base=row?row[0]:(e.name||"Упражнение");
  const lv=e.lv||(e.mus?lvFromOld(e.mus):null)||(row?LV[s.day][e.base]:null)||{};
  return {row,custom:!row,base,name:row?(e.alt||base):base,plan,lv,mus:lvWeights(lv)};
}
const musKeys=m=>MUS_ORDER.filter(k=>m[k]);
// нагрузка 0–10 → доля подхода в объёме: высокая (7–10) = 1, средняя (4–6) = 0,5, низкая (1–3) = 0,25
const lvW=v=>v>=7?1:v>=4?.5:v>=1?.25:0;
const lvCat=v=>v>=7?"высокая":v>=4?"средняя":v>=1?"низкая":"";
function lvWeights(lv){ const m={}; for(const k in lv){ const w=lvW(+lv[k]); if(w) m[k]=w; } return m; }
function lvFromOld(m){ const o={}; for(const k in m){ const v=+m[k]; if(v) o[k]=v>=1?9:v>=.5?5:Math.max(1,Math.round(v*10)); } return o; }
// «Широчайшие 8, Середина спины 6, Бицепс 4» по убыванию
const lvSorted=lv=>Object.keys(lv).filter(k=>+lv[k]>0&&MUS[k]).sort((a,b)=>lv[b]-lv[a]||MUS_ORDER.indexOf(+a)-MUS_ORDER.indexOf(+b));
const lvText=lv=>lvSorted(lv).map(k=>MUS[k]+" "+lv[k]).join(", ");
// setsAt(e) -> число подходов; результат по мышцам: d — прямые, f — дробные
function muscleCount(s,setsAt){
  const r=MUS.map(()=>({d:0,f:0}));
  (s.ex||[]).forEach(e=>{ const n=setsAt(e), m=xinfo(s,e).mus; for(const k in m){ if(m[k]===1) r[k].d+=n; r[k].f+=n*m[k]; } });
  return r;
}
const blankSet=()=>({w:"",r:"",ok:false,q:""});
// сколько строк-подходов у упражнения: явное число (e.n), иначе план недели или уже записанные
const rowsOf=(s,e)=>e.n!=null?e.n:Math.max(setsFor(xinfo(s,e).plan.ns,s.week),e.sets.length);
const musName=k=>MUS[k];
const setDone=x=>x.ok||num(x.r)!==null;           // подход засчитан: отмечен или есть повторы (вес не обязателен)
const doneOf=e=>e.sets.filter(setDone).length;
const hasData=s=>s.ex&&s.ex.some(e=>e.sets.some(x=>x.w||x.r||x.ok));
const defSession=k=>({day:k,ex:P[k].ex.map((_,i)=>({base:i,uid:"p"+i,sets:[]}))});
function blankSession(date,day){
  const wk=weekFromDate(date);
  return {kind:"session",date,day,week:wk,bw:"",note:"",done:false,
    ex:P[day].ex.map((e,i)=>({base:i,uid:"p"+i,sets:Array.from({length:setsFor(e[1],wk)},blankSet),note:""}))};
}
function normDoc(v){
  if(v&&v.kind==="session"&&Array.isArray(v.ex)) v.ex.forEach((e,i)=>{
    if(e.base===undefined) e.base=(P[v.day]&&i<P[v.day].ex.length)?i:-1;
    if(!e.uid) e.uid=e.base>=0?"p"+e.base:"c"+i;
    if(!Array.isArray(e.sets)) e.sets=[];
  });
  return v;
}

/* ---------- Хранилище (db артефакта, иначе localStorage) ---------- */
const S={data:{},ver:0,status:"Подключаюсь…",bad:false,db:null,uid:null,connected:false,sample:null,tools:false};
const subs=new Set();
const emit=()=>{ S.ver++; subs.forEach(f=>f()); };
const useStore=()=>useSyncExternalStore(f=>{ subs.add(f); return ()=>subs.delete(f); },()=>S.ver);
const setStatus=(t,bad)=>{ S.status=t; S.bad=!!bad; emit(); };
const LS="trainlog.v1";
const lsRead=()=>{ try{ return JSON.parse(localStorage.getItem(LS)||"{}"); }catch(e){ return {}; } };
const lsWrite=()=>{ try{ localStorage.setItem(LS,JSON.stringify(S.data)); }catch(e){} };
const timers={}, chains={}, pending=new Set(), vers={};
function persist(id){
  clearTimeout(timers[id]); pending.add(id); const v=vers[id]=(vers[id]||0)+1;
  S.status="Сохраняю…"; S.bad=false;
  timers[id]=setTimeout(()=>{
    if(!S.connected) return;                       // допишем после подключения
    if(!S.db){ pending.delete(id); lsWrite(); setStatus("Сохранено на этом устройстве"); return; }
    const data=S.data[id];
    chains[id]=(chains[id]||Promise.resolve()).then(()=>data===undefined
      ? S.db.collection("data/users/"+S.uid).doc(id).delete()
      : S.db.collection("data/users/"+S.uid).doc(id).set(clone(data))
    ).then(()=>{ if(vers[id]===v) pending.delete(id); setStatus("Сохранено"); },()=>setStatus("Не сохранилось. Проверь доступ",true));
  },700);
}
const sessions=()=>Object.entries(S.data).filter(([k,v])=>v&&v.kind==="session").map(([k,v])=>Object.assign({id:k},v));
const sid=(date,day)=>"s_"+date+"_"+day;
/* Корректировки плана: после разбора тренировки изменения для следующих тренировок копятся в m_<день>
   и применяются, когда открываешь новую тренировку этого дня (дата позже тренировки-источника). */
const modsId=day=>"m_"+day;
const modsList=day=>{ const d=S.data[modsId(day)]; return d&&Array.isArray(d.list)?d.list:[]; };
const pendingMods=(day,date)=>modsList(day).filter(m=>m.from<date);
function modText(m){
  const row=m.base>=0&&P[m.day]?P[m.day].ex[m.base]:null;
  return m.type==="add_sets"?`+${m.n} подх. «${row?row[0]:"?"}»`
    :m.type==="replace"?`«${row?row[0]:"?"}» → «${m.name}»`
    :`добавить «${m.name}» ${m.n}×${m.lo}–${m.hi}`;
}
function applyMods(s,mods){
  const info=[];
  mods.forEach(m=>{
    if(m.type==="add_sets"){ const e=s.ex.find(x=>x.base===m.base); if(!e) return; const n=rowsOf(s,e)+m.n; e.n=n; while(e.sets.length<n) e.sets.push(blankSet()); }
    else if(m.type==="replace"){ const e=s.ex.find(x=>x.base===m.base); if(!e) return; e.alt=m.name; if(m.lv&&Object.keys(m.lv).length) e.lv=m.lv; }
    else if(m.type==="add"){ s.ex.push({uid:"m"+m.id,base:-1,name:m.name,n:m.n,plan:{ns:m.n,lo:m.lo,hi:m.hi,rir:"1",rest:120,note:""},lv:m.lv||{},sets:Array.from({length:m.n},blankSet),note:""}); }
    else return;
    info.push({text:modText(m),reason:m.reason||"",from:m.from});
  });
  if(info.length) s.applied=info;
  return s;
}
function getSession(date,day){ return S.data[sid(date,day)]||applyMods(blankSession(date,day),pendingMods(day,date)); }
function editSession(date,day,fn){
  const id=sid(date,day);
  if(!S.data[id]){
    const mods=pendingMods(day,date);
    S.data[id]=applyMods(blankSession(date,day),mods);
    if(mods.length){ const left=modsList(day).filter(m=>!mods.includes(m)); putDoc(modsId(day),left.length?{kind:"mods",day,list:left}:undefined); }
  }
  const s=S.data[id]; fn(s);
  if(!s.start&&hasData(s)) s.start=Date.now();
  persist(id); emit();
}
function putDoc(id,doc){ if(doc===undefined) delete S.data[id]; else S.data[id]=doc; persist(id); emit(); }

function lastTime(name,before){
  let best=null;
  for(const s of sessions()){
    if(s.date>=before||!s.ex) continue;
    for(const e of s.ex){
      if(xinfo(s,e).name!==name||!e.sets.some(x=>num(x.r)!==null)) continue;
      if(!best||s.date>best.date) best={date:s.date,e};
    }
  }
  return best;
}
function defaultDay(date){
  const ss=sessions().filter(hasData);
  const todays=ss.filter(s=>s.date===date);
  if(todays.length) return todays[0].day;
  const prev=ss.filter(s=>s.date<date).sort((a,b)=>b.date.localeCompare(a.date));
  return prev.length?ORDER[(ORDER.indexOf(prev[0].day)+1)%4]:"UA";
}

/* подключение к платформе */
(async()=>{
  const c=window.claude;
  try{
    S.sample=c?await c.use("sample"):null;
    if(S.sample&&S.sample.limits){ const l=await S.sample.limits().catch(()=>null); S.tools=!!(l&&l.tools); }
  }catch(e){ S.sample=null; }
  emit();
})();
(async()=>{
  const c=window.claude;
  try{
    const user=c?await c.use("user"):null;
    S.uid=user&&user.id?await user.id():null;
    S.db=S.uid&&c?await c.use("db"):null;
  }catch(e){ S.db=null; }
  const flush=()=>{ for(const id of [...pending]) persist(id); };
  if(!S.db){
    const local=lsRead(); for(const id in local) if(!pending.has(id)) S.data[id]=normDoc(local[id]);
    S.connected=true; setStatus("Сохранение на этом устройстве"); flush(); return;
  }
  S.db.collection("data/users/"+S.uid).onSnapshot(snap=>{
    const next={};
    snap.docs.forEach(d=>{ next[d.id]=normDoc(clone(d.data())); });   // данные снапшота заморожены — копируем
    for(const id of pending){ if(S.data[id]) next[id]=S.data[id]; else delete next[id]; }
    S.data=next;
    if(!S.connected){ S.connected=true; S.status="Синхронизировано"; flush(); }
    emit();
  },()=>{ S.db=null; S.connected=true; setStatus("Нет синхронизации, пишу на устройство",true); });
})();

/* Что не доделано относительно программы и куда это перенести */
const upcomingDays=day=>[1,2,3].map(k=>ORDER[(ORDER.indexOf(day)+k)%4]);
function deficits(s){
  const out=[];
  P[s.day].ex.forEach((row,bi)=>{
    const e=s.ex.find(x=>x.base===bi), plan=setsFor(row[1],s.week), done=e?doneOf(e):0;
    if(done<plan) out.push({bi,name:e?xinfo(s,e).name:row[0],missed:plan-done,lv:e?xinfo(s,e).lv:LV[s.day][bi],removed:!e});
  });
  return out;
}
// Простой перенос: недобор идёт в ближайшую тренировку с упражнением, где эта мышца нагружена высоко.
// Лимит на тренировку: +4 подхода и одно новое упражнение (только в день того же типа); остальное дальше по неделе или не переносится.
const CAP_SETS=4, CAP_NEW=1;
function suggestMods(s){
  const res=[], after=upcomingDays(s.day), load={}, added={};
  deficits(s).forEach(d=>{   // порядок программы: базовые раньше изоляции
    const top=+lvSorted(d.lv)[0]; if(isNaN(top)) return;
    const why=`недобор ${d.missed} подх. «${d.name}» (${MUS[top]})`;
    for(const day of after){
      const room=CAP_SETS-(load[day]||0); if(room<=0) continue;
      const bi=P[day].ex.findIndex((r,i)=>(LV[day][i][top]||0)>=7); if(bi<0) continue;

      load[day]=(load[day]||0)+n; return;
    }
    const day=after.find(k=>(added[k]||0)<CAP_NEW&&(load[k]||0)<CAP_SETS&&k[0]===s.day[0]);   // новое упражнение — только в день того же типа

    const row=P[s.day].ex[d.bi], n=Math.min(2,d.missed,CAP_SETS-(load[day]||0));
    res.push({id:rid(),day,type:"add",name:d.name,n,lo:row[2],hi:row[3],lv:d.lv,from:s.date,reason:why});
    load[day]=(load[day]||0)+n; added[day]=(added[day]||0)+1;
  });
  return res;
}

function ExerciseMenu({s,uid,date,edit,go,onClose,onRemove,onAsk}){
  const i=s.ex.findIndex(e=>e.uid===uid); if(i<0) return null;
  const e=s.ex[i], inf=xinfo(s,e), lt=lastTime(inf.name,date);
  const item=(icon,label,fn,cls)=>html`<button class=${"mitem "+(cls||"")} onClick=${fn}><${Icon} n=${icon} size=${20}/><span>${label}</span></button>`;
  const move=d=>{ edit(ss=>{ const k=ss.ex.findIndex(y=>y.uid===uid), j=k+d; if(k<0||j<0||j>=ss.ex.length) return; [ss.ex[k],ss.ex[j]]=[ss.ex[j],ss.ex[k]]; }); onClose(); };
  return html`<${Sheet} title=${inf.name} onClose=${onClose}>
    <div class="menu">
      ${item("swap",inf.custom?"Переименовать":"Заменить упражнение",()=>go("swap"))}

      ${lt?item("clock","Заполнить как в прошлый раз",()=>{ edit(ss=>{ const x=ss.ex.find(y=>y.uid===uid); if(x){ x.sets=lt.e.sets.map(y=>({w:y.w,r:y.r,ok:false,q:""})); x.n=x.sets.length; } }); onClose(); }):null}
      ${i>0?item("up","Поднять выше",()=>move(-1)):null}
      ${i<s.ex.length-1?item("down","Опустить ниже",()=>move(1)):null}

      ${item("trash","Убрать из тренировки",()=>{ onClose(); onRemove(i); },"danger")}
    </div>
  <//>`;
}

function MuscleSheet({s,uid,edit,onClose,opts}){

      edit(ss=>{ const x=ss.ex.find(y=>y.uid===uid); if(x){ x.lv=m; delete x.mus; } }); setMsg("Нагрузка определена автоматически. Можно поправить вручную."); }
    catch(err){ setMsg(err&&err.code==="not_granted"?ERR.not_granted+" Отметь вручную.":"Не получилось определить автоматически. Отметь вручную."); }
    setBusy(false);
  };

  <//>`;
}
function AddSheet({edit,onClose}){
  const [f,setF]=useState({name:"",n:"3",lo:"8",hi:"12"});

  const inp=(k,label,im)=>html`<label class=${k==="name"?"full":""}>${label}<input type="text" inputmode=${im} value=${f[k]} onChange=${ev=>setF(Object.assign({},f,{[k]:ev.target.value}))} placeholder=${k==="name"?"Например, жим Свенда":""}/></label>`;

/* ---------- Корректировки следующих тренировок ---------- */
const modKey=m=>m.day+"|"+m.type+"|"+(m.base??"")+"|"+(m.name||"");
function Corrections({s,toast}){
  const [ai,setAi]=useState(null), [off,setOff]=useState({}), [busy,setBusy]=useState(false), [msg,setMsg]=useState("");
  const list=ai||suggestMods(s);
  const planned=ORDER.flatMap(d=>modsList(d).filter(m=>m.from===s.date));
  const sentKeys=new Set(planned.map(modKey));
  const fresh=list.filter(m=>!sentKeys.has(modKey(m)));
  const auto=async()=>{ setBusy(true); setMsg("");
    try{ const r=await suggestModsAuto(s); setAi(r); setOff({}); if(!r.length) setMsg("Переносить нечего: недобор небольшой или уже покрыт."); }
    catch(e){ setMsg(errText(e)); }
    setBusy(false); };
  const apply=()=>{ const chosen=fresh.filter(m=>!off[modKey(m)]); if(!chosen.length) return;
    addMods(chosen.map(m=>Object.assign({},m,{id:rid()})));
    toast({text:`Добавлено в план: ${chosen.length}`,action:"Отменить",run:()=>{ const ks=new Set(chosen.map(modKey)); ORDER.forEach(d=>modsList(d).filter(m=>m.from===s.date&&ks.has(modKey(m))).forEach(m=>dropMod(d,m.id))); }}); };
  return html`<div class="corr">
    <h3>Перенос в ближайшие тренировки</h3>
    ${!list.length&&!planned.length?html`<div class="st">Всё сделано по плану, переносить нечего.</div>`:null}
    ${fresh.length?html`<div class="menu">${fresh.map(m=>{ const k=modKey(m); return html`<label key=${k} class="mitem corr-item">
        <input type="checkbox" checked=${!off[k]} onChange=${ev=>setOff(Object.assign({},off,{[k]:!ev.target.checked}))}/>
        <span><span class="corr-day"><${Plate} k=${m.day}/>${P[m.day].name}</span> ${modText(m)}${m.reason?html`<small>${m.reason}</small>`:null}</span>
      </label>`; })}</div>
      <div class="row-actions"><button class="btn primary" onClick=${apply}>Добавить в план</button>
        ${S.sample?html`<button class="btn" disabled=${busy} onClick=${auto}><${Icon} n="spark" size=${16}/> ${busy?"Подбираю…":ai?"Подобрать ещё раз":"Подобрать автоматически"}</button>`:null}
        ${ai?html`<button class="btn quiet" onClick=${()=>setAi(null)}>Простой вариант</button>`:null}</div>`:null}
    ${planned.length?html`<div class="st">Уже в плане (применится, когда откроешь эти тренировки):</div>
      <div class="menu">${planned.map(m=>html`<div key=${m.id} class="mitem corr-item"><span><span class="corr-day"><${Plate} k=${m.day}/>${P[m.day].name}</span> ${modText(m)}</span>
        <button class="ibtn danger" aria-label="Убрать из плана" onClick=${()=>dropMod(m.day,m.id)}><${Icon} n="close" size=${16}/></button></div>`)}</div>`:null}
    ${msg?html`<div class="st">${msg}</div>`:null}
  </div>`;
}

/* ---------- Разбор (тренировки или недели) ---------- */
function Review({label,stored,build,onSave,disabledMsg}){
  const [live,setLive]=useState(""), [err,setErr]=useState("");
  const ctl=useRef(null);
  const run=async()=>{
    const p=build(); if(!p){ setErr(disabledMsg); return; }
    ctl.current=new AbortController(); setErr(""); setLive("…");
    try{ const r=await S.sample(p,{signal:ctl.current.signal,cache:false,onText:({text})=>setLive(text)});
      onSave(r.text+(r.truncated?"\n\n(Ответ оборван, запроси ещё раз.)":"")); setLive(""); }
    catch(e){ setLive(""); if(e&&e.code!=="cancelled"&&!e.text) setErr(errText(e)); if(e&&e.text) onSave(e.text+"\n\n(Ответ прерван.)"); }
    ctl.current=null;
  };
  return html`<div class="review">
    ${live?html`<div class="sum">${live==="…"?html`<div class="st">Анализирую… Ответ может прийти через полминуты.</div>`:html`<${Rich} text=${live}/>`}<div><button class="btn" onClick=${()=>ctl.current&&ctl.current.abort()}>Стоп</button></div></div>`
      :stored?html`<div class="sum"><${Rich} text=${stored}/></div>`:null}
    <div class="row-actions">
      ${S.sample?html`<button class="btn primary" disabled=${!!live} onClick=${run}><${Icon} n="spark" size=${16}/> ${stored?label+" заново":label}</button>`:null}
      <button class="btn quiet" onClick=${()=>{ const p=build(); p?copyText(p,"Запрос скопирован, вставь его в чат"):setErr(disabledMsg); }}>Скопировать запрос</button>
    </div>
    ${err?html`<div class="st bad">${err}</div>`:null}
  </div>`;
}

// Общее для обоих видов: тренировка, правки, удаление с «Вернуть», неделя мезоцикла, завершение
function useSession(date,day,toast){
  const s=getSession(date,day);
  const edit=fn=>editSession(date,day,fn);
  const remove=i=>{
    const entry=clone(s.ex[i]), name=xinfo(s,entry).name;
    edit(ss=>{ ss.ex.splice(i,1); });
    toast({text:`«${name}» убрано`,action:"Вернуть",run:()=>edit(ss=>{ ss.ex.splice(Math.min(i,ss.ex.length),0,entry); })});
  };
  const setWeek=d=>edit(ss=>{ ss.week=Math.min(6,Math.max(1,ss.week+d));
    ss.ex.forEach(e=>{ if(e.sets.some(x=>x.w||x.r||x.ok)) return; delete e.n; e.sets=Array.from({length:setsFor(xinfo(ss,e).plan.ns,ss.week)},blankSet); }); });
  const finish=()=>edit(ss=>{ ss.done=!ss.done; if(ss.done){ ss.end=Date.now(); if(!ss.dur&&ss.start) ss.dur=String(Math.max(1,Math.round((ss.end-ss.start)/60000))); } });
  return {s,edit,remove,setWeek,finish};
}
function SessionSheets({sheet,setSheet,s,date,edit,remove,openAsk}){
  if(!sheet) return null;
  const close=()=>setSheet(null), go=(t,o)=>setSheet({type:t,uid:sheet.uid,opts:o});
  return sheet.type==="menu"?html`<${ExerciseMenu} s=${s} uid=${sheet.uid} date=${date} edit=${edit} onClose=${close} onRemove=${remove} onAsk=${openAsk} go=${go}/>`
    :sheet.type==="swap"?html`<${SwapSheet} s=${s} uid=${sheet.uid} edit=${edit} onClose=${close} go=${go}/>`

    :sheet.type==="add"?html`<${AddSheet} edit=${edit} onClose=${close}/>`:null;
}

function textLog(s){

  s.ex.forEach(e=>{ const sets=e.sets.filter(x=>x.w||x.r).map(x=>`${x.w||"б/в"}×${x.r||"?"}${x.q?" (запас "+x.q+")":""}`).join(", ");
    if(sets||e.note) t+=`- ${xinfo(s,e).name}: ${sets}${e.note?" ("+e.note+")":""}\n`; });

function WeekView({date}){
  const [pw,setPw]=useState(null);
  const wk=pw||weekFromDate(date), ws=weekStart(date), we=weekEnd(date);
  const inWeek=sessions().filter(x=>x.date>=ws&&x.date<=we);
  const cols=ORDER.map(k=>{ const real=inWeek.filter(x=>x.day===k).sort((a,b)=>b.date.localeCompare(a.date))[0]; return {k,s:real||defSession(k),real:!!real}; });
  const cnt=c=>e=>c.real?rowsOf(c.s,e):setsFor(xinfo(c.s,e).plan.ns,wk);
  const pd=cols.map(c=>muscleCount(c.s,cnt(c)));

    return `Ты персональный тренер по гипертрофии внутри приложения-дневника тренировок. Отвечай по-русски, коротко и по делу (до 150 слов, если не просят подробнее), списками где уместно. Не называй себя ИИ или Claude, ты просто тренер в приложении. При боли в сухожилии советуй убрать упражнение и показаться спортивному врачу.
${PROFILE}

ТЕКУЩАЯ ТРЕНИРОВКА (упражнения пронумерованы):
${sessionBlock(cur,true)}
${prev.length?"ПОСЛЕДНИЕ ТРЕНИРОВКИ:\n"+prev.map(x=>sessionBlock(x)).join("\n"):""}
${S.tools?`У тебя есть инструменты replace_exercise и add_exercise, они меняют текущую тренировку пользователя. Вызывай их ТОЛЬКО если пользователь прямо просит заменить или добавить упражнение. Нагрузку на мышцы передавай в muscle_levels по шкале 1–10 (в тренажёрах вспомогательные мышцы ниже), мышцы только из списка: ${MUS.join(", ")}. После изменения кратко скажи, что сделал.`:"Менять тренировку сам ты не можешь: если предлагаешь замену, назови упражнение, и пользователь заменит его через «⋯ → Заменить упражнение»."}`; };
  const tools=()=>S.tools?[
    {name:"replace_exercise",description:"Заменяет упражнение в текущей тренировке на другое. Возвращает текст с результатом.",
     inputSchema:{type:"object",properties:{exercise_number:{type:"integer",description:"Номер упражнения в текущей тренировке, начиная с 1"},new_name:{type:"string"},muscle_levels:{type:"object",description:"Нагрузка на мышцы по шкале 1–10, ключи только из списка мышц",additionalProperties:{type:"integer"}},primary_muscles:{type:"array",items:{type:"string",enum:MUS}},secondary_muscles:{type:"array",items:{type:"string",enum:MUS}}},required:["exercise_number","new_name"]},
     execute:inp=>{ const cur=getSession(date,day), i=Math.round(Number(inp.exercise_number))-1, name=String(inp.new_name||"").trim();
       if(!(i>=0&&i<cur.ex.length)) throw new Error("Нет упражнения с таким номером"); if(!name) throw new Error("Пустое название");
       const before=clone(cur.ex[i]), old=xinfo(cur,before).name, m=lvFromTool(inp);
       editSession(date,day,ss=>{ const x=ss.ex.find(y=>y.uid===before.uid); if(!x) return; if(x.base>=0) x.alt=name; else x.name=name; if(Object.keys(m).length){ x.lv=m; delete x.mus; } });
       toast({text:`Заменено: «${old}» → «${name}»`,action:"Вернуть",run:()=>editSession(date,day,ss=>{ const k=ss.ex.findIndex(y=>y.uid===before.uid); if(k>=0) ss.ex[k]=before; })});
       return `Готово: «${old}» заменено на «${name}».`; }},
    {name:"add_exercise",description:"Добавляет упражнение в конец текущей тренировки. Возвращает текст с результатом.",
     inputSchema:{type:"object",properties:{name:{type:"string"},sets:{type:"integer"},reps_min:{type:"integer"},reps_max:{type:"integer"},muscle_levels:{type:"object",description:"Нагрузка на мышцы по шкале 1–10, ключи только из списка мышц",additionalProperties:{type:"integer"}},primary_muscles:{type:"array",items:{type:"string",enum:MUS}},secondary_muscles:{type:"array",items:{type:"string",enum:MUS}}},required:["name","sets","reps_min","reps_max"]},
     execute:inp=>{ const name=String(inp.name||"").trim(); if(!name) throw new Error("Пустое название");

        <div class="menu">${chips.map(c=>html`<button key=${c} class="mitem" onClick=${()=>S.sample?send(c):setInput(c)}><${Icon} n="spark" size=${16}/><span>${c}</span></button>`)}</div>`:null}
      ${turns.map((t,k)=>html`<div key=${k} class=${"msg "+t.role}>${t.role==="assistant"?html`<${Rich} text=${t.content}/>`:t.content}</div>`)}

      ${err?html`<div class="st bad">${err}</div>`:null}
      ${turns.length&&!live?html`<button class="btn quiet" onClick=${()=>{ setTurns([]); setErr(""); }}>Начать заново</button>`:null}
    </div>
  <//>`;
}

/* ---------- Таймер, всплывашка, нижние вкладки ---------- */
function Timer({t,onStop,onShift}){
  const [,tick]=useState(0);
  useEffect(()=>{ if(!t) return; const h=setInterval(()=>tick(x=>x+1),250); return ()=>clearInterval(h); },[t]);
  if(!t) return null;
  const left=Math.max(0,Math.round((t.end-Date.now())/1000));
  return html`<div class=${"timer"+(left===0?" done":"")} role="timer">
    <button onClick=${()=>onShift(-15)} aria-label="Минус 15 секунд">−15</button>
    <div class="t">${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</div>
    <div class="l">${left===0?"Отдых закончен":"Отдых · "+t.label}</div>
    <button onClick=${()=>onShift(15)} aria-label="Плюс 15 секунд">+15</button>
    <button onClick=${onStop} aria-label="Остановить таймер"><${Icon} n="close" size=${16}/></button>
  </div>`;
}
function Toast({t,onClose}){
  const ref=useRef(null);
  useEffect(()=>{ if(!t) return; anim(ref.current,{transform:["translateY(-8px)","translateY(0)"],opacity:[0,1]}); const h=setTimeout(onClose,5000); return ()=>clearTimeout(h); },[t]);
  if(!t) return null;
  return html`<div class="toast" role="status" ref=${ref}><span>${t.text}</span>${t.action?html`<button onClick=${()=>{ t.run(); onClose(); }}>${t.action}</button>`:null}</div>`;
}

/* Вид «Фокус»: одно упражнение и один текущий подход на экране.
   Вес и повторы — крупные кнопки ±, без клавиатуры, предзаполнены по прошлому разу.
   Одна главная кнопка «Подход сделан», после неё — кольцо отдыха с превью следующего подхода. */

const W_STEP=2.5;
const nfmt=v=>{ const x=num(v); return x===null?"":String(Math.round(x*100)/100).replace(".",","); };

function RestRing({t,onShift,onStop,next}){
  const [,tick]=useState(0);
  useEffect(()=>{ const h=setInterval(()=>tick(x=>x+1),250); return ()=>clearInterval(h); },[t]);
  const total=Math.max(1,t.total||60), left=Math.max(0,Math.round((t.end-Date.now())/1000)), p=left/total;
  const R=88, C=2*Math.PI*R;
  return html`<section class=${"rest"+(left===0?" over":"")} aria-label="Отдых">
    <div class="ring">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r=${R} class="ring-bg"/>
        <circle cx="100" cy="100" r=${R} class="ring-fg" style=${{strokeDasharray:C,strokeDashoffset:C*(1-p)}}/>
      </svg>
      <div class="ring-c"><b class="big">${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</b><span>${left===0?"можно начинать":"отдых"}</span></div>
    </div>
    ${next?html`<div class="rest-next"><span>Дальше</span><b>${next}</b></div>`:null}
    <div class="rest-act">
      <button class="fbtn" onClick=${()=>onShift(-15)}>−15 с</button>
      <button class="fbtn" onClick=${()=>onShift(15)}>+15 с</button>
      <button class="fbtn main" onClick=${onStop}>${left===0?"Начать подход":"Пропустить"}</button>
    </div>
  </section>`;
}

function Stepper({label,value,unit,step,onChange,dec}){
  const [edit,setEdit]=useState(false);
  const v=num(value);
  const set=x=>onChange(x===null?"":String(Math.max(0,Math.round(x*100)/100)).replace(".",dec?",":"."));
  return html`<div class="stp">
    <span class="stp-l">${label}</span>
    <div class="stp-row">
      <button class="stp-b" aria-label=${"Меньше: "+label} onClick=${()=>set((v??0)-step)}><${Icon} n="minus" size=${26}/></button>
      ${edit?html`<input class="stp-in" autoFocus type="text" inputmode="decimal" value=${value} onChange=${ev=>onChange(ev.target.value)} onBlur=${()=>setEdit(false)} onKeyDown=${ev=>{ if(ev.key==="Enter") setEdit(false); }}/>`
        :html`<button class="stp-v" onClick=${()=>setEdit(true)} aria-label=${label+": "+(value||"не задано")+". Нажми, чтобы ввести"}><b class="big">${value===""?"–":nfmt(value)}</b><small>${unit}</small></button>`}
      <button class="stp-b" aria-label=${"Больше: "+label} onClick=${()=>set((v??0)+step)}><${Icon} n="plus" size=${26}/></button>
    </div>
  </div>`;
}

function FocusView({date,setDate,day,setDay,toast,timer,setTimer,openAsk,setUi}){
  const {s,edit,remove,setWeek,finish}=useSession(date,day,toast), wk=s.week;
  const [idx,setIdx]=useState(null), [sheet,setSheet]=useState(null), [panel,setPanel]=useState(null), [draft,setDraft]=useState(null);
  useEffect(()=>{ setIdx(null); setDraft(null); },[day,date]);
  const open=s.ex.findIndex(e=>doneOf(e)<rowsOf(s,e)||e.sets.slice(0,rowsOf(s,e)).some(x=>!x.ok));
  const i=idx!=null&&idx<s.ex.length?idx:(open>=0?open:Math.max(0,s.ex.length-1));
  const e=s.ex[i];
  const allDone=s.ex.length>0&&open<0;
  const go=k=>{ setIdx(Math.max(0,Math.min(s.ex.length-1,k))); setDraft(null); };

  // текущий подход и значения по умолчанию: этот подход → прошлый подход сегодня → прошлая тренировка
  let inf=null, rows=0, j=0, lt=null, exDone=false, def={w:"",r:"",q:""};
  if(e){
    inf=xinfo(s,e); rows=rowsOf(s,e); lt=lastTime(inf.name,date);
    j=e.sets.slice(0,rows).findIndex(x=>!x.ok); exDone=j<0; if(j<0) j=Math.max(0,rows-1);
    const cur=e.sets[j]||blankSet(), prev=j>0?e.sets[j-1]:null, lp=lt&&(lt.e.sets[j]||lt.e.sets[lt.e.sets.length-1]);
    def={w:cur.w||(prev&&prev.w)||(lp&&lp.w)||"", r:cur.r||(lp&&lp.r)||String(inf.plan.lo), q:cur.q||""};
  }
  const key=e?e.uid+"#"+j:"";
  const val=draft&&draft.key===key?draft:Object.assign({key},def);
  const setVal=patch=>setDraft(Object.assign({},val,patch,{key}));
  const upd=fn=>edit(ss=>{ const x=ss.ex.find(y=>y.uid===e.uid); if(x){ if(x.n==null) x.n=rowsOf(ss,x); while(x.sets.length<x.n) x.sets.push(blankSet()); fn(x); } });

  const nextLabel=()=>{
    if(!e) return "";
    if(j+1<rows) return `${inf.name}: подход ${j+2} из ${rows}`;
    const n=s.ex.findIndex((x,k)=>k>i&&doneOf(x)<rowsOf(s,x)); return n>=0?xinfo(s,s.ex[n]).name:"тренировка закончена";
  };
  const logSet=ev=>{
    const nl=nextLabel();
    upd(x=>{ x.sets[j]=Object.assign({},x.sets[j],{w:val.w,r:val.r,q:val.q,ok:true}); });
    anim(ev.currentTarget,{transform:["scale(.94)","scale(1)"]},{bounce:.45,duration:.45});
    setTimer({end:Date.now()+inf.plan.rest*1000,total:inf.plan.rest,label:inf.name,next:nl});
    setDraft(null);
    if(j>=rows-1){ const n=s.ex.findIndex((x,k)=>k>i&&doneOf(x)<rowsOf(s,x)); setIdx(n>=0?n:i); }
  };
  const restOn=timer&&(timer.end>Date.now()-60000);

  const progress=html`<div class="fprog" role="tablist" aria-label="Упражнения тренировки">${s.ex.map((x,k)=>{ const r=rowsOf(s,x), d=Math.min(r,doneOf(x)); return html`<button key=${x.uid} role="tab" aria-selected=${String(k===i)} aria-label=${xinfo(s,x).name+": "+d+" из "+r} style=${{flexGrow:Math.max(1,r)}} onClick=${()=>go(k)}><i style=${{width:(r?d/r*100:0)+"%"}}></i></button>`; })}</div>`;

  return html`<div class="focus">
    <header class="fhead">
      <button class="fday" onClick=${()=>setPanel(panel==="day"?null:"day")} aria-expanded=${String(panel==="day")}><${Plate} k=${day}/><span>${P[day].name}</span><small>нед. ${wk} · ${WEEKS[wk]}</small></button>
      <${Elapsed} s=${s}/>
      <button class="ibtn" aria-label="Вид «Журнал»" title="Вид «Журнал»" onClick=${()=>setUi("journal")}><${Icon} n="list" size=${20}/></button>
    </header>
    ${panel==="day"?html`<div class="fpanel">
      <div class="days" role="group" aria-label="День программы">${ORDER.map(k=>html`<button key=${k} aria-pressed=${String(k===day)} onClick=${()=>{ setDay(k); setPanel(null); }}><${Plate} k=${k}/>${P[k].name}</button>`)}</div>
      <div class="wk-meta">
        <input type="date" value=${date} aria-label="Дата" onChange=${ev=>ev.target.value&&setDate(ev.target.value)}/>
        ${date!==todayStr()?html`<button class="btn quiet" onClick=${()=>setDate(todayStr())}>Сегодня</button>`:null}
        <div class="stepper"><button aria-label="Неделя назад" onClick=${()=>setWeek(-1)}>−</button><span>нед. ${wk}</span><button aria-label="Неделя вперёд" onClick=${()=>setWeek(1)}>+</button></div>
      </div>
      <button class="btn quiet" onClick=${()=>setUi("journal")}><${Icon} n="list" size=${16}/> Перейти в вид «Журнал»</button>
    </div>`:null}
    ${progress}
    <${AppliedBanner} s=${s} date=${date} day=${day} edit=${edit}/>

    ${restOn?html`<${RestRing} t=${timer} next=${timer.next} onShift=${d=>setTimer(t=>t&&({...t,end:Math.max(Date.now(),t.end)+d*1000}))} onStop=${()=>setTimer(null)}/>`:null}

    ${!e?html`<section class="stage"><p class="empty">В тренировке нет упражнений.</p><button class="fbtn main wide" onClick=${()=>setSheet({type:"add"})}>Добавить упражнение</button></section>`
    :html`<section class=${"stage"+(restOn?" dim":"")}>
      <div class="st-top">
        <button class="ibtn" aria-label="Предыдущее упражнение" disabled=${i===0} onClick=${()=>go(i-1)}><${Icon} n="left" size=${22}/></button>
        <div class="st-name">
          <small>Упражнение ${i+1} из ${s.ex.length}${e.alt&&!inf.custom?" · вместо: "+inf.base:""}</small>
          <h2>${inf.name}</h2>
        </div>
        <button class="ibtn" aria-label="Действия с упражнением" onClick=${()=>setSheet({type:"menu",uid:e.uid})}><${Icon} n="more" size=${22}/></button>
      </div>
      <div class="st-meta">
        <span class="tgt"><b>${inf.plan.lo}–${inf.plan.hi}</b> повт · RIR <b>${rirFor(inf.plan.rir,wk)}</b> · отдых ${restTxt(inf.plan.rest)}</span>
        <span class="lvline">${lvSorted(inf.lv).slice(0,3).map(k=>html`<span key=${k} class=${inf.lv[k]>=7?"hi":inf.lv[k]>=4?"mid":"lo"}>${MUS[k]} <b>${inf.lv[k]}</b></span>`)}</span>
      </div>

      <div class="setno">${exDone?html`<b>Все подходы сделаны</b>`:html`Подход <b class="big">${j+1}</b> из ${rows}`}</div>

      ${!exDone?html`
        <div class="stps">
          <${Stepper} label="Вес" unit="кг" step=${W_STEP} dec=${true} value=${val.w} onChange=${w=>setVal({w})}/>
          <${Stepper} label="Повторы" unit="раз" step=${1} value=${val.r} onChange=${r=>setVal({r})}/>
        </div>
        <div class="qrow" role="group" aria-label="Запас: сколько ещё мог сделать">
          <span>Ещё мог</span>
          ${["0","1","2","3","4+"].map(v=>html`<button key=${v} class=${(val.q===v?"on ":"")+qTone(v)} aria-pressed=${String(val.q===v)} onClick=${()=>setVal({q:val.q===v?"":v})}>${v}</button>`)}
        </div>
        ${lt?html`<div class="fwas">В прошлый раз (${dm(lt.date)}): ${lt.e.sets.filter(x=>num(x.r)!==null).map(x=>(x.w||"б/в")+"×"+x.r).join(", ")}</div>`:null}
        <button class="fbtn main hero" onClick=${logSet}><${Icon} n="check" size=${26}/> Подход сделан</button>
      `:html`<button class="fbtn main hero" onClick=${()=>{ const n=s.ex.findIndex((x,k)=>k!==i&&doneOf(x)<rowsOf(s,x)); n>=0?go(n):setPanel("finish"); }}>${allDone?"Подвести итог":"Следующее упражнение"}</button>`}

      <div class="chips" aria-label="Подходы">
        ${Array.from({length:rows},(_,k)=>{ const x=e.sets[k]||blankSet(); return html`<button key=${k} class=${"chip-s"+(x.ok?" ok":"")+(k===j&&!exDone?" cur":"")}
          onClick=${()=>{ if(x.ok){ upd(y=>{ y.sets[k].ok=false; }); setDraft(null); } }} aria-label=${x.ok?"Подход "+(k+1)+" сделан, нажми чтобы переделать":"Подход "+(k+1)}>
          <small>${k+1}</small><span>${x.ok?(x.w?nfmt(x.w)+"×":"")+x.r:"–"}</span></button>`; })}
        <button class="chip-s add" aria-label="Добавить подход" onClick=${()=>upd(x=>{ x.n+=1; x.sets.push(blankSet()); })}><${Icon} n="plus" size=${16}/></button>
        ${rows>1?html`<button class="chip-s add" aria-label="Убрать последний подход" onClick=${()=>upd(x=>{ x.n=Math.max(1,x.n-1); x.sets=x.sets.slice(0,x.n); })}><${Icon} n="minus" size=${16}/></button>`:null}
      </div>
      <${NoteField} value=${e.note||""} onChange=${v=>edit(ss=>{ const x=ss.ex.find(y=>y.uid===e.uid); if(x) x.note=v; })}/>
      <div class="st-nav">
        <button class="btn quiet" disabled=${i===0} onClick=${()=>go(i-1)}>‹ Назад</button>
        <button class="btn quiet" onClick=${()=>setPanel(panel==="list"?null:"list")}>Все упражнения</button>
        <button class="btn quiet" disabled=${i>=s.ex.length-1} onClick=${()=>go(i+1)}>Дальше ›</button>
      </div>
    </section>`}

    ${panel==="list"?html`<section class="flist">
      ${s.ex.map((x,k)=>{ const r=rowsOf(s,x), d=Math.min(r,doneOf(x)); return html`<div key=${x.uid} class=${"fl-row"+(k===i?" cur":"")+(d>=r&&r?" done":"")}>
        <button class="fl-main" onClick=${()=>{ go(k); setPanel(null); }}><small>${k+1}</small><span>${xinfo(s,x).name}</span><b>${d}/${r}</b></button>
        <button class="ibtn" aria-label="Действия" onClick=${()=>setSheet({type:"menu",uid:x.uid})}><${Icon} n="more" size=${18}/></button>
      </div>`; })}
      <button class="btn wide" onClick=${()=>setSheet({type:"add"})}><${Icon} n="plus" size=${16}/> Добавить упражнение</button>
    </section>`:null}

    <div class="fend">
      <button class=${"btn wide "+(s.done?"ok":allDone?"primary":"")} onClick=${()=>{ finish(); setPanel("finish"); }}>${s.done?"Тренировка завершена":"Завершить тренировку"}</button>
      ${panel!=="finish"&&!s.done?html`<button class="btn quiet" onClick=${()=>setPanel("finish")}>Итог и разбор</button>`:null}
    </div>
    ${panel==="finish"||s.done?html`<${FinishPanel} s=${s} edit=${edit} toast=${toast}/>`:null}
    <${SessionSheets} sheet=${sheet} setSheet=${setSheet} s=${s} date=${date} edit=${edit} remove=${remove} openAsk=${openAsk}/>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
