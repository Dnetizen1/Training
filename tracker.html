<title>Дневник тренировок</title>
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<style>
/* Дизайн «Блины» (см. DESIGN.md) — последний раздел файла, v9. Он лежит поверх прежних слоёв:
   v2–v7 — дизайн в духе Apple Health, v8 «violet» — по референсу дневника питания. */
:root{
  --bg:#010101; --panel:#252137; --card:#1C1B21; --fill:#2F2C39; --fill2:#2A2833; --chip:#282837; --sep:#2C2A34;
  --ink:#F3F6F9; --ink2:#C9C7D3; --mute:#8A8793; --mute2:#757185; --inv:#010101; --grid:#484653;
  --acc:#9478FF; --accf:#8160FF; --acc-ink:#FFFFFF; --acc-soft:#3D326B; --acc-track:#3A3550;
  --pink:#FF69B4; --blue:#779EFF; --teal:#01C4A2;
  --grn:#01C4A2; --grn-track:#0F2F2A; --pur:#FF69B4; --pur-track:#3A1F33;
  --ok:#01C4A2; --ok-soft:#123029; --warn:#FF69B4; --warn-soft:#3A1F33; --red:#FF5A6E;
  --lv-hi:#3D326B; --lv-mid:#283250; --lv-lo:#282837;
  --p-red:#FF69B4; --p-blue:#779EFF; --p-yellow:#FFC857; --p-green:#01C4A2;
  --sheet:#131217; --tab:#252137; --shadow:none; --tile:#2F2C39; --roundb:#3A3650;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --round:var(--font);
  --r:10px; --rc:16px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{scroll-padding-bottom:120px;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:17px/1.3 var(--font);letter-spacing:-.01em;padding-inline:16px;padding-block:0 calc(120px + env(safe-area-inset-bottom,0px));max-width:640px;margin-inline:auto;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,.mono{font-family:var(--round);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.st{color:var(--mute);font-size:15px}
.st.bad{color:var(--warn)}
.empty{color:var(--mute);padding:32px 8px;text-align:center}
.big{font-family:var(--round);font-weight:700;font-variant-numeric:tabular-nums}

/* шапки: крупный заголовок, как в iOS */
.save{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding-top:10px;margin-bottom:-14px;font-size:12px;color:var(--mute)}
.save::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.save.bad{color:var(--warn)}.save.bad::before{background:var(--warn)}
.large{display:grid;gap:2px;padding:22px 4px 6px}
.eyebrow{font-size:13px;font-weight:600;color:var(--mute)}
h1{margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em}
h2,h3{margin:0}
.sec{font-size:22px;line-height:28px;font-weight:700;margin:26px 4px 8px}
h3{font-size:20px;font-weight:700;margin:24px 4px 8px}
.wk{display:grid;gap:12px;padding:18px 0 4px}
.wk-top{display:flex;align-items:center;gap:10px}
.wk-name{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;padding:0;color:var(--acc);font-size:17px;justify-self:start}
.plate{flex:none;display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c)}
.wk-name .plate{width:14px;height:14px}

/* переключатели-сегменты (как UISegmentedControl) */
.viewseg,.days,.seg{display:grid;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.viewseg{grid-template-columns:1fr 1fr;margin-top:18px}
.days{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg{grid-template-columns:1fr 1fr}
.viewseg button,.days button,.seg button{display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;border-radius:7px;min-height:32px;padding:4px 6px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;min-width:0;transition:background .2s var(--ease)}
.viewseg button[aria-pressed="true"],.days button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg button:disabled{opacity:.4}
.wk-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=date]{background:var(--fill);border:0;border-radius:8px;padding:0 10px;height:34px;font-size:15px;font-family:var(--round)}
.stepper{display:inline-flex;align-items:center;background:var(--fill);border-radius:8px;height:34px}
.stepper button{border:0;background:transparent;width:34px;height:34px;font-size:18px;color:var(--acc)}
.stepper span{min-width:58px;text-align:center;font-size:14px;font-weight:600}
.goal{font-size:13px;font-weight:600;padding:7px 10px;border-radius:8px;background:var(--acc-soft);color:var(--ink)}
.goal.warn{background:var(--warn-soft)}
.musbtn{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border:0;border-radius:17px;background:var(--fill);font-size:15px;font-weight:600;color:var(--ink);flex:none}
.musbtn svg{color:var(--acc)}

/* кнопки */
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--fill);color:var(--acc);border-radius:22px;padding:0 16px;min-height:44px;font-size:17px;font-weight:600;transition:transform .1s var(--ease),opacity .15s}
.btn:active{transform:scale(.97)}
.btn.wide{flex:1;width:100%}
.btn.primary,.cta{background:var(--acc);color:var(--acc-ink)}
.btn.primary svg{color:inherit}
.btn.ok{background:var(--ok);color:#fff}
.btn.quiet{background:transparent;padding:0 6px}
.btn:disabled{opacity:.4;cursor:default}
.ibtn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;background:transparent;border-radius:22px;color:var(--acc);padding:0;flex:none}
.ibtn:disabled{opacity:.3}
.ibtn.danger{color:var(--red)}
.linkbtn{border:0;background:none;padding:0;color:var(--acc);font-size:15px;font-weight:500}
.cta{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border:0;border-radius:25px;font-size:17px;font-weight:600}

/* карточки */
.card{display:grid;gap:12px;background:var(--card);border-radius:var(--rc);padding:16px;box-shadow:var(--shadow);border:0;text-align:left;width:100%}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-t{font-size:15px;font-weight:600}
.card-t.acc{color:var(--acc)}
.card-s{font-size:13px;color:var(--mute)}
.today-main{display:flex;align-items:center;gap:16px}
.today-txt{display:grid;gap:2px;min-width:0}
.today-txt b{font-size:22px;line-height:28px}
.today-txt span{font-size:15px;color:var(--mute)}
.plist{list-style:none;margin:0;padding:0;border-top:.5px solid var(--sep)}
.plist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:.5px solid var(--sep);font-size:15px}
.plist li .num{color:var(--mute)}
.week-card{grid-template-columns:auto 1fr;align-items:center;gap:20px;cursor:pointer}
.ringlegend{display:grid;gap:10px;margin:0}
.ringlegend div{display:grid;gap:0}
.ringlegend dt{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600}
.ringlegend dt i{width:9px;height:9px;border-radius:50%}
.ringlegend dd{margin:0;font-size:24px;font-weight:700}
.ringlegend small{font-size:15px;font-weight:600;color:var(--mute)}
.card.list{padding:0;gap:0;overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px 12px 12px 16px;text-align:left;color:var(--ink)}
.card.list .lrow + .lrow{border-top:.5px solid var(--sep)}
.lrow > svg:last-child{color:var(--mute);opacity:.6;flex:none}
.lrow.solo{display:flex}
.lmain{display:grid;gap:2px;flex:1;min-width:0}
.lmain b{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmain small{font-size:14px;color:var(--mute)}
.badge{display:grid;place-items:center;width:32px;height:32px;border-radius:16px;background:var(--acc-soft);color:var(--acc);flex:none}
.empty-row{margin:0;padding:14px 16px;font-size:15px;color:var(--mute)}
.spark{flex:none}
.rings{flex:none}

/* журнал: упражнение — карточка со списком подходов */
.exlist{display:grid;gap:14px;margin-top:14px}
.exb{display:grid;gap:10px;background:var(--card);border-radius:var(--rc);padding:14px 14px 10px;box-shadow:var(--shadow);min-width:0}
.exb-head{display:flex;align-items:flex-start;gap:4px}
.exb-tt{flex:1;min-width:0}
.exb-title{display:block;width:100%;border:0;background:none;padding:2px 0 0;text-align:left;font-size:20px;line-height:25px;font-weight:700;color:var(--ink)}
.exb.complete .exb-title::after{content:" ✓";color:var(--ok)}
.exb-sub{font-size:13px;color:var(--mute);margin-top:2px}
.exb-head .ibtn{margin:-8px -8px 0 0}
.exb-meta{display:grid;gap:8px;font-size:15px}
.exb-meta .mono{font-size:15px;color:var(--mute)}
.exb-meta .mono b{color:var(--ink);font-weight:600}
.exb-note{font-size:14px;color:var(--mute)}
.lvline{display:flex;flex-wrap:wrap;gap:6px;border:0;background:none;padding:0;text-align:left}
.lvline span{font-size:13px;padding:3px 8px;border-radius:6px;background:var(--lv-lo);color:var(--ink)}
.lvline span.hi{background:var(--lv-hi)}
.lvline span.mid{background:var(--lv-mid)}
.lvline b{font-family:var(--round);font-weight:700}
.lvline .more{color:var(--mute)}
.hint{display:flex;gap:8px;align-items:center;font-size:14px;border-radius:10px;padding:8px 10px}
.hint.up{background:var(--ok-soft)}
.hint svg{flex:none;color:var(--ok)}
.log{display:grid}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1.1fr) minmax(0,.9fr) 52px;gap:6px;align-items:center;padding:4px 0;border-top:.5px solid var(--sep)}
.row.head{border-top:0;padding:0 0 4px;font-size:12px;font-weight:600;color:var(--mute);text-align:center}
.row.head > :first-child{text-align:left}
.row .n{font-family:var(--round);font-size:15px;font-weight:600;color:var(--mute);display:flex;align-items:center}
.row.done .n{color:var(--ok)}
.pr{display:inline-grid;place-items:center;color:var(--acc)}
.row .prev{font-family:var(--round);font-size:14px;color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input[type=text]{width:100%;min-width:0;height:40px;background:var(--fill2);border:1.5px solid transparent;border-radius:10px;padding:0 2px;font:600 18px var(--round);text-align:center}
.row.done input[type=text]{background:var(--ok-soft)}
.row.cur input[type=text]{border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.row input[type=text]:focus{border-color:var(--acc);background:var(--card);outline:0}
.row input::placeholder{color:var(--mute);opacity:.55;font-weight:500}
.q{height:40px;border:0;background:var(--fill2);border-radius:10px;font:600 16px var(--round);color:var(--mute)}
.q.q0{background:var(--red);color:#fff}
.q.q1{background:var(--warn-soft);color:var(--ink)}
.q.q2{background:var(--acc-soft);color:var(--ink)}
.q.q4{background:var(--fill);color:var(--ink)}
.q.open{outline:2px solid var(--acc)}
.qpick{display:grid;gap:8px;padding:10px;margin:4px 0 6px;background:var(--fill2);border-radius:12px}
.qpick-t{font-size:15px}
.qpick-t span{color:var(--mute)}
.qpick-b{display:flex;gap:6px}
.qpick-b button{flex:1;min-width:0;height:44px;border:0;border-radius:10px;background:var(--card);font:600 17px var(--round)}
.qpick-b button.on{background:var(--acc);color:var(--acc-ink)}
.qpick-b button.q0.on{background:var(--red);color:#fff}
.qpick-b .clr{flex:none;padding:0 10px;font:500 15px var(--font);color:var(--mute);background:transparent}
.exb-add{display:flex;gap:8px}
.exb-add .btn:not(.wide){width:44px;padding:0;flex:none}
.notebtn{display:flex;align-items:flex-start;gap:6px;border:0;background:none;padding:2px 0 4px;color:var(--mute);font-size:15px;text-align:left;width:100%}
.notebtn svg{flex:none;margin-top:3px}
.notebtn.has{color:var(--ink)}
.notebtn.has span{white-space:pre-wrap}
.noteedit{width:100%;background:var(--fill2);border:0;border-radius:10px;padding:10px 12px;font-size:15px;min-height:42px;resize:none;overflow:hidden}
.noteedit:focus{outline:2px solid var(--acc)}
.addex{margin-top:2px}
.applied{margin-top:14px;background:var(--acc-soft);border-radius:var(--rc);padding:12px 14px;font-size:15px}
.applied ul{margin:6px 0 2px;padding-left:18px;display:grid;gap:3px}

/* итог */
.finish{display:grid;gap:12px;margin-top:28px}
.finish h2{font-size:22px;font-weight:700;margin:0 4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--card);border-radius:14px;padding:10px 12px;display:grid;gap:2px;box-shadow:var(--shadow)}
.stats span{font-size:13px;color:var(--mute)}
.stats b{font:700 24px var(--round)}
.stats small{font-size:14px;color:var(--mute);font-weight:600}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--card);border-radius:var(--rc);padding:14px;box-shadow:var(--shadow)}
.form label,.adform label{display:grid;gap:4px;font-size:13px;color:var(--mute);min-width:0}
.form input,.adform input[type=text]{background:var(--fill2);border:0;border-radius:10px;padding:10px 12px;font-size:17px;width:100%;min-width:0}
.form textarea,textarea{width:100%;background:var(--fill2);border:0;border-radius:10px;padding:10px 12px;font-size:16px;resize:vertical;min-height:44px}
.form .full,.adform .full{grid-column:1/-1}
.adform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.corr{display:grid;gap:10px}
.corr h3{margin:8px 4px 0}
.corr-item{align-items:flex-start;cursor:pointer}
.corr-item > span{display:grid;gap:2px;flex:1;min-width:0}
.corr-item small{color:var(--mute);font-size:14px}
.corr-item input{width:22px;height:22px;margin-top:1px;accent-color:var(--acc)}
.corr-day{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.review{display:grid;gap:10px}
.sum{background:var(--card);border-radius:var(--rc);padding:16px;display:grid;gap:8px;min-width:0;box-shadow:var(--shadow)}
.rich{display:grid;gap:6px;min-width:0;overflow-wrap:anywhere;font-size:16px;line-height:1.4}
.rich h4{font-size:17px;font-weight:700;margin:10px 0 0}
.rich h4:first-child{margin-top:0}
.rich p,.rich ul,.rich ol{margin:0}
.rich ul,.rich ol{padding-left:20px;display:grid;gap:4px}
.rich li::marker{color:var(--acc)}
.rich code{font-family:var(--round);background:var(--fill);padding:1px 5px;border-radius:5px}

/* шторки снизу */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:640px;max-height:calc(100% - 40px);border-radius:14px 14px 0 0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:8px 6px 6px 18px;position:relative}
.sheet-head::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--sep)}
.sheet-head b{font-size:17px;font-weight:600;margin-right:auto;padding-top:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-head .ibtn{margin-top:8px}
.sheet-foot{display:flex;gap:8px;align-items:flex-end;padding:6px 16px 10px}
.sheet-foot textarea{flex:1;min-width:0;background:var(--card)}
.sheet-body{overflow-y:auto;padding:6px 16px 22px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start}
.menu{display:grid;background:var(--card);border-radius:12px;overflow:hidden}
.mitem{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:12px 16px;text-align:left;font-size:17px;min-height:48px;color:var(--ink)}
.mitem + .mitem{border-top:.5px solid var(--sep)}
.mitem svg{flex:none;color:var(--acc)}
.mitem.danger{color:var(--red)}.mitem.danger svg{color:var(--red)}
.own{display:flex;gap:8px}
.own input{flex:1;min-width:0;background:var(--card);border:0;border-radius:10px;padding:0 12px;height:44px;font-size:17px}
.chk{display:flex;gap:10px;align-items:center;font-size:16px}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
.lv{display:grid;background:var(--card);border-radius:12px;overflow:hidden}
.lvg{font-size:13px;font-weight:600;color:var(--mute);padding:12px 16px 6px;background:var(--sheet)}
.lvrow{display:grid;grid-template-columns:minmax(0,1fr) 36px 30px 36px 72px;align-items:center;gap:4px;padding:5px 10px 5px 16px;border-top:.5px solid var(--sep);font-size:16px;background:var(--card)}
.lvg + .lvrow{border-top:0}
.lvrow.hi{background:var(--lv-hi)}.lvrow.mid{background:var(--lv-mid)}
.lvrow:not(.hi):not(.mid):not(.lo) .lvn{color:var(--mute)}
.lvn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvb{width:36px;height:34px;display:grid;place-items:center;border:0;background:var(--fill);border-radius:17px;color:var(--ink)}
.lvb:disabled{opacity:.3}
.lvv{font:700 17px var(--round);text-align:center}
.lvc{font-size:13px;color:var(--mute);text-align:right}
.lvtotal{display:flex;justify-content:space-between;padding:12px 16px;border-top:.5px solid var(--sep);font-size:15px}
.lvtotal b{font-family:var(--round)}
.chat{display:grid;gap:10px}
.msg{border-radius:18px;padding:10px 14px;max-width:88%;min-width:0;font-size:16px}
.msg.user{justify-self:end;background:var(--acc);color:var(--acc-ink);white-space:pre-wrap}
.msg.assistant{justify-self:start;background:var(--card)}
.hist-chart{display:grid;gap:4px;background:var(--card);border-radius:12px;padding:14px}
.hist-top{display:flex;justify-content:space-between;align-items:baseline}
.hist-top b{font-size:28px}
.hist-chart .spark{width:100%;height:auto}
.hist-ax{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.hrow{justify-content:space-between}
.hbest{font-size:17px;font-weight:700;color:var(--acc)}

/* неделя */
.bars{display:grid;gap:8px;margin-top:14px;padding:16px;background:var(--card);border-radius:var(--rc);box-shadow:var(--shadow)}
.bgroup{font-size:13px;font-weight:600;color:var(--mute);margin-top:8px}
.bgroup:first-child{margin-top:0}
.bar{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 58px;gap:10px;align-items:center;font-size:15px}
.bl{line-height:1.2}
.track{position:relative;height:10px;background:var(--fill);border-radius:5px;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;display:block;border-radius:5px}
.track .zone{background:color-mix(in srgb,var(--grn) 22%,transparent);border-radius:0}
.track .planb{background:color-mix(in srgb,var(--mute) 45%,transparent);height:4px;top:3px}
.track .factb{background:var(--acc)}
.track .factb.ok{background:var(--grn)}
.bv{text-align:right;font-family:var(--round);font-size:14px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin-top:6px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:4px}
.legend .planb{background:color-mix(in srgb,var(--mute) 45%,transparent)}
.legend .factb{background:var(--grn)}
.legend .zone{background:color-mix(in srgb,var(--grn) 25%,transparent)}
.tbl{overflow-x:auto;margin-top:14px;background:var(--card);border-radius:var(--rc);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font:500 14px var(--round);font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:.5px solid var(--sep)}
th:first-child,td:first-child{text-align:left;font-family:var(--font)}
th{color:var(--mute);font:600 12px var(--font)}
th .plate{width:9px;height:9px;margin-right:5px}
tr:last-child td{border-bottom:0}
td.dir{font-weight:700}td.mute{color:var(--mute)}td.ok{color:var(--ok);font-weight:700}td.low{color:var(--warn);font-weight:700}
tfoot td{font-weight:700;background:var(--fill2)}
.note{color:var(--mute);font-size:14px;margin:10px 4px 0}

/* история тренировок */
.list{display:grid}
.home .list{display:grid}
.sess{background:var(--card);border-radius:var(--rc);margin-bottom:10px;box-shadow:var(--shadow)}
.sess summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;gap:3px}
.sess summary::-webkit-details-marker{display:none}
.sess .d{display:flex;align-items:center;gap:8px;font-weight:600}
.sess .s{color:var(--mute);font-size:14px;padding-left:20px}
.sess .body{padding:0 16px 16px 36px;display:grid;gap:10px;font-size:15px}
.sess .body .mono{font-size:14px;color:var(--mute)}

/* нижняя панель вкладок, таймер, всплывашка */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:12;display:grid;grid-template-columns:repeat(5,1fr);background:var(--tab);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:2px;color:var(--mute);font-size:10.5px;font-weight:500;min-width:0}
.tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar button[aria-selected="true"]{color:var(--acc)}
.tb-ask{color:var(--mute)}
.tb-ask-i{display:grid;place-items:center;color:var(--acc)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:grid;grid-template-columns:minmax(0,1fr);margin-inline:-16px}
.timer{display:flex;align-items:center;gap:10px;justify-content:center;padding:8px 16px;background:var(--acc);color:var(--acc-ink)}
.timer .t{font:700 22px/1 var(--round);min-width:64px;text-align:center}
.timer .l{flex:1;font-size:14px;opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer button{display:grid;place-items:center;background:rgba(0,0,0,.14);border:0;color:inherit;border-radius:15px;height:30px;padding:0 10px;font:600 14px var(--round)}
.timer.done{background:#1F7F49;color:#fff}
.toast{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--inv);padding:10px 16px;font-size:15px}
.toast button{background:transparent;border:0;color:var(--acc);font-weight:600;font-size:15px;padding:6px 0;white-space:nowrap}

/* фокус: одно упражнение, крупные цифры */
.focus{display:grid;gap:12px}
.fhead{display:flex;align-items:center;gap:8px;padding-top:16px}
.fday{display:flex;align-items:center;gap:8px;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;flex-wrap:wrap}
.fday span{font-size:28px;font-weight:700;line-height:34px}
.fday small{width:100%;font-size:14px;color:var(--mute)}
.fday .plate{width:14px;height:14px}
.fpanel{display:grid;gap:10px;padding:14px;background:var(--card);border-radius:var(--rc)}
.fprog{display:flex;gap:4px}
.fprog button{position:relative;height:6px;border:0;padding:0;border-radius:3px;background:var(--fill);overflow:hidden;min-width:8px}
.fprog button i{position:absolute;left:0;top:0;bottom:0;background:var(--grn)}
.fprog button[aria-selected="true"]{background:color-mix(in srgb,var(--acc) 30%,var(--fill))}
.stage{display:grid;gap:16px;background:var(--card);border-radius:22px;padding:16px 14px 12px;box-shadow:var(--shadow);transition:opacity .25s var(--ease)}
.stage.dim{opacity:.5}
.st-top{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:start}
.st-name{text-align:center;min-width:0}
.st-name small{color:var(--mute);font-size:13px}
.st-name h2{margin:2px 0 0;font-size:22px;line-height:28px;font-weight:700;overflow-wrap:anywhere}
.st-acts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.st-acts button{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border:0;border-radius:17px;background:var(--fill);color:var(--acc);font-size:15px;font-weight:600}
.st-meta{display:grid;justify-items:center;gap:8px;text-align:center}
.tgt{font-size:15px;color:var(--mute)}
.tgt b{color:var(--ink);font-family:var(--round)}
.setno{text-align:center;color:var(--mute);font-size:16px}
.setno .big{font-size:28px;color:var(--ink)}
.stps{display:grid;gap:10px}
.stp{display:grid;gap:4px;background:var(--fill2);border-radius:18px;padding:10px}
.stp-l{font-size:13px;color:var(--mute);text-align:center}
.stp-row{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:8px;align-items:center}
.stp-b{width:56px;height:56px;border:0;border-radius:28px;background:var(--card);color:var(--acc);display:grid;place-items:center;transition:transform .1s var(--ease)}
.stp-b:active{transform:scale(.92)}
.stp-v{border:0;background:none;display:flex;align-items:baseline;justify-content:center;gap:6px;min-width:0;padding:0}
.stp-v .big{font-size:60px;line-height:1}
.stp-v small{font-size:17px;color:var(--mute)}
.stp-in{width:100%;height:60px;text-align:center;font:700 44px var(--round);background:var(--card);border:2px solid var(--acc);border-radius:14px}
.plates{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;font-size:13px;color:var(--mute);margin-top:-2px}
.plates span{margin-right:2px}
.pl{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:6px;font:700 12px var(--round);font-style:normal;color:#fff;background:#8E8E93}
.pl.p25{background:var(--p-red)}.pl.p20{background:var(--p-blue)}.pl.p15{background:var(--p-yellow);color:#000}.pl.p10{background:var(--p-green);color:#000}
.qrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;background:var(--fill);border-radius:9px;padding:2px;align-items:center}
.qrow span{grid-column:1/-1;font-size:13px;color:var(--mute);text-align:center;padding:4px 0 2px}
.qrow button{height:34px;border:0;background:transparent;border-radius:7px;font:600 16px var(--round)}
.qrow button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.qrow button.on.q0{background:var(--red);color:#fff}
.fwas{text-align:center;font-size:14px;color:var(--mute)}
.fbtn{min-height:50px;border:0;background:var(--fill);color:var(--ink);border-radius:25px;padding:0 18px;font-size:17px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.fbtn.main{background:var(--acc);color:var(--acc-ink)}
.fbtn.wide{width:100%}
.hero{width:100%;min-height:56px;border-radius:28px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip-s{min-width:54px;height:46px;border:0;background:var(--fill2);border-radius:12px;display:grid;align-content:center;justify-items:center;padding:0 8px;color:var(--mute)}
.chip-s small{font-size:11px}
.chip-s span{font:600 14px var(--round)}
.chip-s.ok{background:var(--ok-soft);color:var(--ink)}
.chip-s.ok small{color:var(--ok)}
.chip-s.cur{box-shadow:inset 0 0 0 2px var(--acc);color:var(--ink)}
.chip-s.add{min-width:44px;color:var(--acc)}
.st-nav{display:flex;justify-content:space-between;border-top:.5px solid var(--sep);padding-top:4px}
.st-nav .btn{background:transparent}
.rest{display:grid;justify-items:center;gap:12px;background:var(--card);border-radius:22px;padding:18px 14px 14px;box-shadow:var(--shadow)}
.ring{position:relative;width:min(62vw,230px);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:16}
.ring-bg{stroke:var(--acc-track)}
.ring-fg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rest.over .ring-fg{stroke:var(--grn)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;justify-items:center}
.ring-c .big{font-size:60px;line-height:1}
.ring-c span{color:var(--mute);font-size:15px}
.rest-next{display:grid;justify-items:center;gap:2px;text-align:center}
.rest-next span{font-size:13px;color:var(--mute)}
.rest-next b{font-weight:600}
.rest-act{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px;width:100%}
.flist{display:grid;background:var(--card);border-radius:var(--rc);overflow:hidden}
.flist > .btn{margin:8px}
.fl-row{display:flex;align-items:center;gap:4px;border-bottom:.5px solid var(--sep)}
.fl-row.cur{background:var(--acc-soft)}
.fl-main{flex:1;min-width:0;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;border:0;background:none;padding:12px 4px 12px 16px;text-align:left;font-size:16px}
.fl-main small{color:var(--mute);font:600 13px var(--round)}
.fl-main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl-main b{font:600 15px var(--round);color:var(--mute)}
.fl-row.done .fl-main b{color:var(--ok)}
.fend{display:grid;gap:4px}
@media (max-width:370px){.stp-row{grid-template-columns:48px minmax(0,1fr) 48px}.stp-b{width:48px;height:48px}.stp-v .big{font-size:50px}.row{grid-template-columns:26px minmax(0,1fr) minmax(0,1.1fr) minmax(0,.9fr) 46px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* правки вёрстки на узком экране */
.wk,.focus,.home,.exlist,.finish{grid-template-columns:minmax(0,1fr)}
.wk-name h1{font-size:28px;line-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-top .btn{min-height:36px;padding:0 14px;font-size:15px;flex:none}
.musbtn{height:36px;padding:0 10px}
.days button{gap:5px;padding:4px 2px}
.days .plate{width:8px;height:8px}
.plist li span:first-child{min-width:0}
.plist li .num{white-space:nowrap;flex:none}
.exb-add .btn.wide{font-size:16px;white-space:nowrap;padding:0 12px}
.st-acts{gap:6px}
.st-acts button{font-size:14px;padding:0 10px;height:32px}
@media (max-width:380px){.days .plate{display:none}}
/* шапка как в iOS: кнопки строкой сверху справа, крупный заголовок под ними */
.wk-top{flex-wrap:wrap;row-gap:4px}
.wk-top > .wk-name{order:3;flex:1 1 100%}
.wk-top > .musbtn{margin-left:auto}
.wk-name h1{font-size:34px;line-height:41px}
.exb,.stage,.rest,.card,.sum,.form{grid-template-columns:minmax(0,1fr)}
.st-nav .btn{font-size:15px;padding:0 6px;white-space:nowrap;min-height:40px}
.topbar{margin-inline:-8px;padding-top:6px;gap:6px}
.toast{border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 8px 28px rgba(0,0,0,.18);margin:0 8px}
.timer{border-radius:14px;margin:0 8px}
.exb-add .btn.wide{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){.exb-add .btn.wide{font-size:15px;padding:0 10px}}

/* ===== v2: точно по макету «Дневник тренировок — Fitness» ===== */
.card.week-card{grid-template-columns:auto minmax(0,1fr)}
.viewseg{max-width:240px;margin:14px auto 0}
.viewseg button{min-height:30px;font-size:13px}

/* навигация и заголовок */
.navrow{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-top:6px}
.navback,.navlink{display:inline-flex;align-items:center;gap:2px;border:0;background:none;padding:6px 0;color:var(--acc);font-size:17px}
.navlink{font-weight:600;padding-left:14px}
.navright{display:flex;align-items:center}
.ttl{display:grid;gap:2px;margin:2px 0 14px}
.ttl-b{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;color:var(--ink);justify-self:start}
.ttl-b h1{font-size:34px;line-height:41px}
.ttl-b svg{color:var(--mute);margin-top:4px}
.ttl-s{font-size:15px;color:var(--mute)}
.segs{display:flex;gap:4px;margin-bottom:16px}
.segs button{position:relative;flex:1;height:5px;border:0;padding:0;border-radius:3px;background:var(--fill);overflow:hidden}
.segs button i{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:3px}
.segs button[aria-selected="true"]{outline:2px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:2px}

/* карточка упражнения */
.fx{display:grid;grid-template-columns:minmax(0,1fr);padding-bottom:10px}
.xcard{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;background:var(--card);border-radius:20px;padding:18px 16px;box-shadow:var(--shadow)}
.x-top{display:flex;align-items:flex-start;gap:6px}
.x-top h2{flex:1;min-width:0;font-size:22px;line-height:28px;font-weight:700}
.x-top .ibtn{margin:-10px -10px 0 0}
.x-sub{font-size:15px;color:var(--mute);margin-top:-8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:-4px}
.tags span{font-size:13px;padding:3px 8px;border-radius:6px;background:var(--tile);color:var(--ink2)}
.tags span.hi{background:var(--acc-soft);color:var(--ink)}
.xacts{display:flex;gap:16px;margin-top:-6px}
.xacts button{border:0;background:none;padding:2px 0;color:var(--acc);font-size:15px;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:grid;justify-items:center;gap:6px;background:var(--tile);border-radius:16px;padding:12px 8px}
.tile-l{font-size:13px;color:var(--mute)}
.tile-v{display:flex;align-items:baseline;justify-content:center;gap:4px;border:0;background:none;padding:0;color:var(--ink);min-width:0}
.tile-v .big{font-size:48px;line-height:52px}
.tile-v small{font-size:17px;color:var(--mute)}
.tile-in{width:100%;height:52px;text-align:center;font:700 36px var(--round);background:var(--card);border:2px solid var(--acc);border-radius:12px;color:var(--ink)}
.tile-b{display:flex;gap:10px}
.round{width:44px;height:44px;border-radius:22px;border:0;background:var(--roundb);color:var(--ink);font-size:24px;line-height:1;display:grid;place-items:center;transition:transform .1s var(--ease)}
.round:active{transform:scale(.92)}
.plates{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;font-size:13px;color:var(--mute);margin-top:-4px}
.plates span{margin-right:4px}
.qwrap{display:grid;gap:8px}
.qwrap > span{font-size:13px;color:var(--mute)}
.seg5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--tile);border-radius:10px;padding:2px}
.seg5 button{height:32px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:500 15px var(--round)}
.seg5 button[aria-pressed="true"]{background:var(--roundb);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg5 button.q0[aria-pressed="true"]{background:var(--red);color:#fff}
.capsule{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:27px;background:var(--acc);color:var(--acc-ink);font-size:17px;font-weight:700;transition:transform .1s var(--ease)}
.capsule:active{transform:scale(.98)}

/* список подходов и «дальше» */
.setlist{display:grid;background:var(--card);border-radius:16px;margin-top:14px;overflow:hidden;box-shadow:var(--shadow)}
.sl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:transparent;padding:12px 16px;border-bottom:.5px solid var(--sep);color:var(--mute);font-size:15px;text-align:left}
.sl-row.cur{color:var(--ink)}
.sl-row b{font:600 17px var(--round);color:var(--mute)}
.sl-row b.ok{color:var(--ok)}
.sl-row b.now{color:var(--acc)}
.sl-act{display:flex;gap:18px;padding:10px 16px}
.sl-act button{border:0;background:none;padding:2px 0;color:var(--acc);font-size:15px;font-weight:500}
.nextrow{display:flex;align-items:center;gap:6px;margin:12px 0 6px}
.nav-i{width:36px;height:36px;border:0;border-radius:18px;background:var(--fill);color:var(--acc);display:grid;place-items:center;flex:none}
.nav-i:disabled{opacity:.3}
.nx{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border:0;background:none;padding:6px 4px;color:var(--mute);font-size:15px;text-align:left}
.nx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx small{font:500 15px var(--round);flex:none}
.fx .notebtn{padding-left:4px}

/* отдых — как экран «Отдых» в макете */
.rest2{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:22px;padding:4px 0 10px}
.rest2-t{justify-self:start;font-size:28px;font-weight:700}
.ring2{position:relative;width:min(72vw,280px);aspect-ratio:1}
.ring2 svg{width:100%;height:100%}
.ring2 circle{fill:none;stroke-width:22}
.ring2-bg{stroke:var(--acc-track)}
.ring2-fg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring2-fg.over{stroke:var(--grn)}
.ring2-c{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:2px}
.ring2-c .big{font-size:72px;line-height:76px}
.ring2-c span{font-size:15px;color:var(--mute)}
.nextcard{justify-self:stretch;display:grid;gap:4px;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.nextcard span,.nextcard small{font-size:13px;color:var(--mute)}
.nextcard small{font-size:15px}
.nextcard b{font-size:17px;font-weight:600}
.pair{justify-self:stretch;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{min-height:50px;border:0;border-radius:25px;background:var(--fill);color:var(--ink);font-size:17px;font-weight:600}
.foot-note{font-size:13px;color:var(--mute)}

/* итог — как экран «Итог» в макете */
.finish{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:6px}
.exlist + .finish{margin-top:30px}
.sumhead{display:flex;align-items:center;gap:16px}
.sumhead h2{font-size:28px;line-height:34px;font-weight:700}
.sumhead .mute{font-size:15px}
.tiles4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles4 div{display:grid;gap:2px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.tiles4 span{font-size:13px;color:var(--mute)}
.tiles4 b{font-size:28px;line-height:34px}
.tiles4 b small{font-size:17px;color:var(--mute);font-weight:600}
.tiles4 .acc{color:var(--acc)}.tiles4 .grn{color:var(--grn)}
.finish .stats{display:none}

/* сгруппированные строки (настройки в шторках) и «?» */
.grp{display:grid;background:var(--card);border-radius:12px;overflow:hidden}
.grp-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 16px;border:0;border-bottom:.5px solid var(--sep);background:transparent;font-size:17px;color:var(--ink);text-align:left;list-style:none;cursor:default}
.grp-row:last-child{border-bottom:0}
.grp-row.link{color:var(--acc);cursor:pointer}
.grp .days{margin:0 12px 12px}
details.grp summary{cursor:pointer;color:var(--acc)}
details.grp summary::-webkit-details-marker{display:none}
details.grp .form{box-shadow:none;border-radius:0;padding-top:4px}
.help{display:grid;gap:8px;justify-items:start}
.help-b{width:28px;height:28px;border-radius:14px;border:0;background:var(--fill);color:var(--acc);font-weight:700;font-size:15px}
.help-t{font-size:15px;color:var(--mute);background:var(--card);border-radius:12px;padding:10px 12px}
.save{justify-content:center;margin:8px 0 0}
.corr-item input{order:2;margin-left:auto}.corr h3{font-size:20px}

/* ===== v3: «Сводка» и «Неделя» по макету, панель из 4 вкладок ===== */
.tabbar{grid-template-columns:repeat(4,1fr);padding-top:8px}
.tabbar button{font-size:10px;font-weight:600}
.tb-ask{color:var(--mute)}
.home,.weekscr{display:grid;grid-template-columns:minmax(0,1fr);gap:0;padding-bottom:10px}
.large{padding:30px 4px 14px}
.home .card,.weekscr .card{margin-bottom:0}
.today{gap:14px}
.today-txt b{font-size:22px;line-height:28px;font-weight:700}
.today-txt span{font-size:15px;color:var(--mute)}
.today-txt small{font-size:13px;color:var(--mute)}
.plist li span:first-child{flex:1}
.sec{margin:28px 4px 8px}
.card.week-card{display:flex;align-items:center;gap:18px;padding:16px}
.ringlegend{gap:10px}
.ringlegend dt{font-size:15px;font-weight:600;color:var(--ink)}
.ringlegend dd{font-size:22px;line-height:26px;font-weight:700}
.card.prog{gap:8px;padding:14px 16px}
.prog-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.prog-n{display:flex;align-items:baseline;gap:4px}
.prog-n .big{font-size:34px;line-height:40px}
.prog-n span{font-size:17px;color:var(--mute)}
.lrow .plate{width:12px;height:12px}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--fill);border-radius:9px;padding:2px;margin-bottom:16px}
.seg3 button{min-height:30px;border:0;border-radius:7px;background:transparent;font-size:13px;color:var(--ink)}
.seg3 button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card.eff{gap:12px}
.effg{display:grid;gap:8px}
.effg-t{font-size:12px;font-weight:600;color:var(--mute)}
.effr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 48px;align-items:center;gap:10px;font-size:15px}
.effr > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.effb{position:relative;height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.effb i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.effr b{text-align:right;font-size:15px;font-weight:600}
.efflg{display:flex;gap:16px;font-size:13px;color:var(--mute)}
.efflg span{display:flex;align-items:center;gap:6px}
.efflg i{width:10px;height:10px;border-radius:5px}
.card.tip{display:flex;gap:12px;align-items:flex-start;margin-top:14px}
.tip-i{color:var(--acc);flex:none}
.tip-b{display:grid;gap:4px}
.tip-b b{font-size:15px;font-weight:600}
.tip-b span{font-size:15px;color:var(--ink2)}
.softbtn{justify-self:start;margin-top:4px;height:34px;padding:0 14px;border-radius:17px;border:0;background:var(--acc-soft);color:var(--acc);font-size:15px;font-weight:600}
.weekscr details.grp{margin-top:14px}
.weekscr details .bars,.weekscr details .tbl{box-shadow:none;margin:0 12px 12px}
.weekscr details .meta,.weekscr details h3,.weekscr details .review,.weekscr details .note{margin-inline:12px}
.ttl h1{font-size:34px;line-height:41px}
.effr{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 44px}.effr > span:first-child{white-space:normal;line-height:1.2}

/* ===== v4: точно по макету — размеры, отступы, заливка акцента ===== */
.capsule,.btn.primary,.cta{background:var(--accf)}
.ring2-fg,.ring-fg,.segs button i{stroke:var(--accf)}
.segs button i{background:var(--accf)}
:root[data-view="train"] body{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.navrow{margin-top:10px}
.ttl{margin:0 0 16px}
.ttl-b h1{font-size:34px;line-height:41px;font-weight:700}
.segs{margin-bottom:16px}
.segs button[aria-selected="true"]{outline:0}
.segs button.on{background:var(--acc-track)}
.xcard{gap:16px}
.x-sub{margin-top:-10px}
.tags{border:0;background:none;padding:0;margin-top:-10px;text-align:left;color:inherit;cursor:pointer}
.tags span.hi{background:var(--acc-soft);color:var(--ink)}
.tile-l i{font-style:normal}
.setlist{margin-top:16px}
.sl-row{padding:11px 16px}
.sl-act{padding:8px 16px}
.sl-act button{font-size:13px}
.fx > .nx{width:100%;padding:16px 4px 4px}
.fx .notebtn{margin-top:4px}
.days.two{grid-template-columns:repeat(2,minmax(0,1fr))}

/* отдых */
.rest2{gap:28px;padding:0 8px 16px}
.rest2 > .navrow{justify-self:stretch;margin-top:10px}
.nav-note{font-size:15px;color:var(--mute)}
.rest2-t{margin:0}
.ring2{width:min(72vw,280px)}

/* итог */
.finish{gap:18px}
.finish .corr{gap:8px}
.finish .corr h3{font-size:20px;line-height:24px;font-weight:700;margin:0 4px}
.finish .corr .menu{border-radius:16px}
.corr-item{align-items:center;padding:12px 16px}
.corr-item b{font-size:15px;font-weight:600}
.corr-item small{font-size:13px}
.finish .row-actions{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.finish .row-actions .btn{width:100%;min-height:50px;border-radius:25px;font-size:17px}
.finish .row-actions .btn.primary{min-height:54px;border-radius:27px;font-weight:700}
.finish .review .btn.primary{background:var(--fill);color:var(--ink);font-weight:600;min-height:50px}
.finish .review .btn:not(.primary){background:none;min-height:36px;font-size:15px;font-weight:500}
.finish .corr .btn:not(.primary){background:var(--fill);color:var(--ink)}
.effmore{justify-self:start;font-size:15px}
.effr{grid-template-columns:112px minmax(0,1fr) 48px}.effr > span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segs button.on{background:color-mix(in srgb,var(--accf) 45%,var(--fill))}
.finish .corr .row-actions .btn:not(.primary){background:none;color:var(--acc);min-height:36px;font-size:15px;font-weight:500}
.effr > span:first-child{white-space:normal;overflow:visible;line-height:1.2}

/* ===== v5: переключатель вида, пять вкладок, итог ===== */
:root[data-view="train"] body{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.vswitch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--fill);border-radius:12px;padding:3px;margin-top:16px}
.vswitch button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--ink);font-size:15px;font-weight:500}
.vswitch button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.vswitch button svg{color:var(--mute)}
.vswitch button[aria-pressed="true"] svg{color:var(--acc)}
.ttl + .vswitch{margin:0 0 4px}
.tabbar{grid-template-columns:repeat(5,minmax(0,1fr));align-items:end}
.tabbar .tb-ask{color:var(--ink);font-weight:600}
.tb-ask-i{display:grid;place-items:center;width:52px;height:52px;margin-top:-22px;border-radius:26px;background:var(--accf);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accf) 45%,transparent),0 0 0 4px var(--bg)}
.large .ttl-s{display:block;margin-top:2px}
/* перенос: кнопка внутри блока */
.corr-card .corr-item{border-bottom:.5px solid var(--sep)}
.corr-foot{display:grid;gap:6px;padding:12px 16px 14px;justify-items:center}
.corr-foot .btn.primary{width:100%;min-height:50px;border-radius:25px;font-size:17px;font-weight:700}
.corr-foot .linkbtn{font-size:15px;padding:6px 0}
/* кнопки в конце итога — как плитки, белый текст */
.finish .review .row-actions .btn,.finish details.more > summary{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:54px;padding:12px 14px;border-radius:16px;background:var(--card);color:var(--ink);font-size:17px;font-weight:600;box-shadow:var(--shadow);text-align:left}
.finish .review .row-actions .btn{justify-content:center}
.finish .review .row-actions .btn svg{color:var(--acc)}
.finish details.more{background:transparent;overflow:visible}
.finish details.more > summary svg{color:var(--mute);transition:transform .2s}
.finish details.more[open] > summary svg{transform:rotate(180deg)}
.finish details.more[open] > summary{border-radius:16px 16px 0 0}
.finish details.more .form{background:var(--card);border-radius:0 0 16px 16px}
/* подробно по дням: таблица листается вбок */
.weekscr details.grp{display:block;min-width:0;max-width:100%}
.weekscr details .tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:calc(100% - 24px)}
.weekscr details .tbl table{min-width:max-content}
.weekscr details .tbl th:first-child,.weekscr details .tbl td:first-child{position:sticky;left:0;z-index:1;background:var(--card)}

/* ===== v6 ===== */
.ttl + .vswitch{margin:0 0 16px}
.navrow + .vswitch{margin:4px 0 12px}
.seg3{grid-template-columns:repeat(2,minmax(0,1fr))}
/* вкладки: «Тренировка» в центре, крупная */
.tabbar .tb-ask{color:var(--mute);font-weight:600}
.tb-main{color:var(--ink)!important;font-weight:600}
.tb-main-i{display:grid;place-items:center;width:54px;height:54px;margin-top:-24px;border-radius:27px;background:var(--accf);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--accf) 45%,transparent),0 0 0 4px var(--bg)}
.tb-main[aria-selected="true"] > span:last-child{color:var(--acc)}
/* итог: время редактируется, заметка — плитка во всю ширину */
.durtile{display:grid;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.durtile button,.durtile label{display:grid;gap:2px;border:0;background:none;padding:12px 14px;text-align:left;color:var(--ink)}
.durtile span{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mute)}
.durtile b{font-size:28px;line-height:34px}
.durtile b small{font-size:17px;color:var(--mute);font-weight:600}
.durtile input{width:100%;height:34px;border:0;border-radius:8px;background:var(--fill);padding:0 8px;font:700 24px var(--round);color:var(--ink)}
.notetile{display:grid;gap:4px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);margin-top:-8px}
.notetile span{font-size:13px;color:var(--mute)}
.notetile textarea{border:0;background:none;padding:0;resize:none;font-size:17px;line-height:1.35;color:var(--ink);min-height:46px;outline:0;field-sizing:content}
.notetile textarea::placeholder{color:var(--mute)}
/* неделя: «?» */
.weekscr details .help{margin:4px 12px 12px}
/* история: лента дат */
.dstrip{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.ds-day{flex:none;width:44px;display:grid;justify-items:center;gap:3px;border:0;background:none;padding:0;color:var(--mute);scroll-snap-align:start}
.ds-day.wk{margin-left:8px}
.ds-day small{font-size:11px;line-height:13px;min-height:13px}
.ds-m{font-weight:600;color:var(--ink)}
.ds-day b{display:grid;place-items:center;width:36px;height:36px;border-radius:18px;font:600 16px var(--round);color:var(--ink)}
.ds-day.on b{color:#fff}
.ds-day.today b{box-shadow:inset 0 0 0 2px var(--acc)}
.ds-day.on.today b{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.ds-k{font-weight:700;color:var(--ink)}
.ds-day:disabled{cursor:default;opacity:1}
.dlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin:4px 4px 16px}
.dlegend span{display:inline-flex;align-items:center;gap:6px}
main{display:flow-root}

/* ===== v7 ===== */
.ttl{grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px}
.ttl-s{grid-column:1/-1}
.ttl-b{gap:8px}
.ttl-chev{display:grid;place-items:center;width:28px;height:28px;border-radius:14px;background:var(--fill);color:var(--acc);margin-top:4px;flex:none}
.ttl-mus{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:0;border-radius:17px;background:var(--fill);color:var(--ink);font-size:15px;font-weight:600}
.ttl-mus svg{color:var(--acc)}
/* прогресс: дата под заголовком, меняется */
.large .datepick{position:relative;display:inline-flex;align-items:center;gap:6px;margin-top:4px;height:32px;padding:0 12px;border-radius:16px;background:var(--fill);font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.datepick svg{color:var(--acc)}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.today-back{display:block;margin-top:8px}
.large{display:grid;justify-items:start}
/* плитки «Вес» и «Замеры» как в итоге */
.bodytiles button{display:grid;gap:2px;justify-items:start;border:0;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;color:var(--ink)}
.bodytiles span{font-size:13px;color:var(--mute)}
.bodytiles b{font-size:28px;line-height:34px}
.bodytiles b small{font-size:17px;color:var(--mute);font-weight:600}
.bodytiles .bt-s{font-size:13px;color:var(--mute)}
/* итог: время с теми же отступами, «Разобрать» — акцентная */
.tiles4 .durtile{padding:0}
.finish .review .row-actions .btn{background:var(--accf);color:var(--acc-ink);font-weight:700;justify-content:center}
.finish .review .row-actions .btn svg{color:currentColor}

.lastw{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:14px;color:var(--mute);margin-top:-6px}
.lastw b{font-weight:500;color:var(--ink2)}
.lastw b.cur{font-weight:700;color:var(--ink)}

/* ===== v8 «violet»: по референсу дневника питания. Размеры — в pt, сняты с оригиналов 1284×2778 (ширина 428pt) ===== */
:root{
  --font:"Roboto",-apple-system,BlinkMacSystemFont,system-ui,sans-serif; --round:var(--font);
  --bg:#010101; --panel:#252137; --card:#1C1B21; --fill:#2F2C39; --fill2:#2A2833; --inner:#252236; --track:#434054; --pillbg:#454255;
  --chip:#282837; --chip-ink:#969DFF; --chip2:#2F2E36;
  --ink:#F3F6F9; --ink2:#C9C7D3; --mute:#9D99AD; --mute2:#757185; --lbl:#B4B4B4; --arrow:#575464; --grid:#484653;
  --acc:#8160FF; --accf:#8160FF; --fab:#8455E3; --acc-soft:#3D326B; --acc-track:#434054;
  --pink:#FF69B4; --blue:#779EFF; --teal:#01C4A2; --c-pink:#ED72B1; --c-yellow:#DFAB4E; --c-green:#97C15B;
  --g:20px;
}
html{background:var(--panel)}               /* зона под статус-баром — цветом шапки (отступ под вырез даёт оболочка артефакта) */
body{margin-block:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.25 var(--font);letter-spacing:0;padding-inline:var(--g);padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
:root[data-view="train"] body{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.num,.mono,.big{font-family:var(--font)}
h1,h2,h3,b,strong{font-weight:500}
:focus-visible{outline-color:var(--accf)}
.splash{font-family:var(--font)}

/* шапка: панель #252137, скруглена снизу (24pt); заголовок 22 Bold по центру */
.hero{display:grid;grid-template-columns:minmax(0,1fr);width:calc(100% + 2*var(--g));margin:0 calc(-1*var(--g));padding:6px var(--g) 22px;background:var(--panel);border-radius:0 0 28px 28px;min-height:0;font-size:16px}
.hero-nav{border-radius:0;padding-bottom:12px}
.hero-top{border-radius:0;padding-bottom:42px}
.appbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;gap:8px}
.appbar.left{display:flex;justify-content:space-between;min-height:48px}
.appbar h1,.ab-t b{margin:0;font-size:22px;line-height:28px;font-weight:700;letter-spacing:0}
.appbar.left h1{font-size:25px;line-height:30px}
.ab-side{display:flex;align-items:center;justify-self:start;min-width:0;margin-left:-6px}
.ab-side.r{justify-self:end;margin:0 -4px 0 0}
.ab-t{display:grid;justify-items:center;text-align:center;min-width:0}
button.ab-t{grid-template-columns:auto auto;column-gap:4px;align-items:center;border:0;background:none;padding:0;color:var(--ink)}
button.ab-t svg{grid-row:1;grid-column:2;color:var(--mute)}
.hero-nav .ab-t b{font-size:20px;line-height:26px;font-weight:500}
.ab-t small{grid-column:1/-1;font-size:16px;color:var(--ink);margin-top:2px}
.ab-coach{display:grid;place-items:center;width:40px;height:40px;border-radius:20px;border:2px solid #7C7A87;background:#1E1A2E;padding:0}
.ab-i{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:20px;background:none;color:var(--ink);padding:0}
.ab-i svg{width:24px;height:24px}
.ab-link{border:0;background:none;padding:6px 0;color:var(--acc);font-size:16px;font-weight:500}

/* дата: 20 Medium, стрелки #575464 */
.datenav{display:flex;align-items:center;justify-content:space-between;margin:14px -6px 18px}
.dn-a{display:grid;place-items:center;width:36px;height:36px;border:0;background:none;color:var(--arrow);padding:0}
.dn-a svg{width:24px;height:24px}
.dn-l{position:relative;font-size:20px;line-height:26px;font-weight:500;cursor:pointer}
.dn-l input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.today-back{justify-self:center;font-size:14px;margin-top:10px;color:var(--acc)}

/* слайды: кольцо 118 / линия 9, три колонки 20 + 16; полосы 8pt */
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -4px}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;min-width:0;scroll-snap-align:start;padding:0 4px}
.kpi{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.kcol{display:grid;justify-items:center;gap:2px}
.kcol b{font-size:20px;line-height:24px;font-weight:400}
.kcol span{font-size:16px;color:var(--ink)}
.kring{position:relative;width:118px;height:118px;border:0;background:none;padding:0;color:var(--ink)}
.kring svg{width:100%;height:100%}
.kring circle{fill:none;stroke-width:9}
.kr-bg{stroke:var(--track)}
.kr-fg{stroke:var(--accf);stroke-linecap:round;transition:stroke-dashoffset .4s var(--ease)}
.kring > span{position:absolute;inset:0;display:grid;place-content:center;justify-items:center}
.kring b{font-size:20px;line-height:24px;font-weight:400}
.kring small{font-size:16px;color:var(--ink)}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:28px -4px 0}
.tri-c{display:grid;justify-items:center;gap:8px;text-align:center;min-width:0}
.tri-c > span{font-size:16px;font-weight:500}
.tri-c b{font-size:16px;font-weight:500}
.tri-c b em,.pl2-h b em{font-style:normal;font-weight:400;color:var(--mute)}
.meter{position:relative;display:block;width:100%;height:8px;border-radius:4px;background:var(--fill)}
.hero .meter{background:var(--track)}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;max-width:100%}
.meter i.ex{background:var(--pink);z-index:1}
.meter em{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink2);opacity:.55}
.plist2{display:grid;gap:16px;align-content:start}
.pl2{display:grid;gap:10px}
.pl2-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:16px;font-weight:500}
.pl2-h > span{display:inline-flex;align-items:center;min-width:0}
.pl2-h b{font-size:16px;font-weight:500;white-space:nowrap}
.okdot,.efflg i.okdot{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--teal);margin-left:6px}
.efflg i.tick{width:2px;height:10px;border-radius:1px;background:var(--ink2);opacity:.55}
.dots{display:flex;justify-content:center;gap:9px;margin-top:18px}
.dots i{width:9px;height:9px;border-radius:5px;background:#7C7A87}
.dots i.on{background:#fff}

/* заголовок раздела: 20 Medium, шеврон белый */
.sec2{display:flex;align-items:center;gap:8px;width:100%;margin:34px 0 14px;padding:0;border:0;background:none;color:var(--ink);font-size:20px;line-height:26px;font-weight:500;text-align:left}
.sec2 > span:first-child{flex:1;min-width:0}
.sec2 > svg{color:var(--ink);width:24px;height:24px}
.tbadge,.sec2 .elapsed{font-style:normal;font-size:14px;line-height:23px;height:23px;font-weight:400;padding:0 10px;border-radius:12px;background:var(--fill);color:var(--acc);white-space:nowrap;font-variant-numeric:tabular-nums}
.sec2 .tbadge,.sec2 .elapsed{font-size:18px;line-height:29px;height:29px;min-width:77px;text-align:center;border-radius:8px;background:var(--card)}

/* плитки дней: 188×144, r16, поля 16; число 20, подпись 14 #757185 */
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.dtile{position:relative;display:grid;grid-template-rows:auto 1fr auto auto;justify-items:start;min-height:144px;padding:16px 16px 14px;border:0;border-radius:16px;background:var(--card);color:var(--ink);text-align:left;overflow:hidden}
.dt-h{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;font-size:16px;font-weight:500}
.dtile > b{grid-row:3;font-size:20px;line-height:24px;font-weight:500}
.dtile > small{grid-row:4;font-size:14px;color:var(--mute2)}
.dt-img{position:absolute;right:-12px;bottom:-14px;display:grid;place-items:center;width:72px;height:72px;border-radius:36px;color:rgba(255,255,255,.92);
  background:radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--c) 55%,#fff) 0,var(--c) 42%,color-mix(in srgb,var(--c) 45%,#000) 100%)}
.dt-img svg{transform:translate(-6px,-6px) rotate(-20deg)}
.home-cta{margin-top:18px}

/* кнопка-капсула 50pt, 16 Medium, поля 28 */
.capsule{min-height:50px;border-radius:25px;background:var(--accf);color:#fff;font-size:16px;font-weight:500;gap:8px}
.capsule.sm{min-height:40px;font-size:15px}
.home-cta,.addex{width:calc(100% - 16px);margin-inline:8px}
.btn.primary,.cta{background:var(--accf);color:#fff}
.btn{background:var(--fill);color:var(--ink);font-size:16px;font-weight:500;min-height:44px}
.btn.quiet{background:transparent;color:var(--acc)}
.linkbtn{color:var(--acc);font-weight:500}

/* карточка графика: как «Вес» в «Статистике» */
.ccard{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:16px;border-radius:20px;background:var(--card)}
.cc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:16px;font-weight:500}
.cc-h .mute{font-size:14px;font-weight:400}
.cc-s{font-size:16px;color:var(--mute)}
.lchart{width:100%;height:auto;display:block;margin-top:8px}
.lchart text{fill:var(--mute);font-size:10px;font-family:var(--font)}
.lchart .lc-v{fill:var(--ink);font-size:11px}

/* строки-карточки: 53pt, r16, иконка 22, текст 16, шеврон #575464 */
.rows{display:grid;gap:10px}
.mt8{margin-top:10px}
.rowc{display:flex;align-items:center;gap:14px;width:100%;min-height:53px;padding:10px 16px;border:0;border-radius:16px;background:var(--card);color:var(--ink);text-align:left;font-size:16px}
.rowc > svg:last-child{flex:none;color:var(--arrow)}
.rowc > svg:first-child{flex:none;color:var(--ink)}
.rc-i{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:16px;color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--accf)) 18%,transparent)}
.rc-i svg{width:18px;height:18px}
.rowc .lmain b{font-size:16px;font-weight:400}
.rowc .lmain small{font-size:14px;color:var(--mute)}

/* карточка «Вес» — как «Цели»: 16 Medium, 24 Bold, ячейки 62pt r12 с фиолетовой подписью */
.gcard{display:grid;gap:12px;width:100%;padding:18px 16px 16px;border:0;border-radius:20px;background:var(--card);color:var(--ink);text-align:left}
.gc-h{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:500}
.gc-h svg{color:var(--arrow);width:20px;height:20px}
.gc-v{font-size:24px;line-height:30px;font-weight:700}
.gc-r{display:flex;justify-content:space-between;gap:10px;font-size:16px;color:var(--mute);line-height:1.45}
.gc-r span:last-child{text-align:right}
.gc-r b{color:var(--ink);font-weight:500;font-size:16px}
.gc-cells{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc-cells > span{display:grid;gap:4px;padding:10px 12px;border-radius:12px;background:var(--fill)}
.gc-cells small{font-size:16px;font-weight:500;color:var(--acc)}
.gc-cells b{font-size:18px;font-weight:500}

/* «Неделя» — как «Статистика»: заголовок 25 Bold слева, таблетка #454255 130×42 r10; чёрный лист скруглён сверху */
.pillsel{position:relative;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:10px;background:var(--pillbg);font-size:16px;font-weight:500;color:var(--ink)}
.pillsel svg:first-child{width:22px;height:22px}
.pillsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.blacksheet{display:grid;grid-template-columns:minmax(0,1fr);margin:-28px calc(-1*var(--g)) 0;padding:6px var(--g) 0;background:var(--bg);border-radius:24px 24px 0 0;position:relative}
.statline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 0 14px}
.statline b{font-size:18px;font-weight:500}
.statline span{font-size:16px;color:var(--lbl)}
.dbars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.dbar{display:grid;justify-items:center;gap:6px;min-width:0}
.db-t{position:relative;width:30px;height:120px;border-radius:8px;background:var(--fill);overflow:hidden}
.db-t i{position:absolute;left:0;right:0;bottom:0;border-radius:8px;background:var(--accf)}
.dbar b{font-size:14px;font-weight:500}
.dbar small{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mute);white-space:nowrap}
.dbar .plate{width:7px;height:7px}
.eff2{gap:18px}
.eff2 .effg{gap:14px}
.effg-t{font-size:14px;font-weight:500;color:var(--mute)}
.efflg{flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mute)}
.efflg span{display:inline-flex;align-items:center;gap:6px}
.efflg i{width:10px;height:6px;border-radius:3px}
.efflg i.okdot{margin-left:0}
.banner{display:grid;gap:12px;margin-top:18px;padding:16px;border-radius:20px;background:var(--card)}
.bn-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bn-h b{font-size:16px;font-weight:500}
.bn-h .ibtn{width:32px;height:32px;margin:-6px -6px -6px 0;color:var(--ink2)}
.banner > span{font-size:14px;color:var(--mute);line-height:1.4}
.weekscr details.grp{margin-top:12px;border-radius:16px;background:var(--card)}
.weekscr details.grp > summary{display:flex;justify-content:space-between;align-items:center;color:var(--ink);font-size:16px;min-height:53px}
.weekscr details.grp > summary > span{display:inline-flex;align-items:center;gap:14px}
.weekscr details.grp > summary svg{color:var(--arrow)}
.weekscr details[open] > summary > svg{transform:rotate(90deg)}
.bars,.tbl,.sum,.card,.menu,.grp,.lv,.form,.hist-chart{background:var(--card);border-radius:16px;box-shadow:none}
.weekscr details .bars,.weekscr details .tbl{background:var(--fill2)}
.track{background:var(--fill)}
.track .factb{background:var(--accf)}.track .factb.ok{background:var(--teal)}
th,td{border-bottom-color:var(--sep)}
tfoot td{background:var(--fill2)}

/* «Тренировка» — как «Завтрак»: навигация 20 Medium + дата 16; карточка-сводка r16 снизу; полоса 10pt */
.sumcard{display:grid;grid-template-columns:minmax(0,1fr);gap:0;margin:0 calc(-1*var(--g));padding:18px var(--g) 20px;background:var(--card);border-radius:0 0 18px 18px}
.th-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.th-h b{font-size:24px;line-height:30px;font-weight:700}
.th-h span{font-size:16px;color:var(--mute)}
.sumcard > .meter{height:10px;border-radius:5px;margin:16px 0 16px}
.sumcard > .meter i{border-radius:5px}
.sc-cells{display:grid;gap:8px;align-content:start}
.sc-cell{display:flex;align-items:center;justify-content:space-between;gap:8px;height:41px;padding:0 12px;border-radius:12px;background:var(--fill)}
.sc-cell span{font-size:14px;font-weight:500}
.sc-cell b{font-size:16px;font-weight:500}
.sc-cell .elapsed{color:var(--ink);font-variant-numeric:tabular-nums}
.c1{color:var(--c-pink)}.c2{color:var(--c-yellow)}.c3{color:var(--c-green)}
.sc-cells small{font-size:14px;color:var(--mute);margin-top:6px}
.th-mus{display:inline-flex;align-items:center;gap:6px;justify-self:start;margin-top:20px;font-size:14px;font-weight:500}
.vswitch,.ttl + .vswitch,.navrow + .vswitch{display:flex;gap:10px;margin:20px 0 0;padding:0;background:none;border-radius:0}
.vswitch button{flex:none;min-height:42px;padding:0 18px;border-radius:21px;background:var(--fill);color:var(--mute);font-size:16px;font-weight:500}
.vswitch button[aria-pressed="true"]{background:var(--accf);color:#fff;box-shadow:none}
.vswitch button svg,.vswitch button[aria-pressed="true"] svg{color:inherit}
.vswitch + .sec2,.applied + .sec2{margin-top:24px}
.exlist{gap:8px;margin-top:0}
/* карточка упражнения — как карточка продукта: r16, поля 14, название 16 Medium, строка 14 #9D99AD, чипы 12/18pt r6 */
.exb{gap:10px;padding:14px 14px 10px;border-radius:16px;background:var(--card);box-shadow:none}
.exb-title{font-size:16px;line-height:21px;font-weight:500}
.exb-head .ibtn{color:var(--arrow);width:36px;height:36px;margin:-6px -8px 0 0}
.exb-meta{gap:8px}
.exb-meta .mono{font-size:14px;color:var(--mute)}
.exb-meta .mono b{color:var(--mute);font-weight:400}
.lvline{gap:7px}
.lvline span{display:inline-flex;align-items:center;height:20px;font-size:12px;font-weight:500;padding:0 7px;border-radius:6px;background:var(--chip2);color:var(--mute)}
.lvline span.hi{background:var(--chip);color:var(--chip-ink)}
.lvline span.mid{background:var(--chip);color:var(--blue)}
.lvline b{font-family:var(--font);font-weight:500}
.row.head{font-size:12px;font-weight:400;color:var(--mute2)}
.row{border-top-color:#26252C}
.row input[type=text],.q{height:40px;border-radius:12px;background:var(--fill);font:500 16px var(--font)}
.row.done input[type=text]{background:var(--acc-soft)}
.row.cur input[type=text]{border-color:color-mix(in srgb,var(--accf) 60%,transparent)}
.row input[type=text]:focus{border-color:var(--accf);background:var(--fill2)}
.row .n,.row .prev{font-family:var(--font);font-weight:500}
.row.done .n{color:var(--acc)}
.q.q0{background:var(--pink);color:#fff}.q.q1{background:#3A1F33}.q.q2{background:var(--acc-soft)}.q.q4{background:var(--chip)}
.qpick{background:var(--fill2)}
.qpick-b button{background:var(--fill);font-family:var(--font);font-weight:500}
.qpick-b button.on{background:var(--accf);color:#fff}
.exb-add .btn{border-radius:22px}
.exb-add .btn.primary{color:#fff}
.hint.up{background:#123029}.hint svg{color:var(--teal)}
.notebtn{font-size:14px;color:var(--mute2)}
.addex{margin-top:18px}
.applied{background:var(--acc-soft);border-radius:16px;font-size:14px}
.finish{margin-top:28px}
.tiles4 div,.durtile,.notetile,.bodytiles button{background:var(--card);box-shadow:none;border-radius:16px}
.tiles4 span,.durtile span,.notetile span{font-size:14px}
.tiles4 b,.durtile b{font-size:24px;font-weight:700}
.tiles4 .acc{color:var(--acc)}.tiles4 .grn{color:var(--teal)}
.sumhead h2{font-size:22px;line-height:28px;font-weight:700}
.finish .review .row-actions .btn{background:var(--accf);color:#fff;border-radius:25px;min-height:50px;font-weight:500}
.finish details.more > summary{background:var(--card);font-weight:500}
.corr-foot .btn.primary{border-radius:25px;min-height:50px;color:#fff;font-weight:500}
.finish .corr h3,.finish h3,.corr h3{font-size:20px;line-height:26px;font-weight:500;margin:4px 0}
.corr-item b{font-size:16px;font-weight:500}.corr-item small{font-size:14px}

/* фокус и отдых */
.fx{gap:0}
.segs{margin:0 0 14px}
.segs button{height:6px;background:var(--fill)}
.segs button i{background:var(--accf)}
.segs button.on{background:var(--track)}
.xcard{gap:14px;padding:16px 14px;border-radius:16px;background:var(--card);box-shadow:none}
.x-top h2{font-size:18px;line-height:24px;font-weight:500}
.x-sub{font-size:14px;color:var(--mute);margin-top:-8px}
.tags span{display:inline-flex;align-items:center;height:20px;padding:0 7px;font-size:12px;font-weight:500;background:var(--chip2);color:var(--mute)}
.tags span.hi{background:var(--chip);color:var(--chip-ink)}
.tile{background:var(--fill);border-radius:12px}
.tile-l{font-size:14px}
.tile-v .big{font-size:40px;line-height:46px;font-weight:500}
.tile-in{background:var(--fill2);border-color:var(--accf);font-family:var(--font)}
.round{background:var(--track);color:var(--ink)}
.seg5{background:var(--fill);border-radius:12px}
.seg5 button{font-family:var(--font);font-weight:500}
.seg5 button[aria-pressed="true"]{background:var(--accf);color:#fff;box-shadow:none}
.seg5 button.q0[aria-pressed="true"]{background:var(--pink)}
.setlist{background:var(--card);border-radius:16px;box-shadow:none}
.sl-row{font-size:14px}.sl-row b{font:500 16px var(--font)}
.sl-row b.ok{color:var(--acc)}.sl-row b.now{color:var(--ink)}
.sl-act button,.xacts button{color:var(--acc);font-weight:500}
.nav-i{background:var(--fill);color:var(--ink)}
.nx{font-size:14px}
.rest2{gap:24px;padding:0 0 16px}
.rest2 > .hero{justify-self:stretch;width:auto;margin:0 calc(-1*var(--g))}
.ring2-bg{stroke:var(--track)}
.ring2-fg{stroke:var(--accf)}
.ring2-fg.over{stroke:var(--teal)}
.ring2 circle{stroke-width:14}
.ring2-c .big{font-size:60px;line-height:66px;font-weight:500}
.ring2-c span{font-size:16px}
.nextcard{background:var(--card);border-radius:16px;box-shadow:none}
.nextcard b{font-weight:500}
.pill{background:var(--fill);border-radius:25px;min-height:50px;font-size:16px;font-weight:500}
.lastw{font-size:14px}.lastw b.cur{color:var(--acc)}

/* «История»: лента дат в шапке */
.hero .dstrip{margin:8px calc(-1*var(--g)) 0;padding:4px var(--g) 8px}
.ds-day{color:var(--mute)}
.ds-day small{font-size:12px}
.ds-day b{font:500 16px var(--font)}
.ds-day.on.today b{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accf)}
.ds-day.on b{color:#111}
.hero .dlegend{margin:8px 0 0;font-size:14px;color:var(--ink)}

/* нижняя панель 64pt: иконки 26 #B4B4B4, активная #8160FF, «+» 52pt #8455E3 со свечением */
.tabbar{grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;height:auto;padding:6px 14px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.tabbar button{display:grid;place-items:center;height:52px;padding:0;color:var(--lbl)}
.tabbar button svg{width:26px;height:26px}
.tabbar button[aria-selected="true"]{color:var(--acc)}
.tb-fab > span{display:grid;place-items:center;width:52px;height:52px;border-radius:26px;background:var(--fab);color:#fff;box-shadow:0 6px 22px rgba(132,85,227,.45);transition:transform .25s var(--ease)}
.tb-fab > span svg{width:26px;height:26px;stroke-width:2.4}
.tb-fab.open > span{transform:rotate(45deg)}

/* шторки: чёрный лист, фиолетовая ручка, заголовок 20 Bold по центру; фон под шторкой затемнён */
.sheet-wrap{background:rgba(10,9,14,.82)}
.sheet-wrap.over-tabs{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.sheet-wrap.over-tabs .sheet{border-radius:24px 24px 0 0}
:root[data-quick="1"] .tabbar{z-index:41}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;box-shadow:none;padding-inline:4px}
.sheet-head{padding:10px 6px 4px 50px}
.sheet-head::before{top:8px;width:32px;height:4px;margin-left:-16px;border-radius:2px;background:var(--fab)}
.sheet-head b{flex:1;text-align:center;font-size:20px;font-weight:700;padding-top:18px}
.sheet-head .ibtn{color:var(--ink2);margin-top:14px}
.sheet-body{padding:14px var(--g) 22px}
.menu{background:none;gap:8px;border-radius:0;overflow:visible}
.mitem{min-height:53px;border-radius:16px;background:var(--card);font-size:16px}
.mitem + .mitem{border-top:0}
.mitem svg{color:var(--ink)}
.mitem.danger,.mitem.danger svg{color:var(--red)}
.grp-row{font-size:16px}
.days,.seg,.viewseg,.seg3{background:var(--fill);border-radius:12px}
.days button,.seg button{font-size:14px;font-weight:500;border-radius:10px}
.days button[aria-pressed="true"],.seg button[aria-pressed="true"],.viewseg button[aria-pressed="true"],.seg3 button[aria-pressed="true"]{background:var(--accf);color:#fff;box-shadow:none}
.form input,.adform input[type=text],.form textarea,textarea,.own input,input[type=date]{background:var(--fill);color:var(--ink);font-family:var(--font)}
.sheet-foot textarea{background:var(--card)}
.msg{font-size:15px}
.msg.user{background:var(--accf);color:#fff}
.msg.assistant{background:var(--card)}
.lvrow{background:var(--card)}.lvrow.hi{background:var(--lv-hi)}.lvrow.mid{background:var(--lv-mid)}
.lvg{background:var(--bg)}
.lvb{background:var(--fill)}
.help-b{background:var(--fill);color:var(--acc)}
.help-t{background:var(--card)}
.badge{background:var(--acc-soft);color:#D6CCFF}
/* «Быстрое добавление»: колонки 118pt, плитки r12 #1C1B21, мелкие 41pt, крупные 90pt, дни 55pt; текст 14 */
.qa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.qa-col{display:grid;gap:8px}
.qa-s{display:flex;align-items:center;gap:10px;min-height:41px;padding:0 12px;border:0;border-radius:12px;background:var(--card);color:var(--ink);font-size:14px}
.qa-s svg{width:20px;height:20px}
.qa-b{display:grid;justify-items:center;align-content:center;gap:12px;min-height:90px;border:0;border-radius:12px;background:var(--card);color:var(--ink);font-size:14px}
.qa-days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:4px}
.qa-d{display:flex;align-items:center;gap:12px;min-height:55px;padding:0 16px;border:0;border-radius:12px;background:var(--card);color:var(--ink);font-size:14px}
.qa-di{display:grid;place-items:center;width:28px;height:28px;border-radius:14px;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}

/* таймер и всплывашка */
.topbar{top:0}
.timer{background:var(--accf);color:#fff;border-radius:16px}
.timer.done{background:var(--teal);color:#062}
.timer .t{font-family:var(--font);font-weight:500}
.toast{background:var(--card);color:var(--ink);box-shadow:0 8px 28px rgba(0,0,0,.5);border-radius:16px}
.toast button{color:var(--acc)}

/* заставка: чёрный фон, фиолетовое свечение, белый жирный заголовок */
.splash{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,#8358FA 0,#6A3FE6 18%,rgba(90,45,200,.55) 34%,rgba(40,20,90,.25) 50%,#010101 68%);color:#fff;text-align:center;font-size:30px;line-height:1.05;font-weight:700}
/* подгонка по линейке к оригиналам (сравнение 1:1 при 428pt) */
.hero-nav{padding-bottom:17px}
.hero-top{padding-top:3px;padding-bottom:44px}
.appbar.left{min-height:42px}
.blacksheet > .statline:first-child{margin-top:16px}
.plist2{gap:9px}.pl2{gap:9px}
.sec2{margin-top:30px}
.lvline span,.tags span{display:inline-block;height:auto;line-height:20px}
.tri-c{gap:6px}.tri{margin-top:26px}
.dots{margin-top:11px}
.home > .hero{padding-bottom:16px}
.over-tabs .sheet-head .ibtn{visibility:hidden}
/* поле даты: на iPhone у системного поля своя минимальная ширина — убираем её, чтобы не вылезало за карточку */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.form label{min-width:0;overflow:hidden}
/* нижняя панель как в оригинале: 64pt под иконки + 34pt снизу (зона полоски «Домой»), всего 98pt */
.tabbar{padding:6px 14px max(40px,calc(6px + env(safe-area-inset-bottom,0px)))}
body,:root[data-view="train"] body{padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
.sheet-wrap.over-tabs{bottom:max(98px,calc(64px + env(safe-area-inset-bottom,0px)))}
.form input[type=date]{height:44px;padding:0 12px;border-radius:10px;font-size:17px}

/* ===== v9 «Блины» (см. DESIGN.md): цвета соревновательных блинов IWF, тёмная «резина» зала, Unbounded + Onest ===== */
:root{
  --font:"Onest",-apple-system,BlinkMacSystemFont,system-ui,sans-serif; --disp:"Unbounded","Onest",system-ui,sans-serif; --round:var(--font);
  --bg:#18181A; --panel:#18181A; --card:#222225; --fill:#2C2C30; --fill2:#29292D; --inner:#29292D; --track:#3A3A3F; --pillbg:#2C2C30;
  --chip:#2C2C30; --chip-ink:#F4F4F2; --chip2:#2C2C30; --sep:#2E2E33; --tab:#2C2C30;
  --ink:#F4F4F2; --ink2:#CFCFD2; --mute:#9A9A9F; --mute2:#96969B; --lbl:#9A9A9F; --arrow:#6C6C72; --grid:#3A3A3F;
  /* блины по цветам IWF: 20 синий, 15 жёлтый, 10 зелёный, 5 белый, 2,5 и 25 красный */
  --p-red:#D4363A; --p-blue:#2F6FDE; --p-yellow:#F2C230; --p-green:#2FA562; --p-white:#E6E6E3;
  --acc:#8FB2F2; --accf:#2F6FDE; --fab:#E03A3E; --acc-soft:#1F2A40; --acc-track:#3A3A3F;
  --sel:#F4F4F2; --sel-ink:#18181A;                 /* выбранное: белая таблетка, тёмный текст */
  --pink:#E03A3E; --blue:#8FB2F2; --teal:#2FA562; --red:#F0575B;
  --ok:#2FA562; --ok-soft:#173225; --warn:#F2C230; --warn-soft:#3A3217;
  --lv-hi:#3A2224; --lv-mid:#1F2A40; --lv-lo:#2C2C30;
  --grn:var(--p-green); --grn-track:var(--ok-soft); --tile:var(--fill); --roundb:var(--track); --sheet:var(--bg);
  --c-pink:#E03A3E; --c-yellow:#F2C230; --c-green:#2FA562;
}
html{background:var(--bg)}
body{font-family:var(--font)}
h1,h2,.appbar h1,.ab-t b,.sumhead h2,.big,.gc-v,.kring b,.kcol b,.tiles4 b,.durtile b,.th-h b,.sec2,.sheet-head b,.splash{font-family:var(--disp);letter-spacing:-.01em}
.big{font-weight:700}
:focus-visible{outline-color:var(--acc)}

/* шапка без панели: всё на фоне зала */
.hero{border-radius:0;padding-bottom:12px}
.appbar h1,.ab-t b{font-weight:700}
.hero-nav .ab-t b{font-size:19px;font-weight:700}
.ab-t small{font-size:14px;color:var(--mute)}
.ab-coach{border:0;background:var(--fill)}
.ab-i{background:var(--fill)}
.ab-link{color:var(--ink);background:var(--fill);border-radius:20px;padding:0 16px;height:40px;font-weight:600;font-size:14px}
.dn-a{color:var(--mute)}
.dots i{background:var(--track)}.dots i.on{background:var(--ink)}

/* сводка тренировки: счёт крупно, гриф с блинами */
.sumcard{margin:0;padding:4px 0 0;background:none;border-radius:0;gap:4px}
.th-h{justify-content:flex-start;gap:12px}
.th-h b{font-size:40px;line-height:44px;font-weight:800}
.th-h b em{font-style:normal;font-weight:500;color:var(--arrow)}
.th-h b em{color:var(--mute2)}
.th-h span{font-size:14px}
.th-sub{font-size:14px;color:var(--mute)}
@property --p{syntax:"<percentage>";inherits:false;initial-value:0%}
.bbwrap{display:grid;gap:8px;margin-top:16px}
/* гриф: ряд высотой 84 под блины, ось через их середину; номер упражнения под блином */
.bbell{position:relative;display:flex;align-items:flex-start;gap:2px;width:max-content;max-width:100%;padding-right:28px;overflow-x:auto;scrollbar-width:none}
